name: Update TWSE Stock Data

on:

  # 手動執行
  workflow_dispatch:

  # 台灣時間週一～週五 14:40
  # GitHub Actions cron 使用 UTC
  # 06:40 UTC = 台灣 14:40
  schedule:
    - cron: "40 6 * * 1-5"


permissions:
  contents: write


jobs:

  update-stock-data:

    runs-on: ubuntu-latest


    steps:

      # ---------------------------------------
      # 1. Checkout
      # ---------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------
      # 2. Setup Python
      # ---------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # ---------------------------------------
      # 3. 抓 TWSE 資料 + 過濾純個股
      # ---------------------------------------

      - name: Download and filter TWSE stock data
        run: |

          python <<'PY'

          import json
          import urllib.request

          from datetime import datetime
          from zoneinfo import ZoneInfo


          BASE_URL = "https://openapi.twse.com.tw/v1"


          MARKET_API = (
              BASE_URL
              + "/exchangeReport/STOCK_DAY_ALL"
          )


          COMPANY_API = (
              BASE_URL
              + "/opendata/t187ap03_L"
          )


          # -----------------------------------
          # 共用 API 讀取函式
          # -----------------------------------

          def fetch_json(url):

              print(f"Fetching: {url}")

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 TWSE-GitHub-Dashboard",

                      "Accept":
                          "application/json"
                  }
              )


              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  raw = response.read()


              data = json.loads(
                  raw.decode("utf-8-sig")
              )


              if not isinstance(data, list):

                  raise RuntimeError(
                      f"API did not return array: {url}"
                  )


              return data


          # -----------------------------------
          # 4. 抓每日成交資訊
          # -----------------------------------

          market_data = fetch_json(
              MARKET_API
          )


          print(
              "Market records:",
              len(market_data)
          )


          if len(market_data) < 100:

              raise RuntimeError(
                  "Market API returned too few records."
              )


          # -----------------------------------
          # 5. 抓上市公司基本資料
          # -----------------------------------

          company_data = fetch_json(
              COMPANY_API
          )


          print(
              "Company records:",
              len(company_data)
          )


          if len(company_data) < 100:

              raise RuntimeError(
                  "Company API returned too few records."
              )


          # -----------------------------------
          # 6. 建立「真正上市公司」白名單
          #
          # t187ap03_L 使用：
          #
          # 公司代號
          # 公司簡稱
          # -----------------------------------

          company_codes = set()


          for company in company_data:

              if not isinstance(
                  company,
                  dict
              ):
                  continue


              code = str(
                  company.get(
                      "公司代號",
                      ""
                  )
              ).strip()


              if not code:
                  continue


              company_codes.add(
                  code
              )


          print(
              "Listed company codes:",
              len(company_codes)
          )


          if len(company_codes) < 500:

              raise RuntimeError(
                  "Too few listed company codes."
              )


          # -----------------------------------
          # 7. STOCK_DAY_ALL
          #    與公司白名單取交集
          # -----------------------------------

          stock_data = []


          for stock in market_data:

              if not isinstance(
                  stock,
                  dict
              ):
                  continue


              code = str(
                  stock.get(
                      "Code",
                      ""
                  )
              ).strip()


              close = str(
                  stock.get(
                      "ClosingPrice",
                      ""
                  )
              ).strip()


              # 沒有代號
              if not code:
                  continue


              # 非上市公司
              # ETF / ETN / 權證等會在這裡被排除
              if code not in company_codes:
                  continue


              # 沒有有效收盤價
              if close in (
                  "",
                  "--",
                  "---",
                  "-"
              ):
                  continue


              stock_data.append(
                  stock
              )


          print(
              "Pure listed stocks:",
              len(stock_data)
          )


          # -----------------------------------
          # 保護機制
          #
          # 如果只剩異常少的股票
          # 就不要覆蓋原本資料
          # -----------------------------------

          if len(stock_data) < 500:

              raise RuntimeError(
                  "Too few pure stock records. "
                  "Abort update."
              )


          # -----------------------------------
          # 8. 找資料交易日期
          # -----------------------------------

          trade_date = ""


          if stock_data:

              trade_date = str(
                  stock_data[0].get(
                      "Date",
                      ""
                  )
              ).strip()


          # -----------------------------------
          # 9. 更新時間
          # -----------------------------------

          taipei_now = datetime.now(
              ZoneInfo(
                  "Asia/Taipei"
              )
          )


          # -----------------------------------
          # 10. 輸出 stocks.json
          # -----------------------------------

          output = {

              "updatedAt":
                  taipei_now.strftime(
                      "%Y-%m-%d %H:%M:%S"
                  ),

              "tradeDate":
                  trade_date,

              "source":
                  "TWSE STOCK_DAY_ALL + t187ap03_L",

              "type":
                  "TWSE_LISTED_STOCK_ONLY",

              "count":
                  len(stock_data),

              "data":
                  stock_data
          }


          with open(
              "stocks.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("-------------------------")
          print("stocks.json updated")
          print("-------------------------")

          print(
              "Trade date:",
              trade_date
          )

          print(
              "Pure stocks:",
              len(stock_data)
          )

          PY


      # ---------------------------------------
      # 11. 檢查輸出
      # ---------------------------------------

      - name: Show stocks.json info
        run: |

          echo "stocks.json size:"
          ls -lh stocks.json

          echo ""

          echo "First 25 lines:"
          head -n 25 stocks.json


      # ---------------------------------------
      # 12. Commit
      # ---------------------------------------

      - name: Commit stock data
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add stocks.json


          if git diff \
            --cached \
            --quiet
          then

            echo "No changes."

          else

            git commit \
              -m "chore: update TWSE listed stocks only"

            git push

          fi
