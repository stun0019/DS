name: Update Taiwan Stock Data

on:
  workflow_dispatch:

  # 台灣時間週一～週五 17:40
  # GitHub Actions 使用 UTC
  # 09:40 UTC = 台灣 17:40
  schedule:
    - cron: "40 9 * * 1-5"

permissions:
  contents: write


jobs:

  update-stock-data:

    runs-on: ubuntu-latest

    steps:

      # =======================================
      # 1. Checkout
      # =======================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =======================================
      # 2. Python
      # =======================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # =======================================
      # 3. Build stocks.json
      # =======================================

      - name: Download TWSE and TPEx stock data
        run: |

          python <<'PY'

          import json
          import re
          import time
          import urllib.parse
          import urllib.request

          from datetime import datetime
          from zoneinfo import ZoneInfo


          # ==================================================
          # API
          # ==================================================

          TWSE_OPENAPI = (
              "https://openapi.twse.com.tw/v1"
          )

          TWSE_WEB = (
              "https://www.twse.com.tw"
          )

          TPEX_OPENAPI = (
              "https://www.tpex.org.tw/openapi/v1"
          )


          # --------------------------------------------------
          # TWSE
          # --------------------------------------------------

          TWSE_MARKET_API = (
              TWSE_OPENAPI
              + "/exchangeReport/STOCK_DAY_ALL"
          )

          TWSE_COMPANY_API = (
              TWSE_OPENAPI
              + "/opendata/t187ap03_L"
          )


          # --------------------------------------------------
          # TPEx
          #
          # 改用 latest quotes
          # 不再使用 daily_close_quotes 當主資料
          # --------------------------------------------------

          TPEX_MARKET_API = (
              TPEX_OPENAPI
              + "/tpex_mainboard_quotes"
          )

          TPEX_COMPANY_API = (
              TPEX_OPENAPI
              + "/mopsfin_t187ap03_O"
          )

          TPEX_ODD_API = (
              TPEX_OPENAPI
              + "/tpex_odd_stock"
          )

          TPEX_FIXED_API = (
              TPEX_OPENAPI
              + "/tpex_off_market"
          )

          TPEX_BLOCK_API = (
              TPEX_OPENAPI
              + "/tpex_daily_trading_block"
          )


          # ==================================================
          # Industry
          # ==================================================

          INDUSTRY_MAP = {

              "01": "水泥工業",
              "02": "食品工業",
              "03": "塑膠工業",
              "04": "紡織纖維",
              "05": "電機機械",
              "06": "電器電纜",

              "08": "玻璃陶瓷",
              "09": "造紙工業",
              "10": "鋼鐵工業",
              "11": "橡膠工業",
              "12": "汽車工業",

              "14": "建材營造",
              "15": "航運業",
              "16": "觀光餐旅",
              "17": "金融保險",
              "18": "貿易百貨",
              "19": "綜合",
              "20": "其他",

              "21": "化學工業",
              "22": "生技醫療業",
              "23": "油電燃氣業",

              "24": "半導體業",
              "25": "電腦及週邊設備業",
              "26": "光電業",
              "27": "通信網路業",
              "28": "電子零組件業",
              "29": "電子通路業",
              "30": "資訊服務業",
              "31": "其他電子業",

              "35": "綠能環保",
              "36": "數位雲端",
              "37": "運動休閒",
              "38": "居家生活"
          }


          # ==================================================
          # HTTP
          # ==================================================

          def fetch_json(
              url,
              required=True
          ):

              print(
                  f"Fetching: {url}"
              )

              last_error = None


              for attempt in range(
                  1,
                  4
              ):

                  try:

                      if "tpex.org.tw" in url:

                          referer = (
                              "https://www.tpex.org.tw/"
                          )

                      else:

                          referer = (
                              "https://www.twse.com.tw/"
                          )


                      request = urllib.request.Request(

                          url,

                          headers={

                              "User-Agent":
                                  (
                                      "Mozilla/5.0 "
                                      "Taiwan-Stock-Dashboard"
                                  ),

                              "Accept":
                                  (
                                      "application/json,"
                                      "text/plain,*/*"
                                  ),

                              "Referer":
                                  referer
                          }
                      )


                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:

                          raw = response.read()


                      return json.loads(
                          raw.decode(
                              "utf-8-sig"
                          )
                      )


                  except Exception as error:

                      last_error = error

                      print(
                          f"Attempt {attempt} failed:",
                          repr(
                              error
                          )
                      )


                      if attempt < 3:

                          time.sleep(
                              attempt * 2
                          )


              if required:

                  raise RuntimeError(
                      f"API failed: {url}\n"
                      f"{last_error}"
                  )


              print(
                  "Optional API failed:",
                  url
              )

              return []


          # ==================================================
          # Helpers
          # ==================================================

          def clean_text(
              value
          ):

              text = str(
                  value
                  if value is not None
                  else ""
              )

              text = re.sub(
                  r"<[^>]+>",
                  "",
                  text
              )

              return (
                  text
                  .replace(
                      "\u3000",
                      " "
                  )
                  .replace(
                      "&nbsp;",
                      " "
                  )
                  .strip()
              )


          def normalize_key(
              value
          ):

              return (
                  clean_text(
                      value
                  )
                  .replace(
                      " ",
                      ""
                  )
                  .replace(
                      "_",
                      ""
                  )
                  .lower()
              )


          def to_int(
              value
          ):

              text = (
                  clean_text(
                      value
                  )
                  .replace(
                      ",",
                      ""
                  )
                  .replace(
                      "+",
                      ""
                  )
                  .strip()
              )


              if text in (
                  "",
                  "-",
                  "--",
                  "---",
                  "----"
              ):

                  return 0


              try:

                  return int(
                      float(
                          text
                      )
                  )

              except Exception:

                  text = re.sub(
                      r"[^0-9.\-]",
                      "",
                      text
                  )


                  try:

                      return int(
                          float(
                              text
                          )
                      )

                  except Exception:

                      return 0


          def normalize_code(
              value
          ):

              text = clean_text(
                  value
              )

              text = (
                  text
                  .replace(
                      '="',
                      ""
                  )
                  .replace(
                      '"',
                      ""
                  )
                  .replace(
                      "=",
                      ""
                  )
              )

              return re.sub(
                  r"[^0-9A-Za-z]",
                  "",
                  text
              ).strip()


          def normalize_industry_code(
              value
          ):

              text = clean_text(
                  value
              )

              if not text:

                  return ""

              if text.isdigit():

                  return text.zfill(
                      2
                  )

              return text


          def get_industry(
              value
          ):

              raw = clean_text(
                  value
              )

              code = (
                  normalize_industry_code(
                      raw
                  )
              )

              name = INDUSTRY_MAP.get(
                  code,
                  raw if raw else "未分類"
              )

              return (
                  code,
                  name
              )


          def normalize_trade_date(
              value
          ):

              raw = re.sub(
                  r"\D",
                  "",
                  str(
                      value or ""
                  )
              )


              # ROC 1150812
              if len(
                  raw
              ) == 7:

                  return raw


              # Gregorian 20260812
              if len(
                  raw
              ) == 8:

                  year = (
                      int(
                          raw[:4]
                      )
                      -
                      1911
                  )

                  return (
                      f"{year:03d}"
                      f"{raw[4:]}"
                  )


              return ""


          def roc_to_gregorian(
              value
          ):

              raw = normalize_trade_date(
                  value
              )

              if len(
                  raw
              ) != 7:

                  raise RuntimeError(
                      f"Invalid ROC date: {value}"
                  )

              return (
                  f"{int(raw[:3]) + 1911}"
                  f"{raw[3:]}"
              )


          # ==================================================
          # Generic dict
          # ==================================================

          def pick_value(
              row,
              candidates,
              default=""
          ):

              if not isinstance(
                  row,
                  dict
              ):

                  return default


              # Exact match
              for candidate in candidates:

                  if candidate in row:

                      value = row.get(
                          candidate
                      )

                      if value not in (
                          None,
                          ""
                      ):

                          return value


              normalized_candidates = {

                  normalize_key(
                      candidate
                  )

                  for candidate
                  in candidates
              }


              for key, value in row.items():

                  if (
                      normalize_key(
                          key
                      )
                      in
                      normalized_candidates
                  ):

                      if value not in (
                          None,
                          ""
                      ):

                          return value


              return default


          def unwrap_records(
              payload
          ):

              if isinstance(
                  payload,
                  list
              ):

                  return payload


              if not isinstance(
                  payload,
                  dict
              ):

                  return []


              for key in (
                  "data",
                  "Data",
                  "result",
                  "results"
              ):

                  rows = payload.get(
                      key
                  )

                  if isinstance(
                      rows,
                      list
                  ):

                      return rows


              return []


          # ==================================================
          # Date matching
          #
          # 避免 API 一次回傳多日資料後
          # 被全部加總
          # ==================================================

          DATE_KEYS = [

              "Date",
              "TradeDate",
              "TradingDate",
              "資料日期",
              "交易日期",
              "日期"
          ]


          def row_matches_date(
              row,
              target_roc
          ):

              if not isinstance(
                  row,
                  dict
              ):

                  return True


              raw_date = pick_value(
                  row,
                  DATE_KEYS,
                  ""
              )


              # endpoint 沒有日期欄位
              # 視為 latest snapshot
              if not raw_date:

                  return True


              normalized = (
                  normalize_trade_date(
                      raw_date
                  )
              )


              if not normalized:

                  return True


              return (
                  normalized
                  ==
                  target_roc
              )


          # ==================================================
          # TWSE table parser
          # ==================================================

          def iter_twse_tables(
              payload
          ):

              if not isinstance(
                  payload,
                  dict
              ):

                  return


              fields = payload.get(
                  "fields"
              )

              data = payload.get(
                  "data"
              )


              if (
                  isinstance(
                      fields,
                      list
                  )
                  and
                  isinstance(
                      data,
                      list
                  )
              ):

                  yield (
                      fields,
                      data
                  )


              for index in range(
                  1,
                  40
              ):

                  fields = payload.get(
                      f"fields{index}"
                  )

                  data = payload.get(
                      f"data{index}"
                  )


                  if (
                      isinstance(
                          fields,
                          list
                      )
                      and
                      isinstance(
                          data,
                          list
                      )
                  ):

                      yield (
                          fields,
                          data
                      )


              tables = payload.get(
                  "tables"
              )


              if isinstance(
                  tables,
                  list
              ):

                  for table in tables:

                      if not isinstance(
                          table,
                          dict
                      ):

                          continue


                      fields = table.get(
                          "fields"
                      )

                      data = table.get(
                          "data"
                      )


                      if (
                          isinstance(
                              fields,
                              list
                          )
                          and
                          isinstance(
                              data,
                              list
                          )
                      ):

                          yield (
                              fields,
                              data
                          )


          def find_field_index(
              fields,
              candidates
          ):

              normalized_fields = [

                  normalize_key(
                      field
                  )

                  for field
                  in fields
              ]


              normalized_candidates = [

                  normalize_key(
                      candidate
                  )

                  for candidate
                  in candidates
              ]


              for index, field in enumerate(
                  normalized_fields
              ):

                  for candidate in (
                      normalized_candidates
                  ):

                      if candidate in field:

                          return index


              return None


          def extract_twse_volume_map(
              payload,
              volume_fields,
              multiplier=1
          ):

              result = {}


              for fields, rows in (
                  iter_twse_tables(
                      payload
                  )
              ):

                  code_index = (
                      find_field_index(

                          fields,

                          [
                              "證券代號",
                              "股票代號",
                              "公司代號",
                              "Code"
                          ]
                      )
                  )


                  volume_index = (
                      find_field_index(
                          fields,
                          volume_fields
                      )
                  )


                  if (
                      code_index is None
                      or
                      volume_index is None
                  ):

                      continue


                  for row in rows:

                      if not isinstance(
                          row,
                          list
                      ):

                          continue


                      if len(
                          row
                      ) <= max(
                          code_index,
                          volume_index
                      ):

                          continue


                      code = normalize_code(
                          row[
                              code_index
                          ]
                      )


                      # 排除合計
                      if (
                          not code
                          or
                          code in (
                              "TOTAL",
                              "合計",
                              "總計"
                          )
                      ):

                          continue


                      volume = (
                          to_int(
                              row[
                                  volume_index
                              ]
                          )
                          *
                          multiplier
                      )


                      result[
                          code
                      ] = (
                          result.get(
                              code,
                              0
                          )
                          +
                          volume
                      )


              return result


          def fetch_twse_report(
              urls,
              volume_fields,
              multiplier=1,
              required=True
          ):

              errors = []


              for url in urls:

                  try:

                      payload = fetch_json(
                          url
                      )


                      if isinstance(
                          payload,
                          dict
                      ):

                          stat = clean_text(
                              payload.get(
                                  "stat",
                                  "OK"
                              )
                          )


                          if (
                              stat
                              and
                              stat != "OK"
                          ):

                              raise RuntimeError(
                                  f"TWSE stat={stat}"
                              )


                      result = (
                          extract_twse_volume_map(

                              payload,

                              volume_fields,

                              multiplier
                          )
                      )


                      print(
                          "Parsed",
                          len(
                              result
                          ),
                          "records"
                      )


                      return (
                          result,
                          url
                      )


                  except Exception as error:

                      errors.append(
                          f"{url}: {error}"
                      )


              if required:

                  raise RuntimeError(
                      "TWSE report failed:\n"
                      +
                      "\n".join(
                          errors
                      )
                  )


              return (
                  {},
                  ""
              )


          # ==================================================
          # TPEx parser
          # ==================================================

          TPEX_CODE_KEYS = [

              "SecuritiesCompanyCode",
              "SecuritiesCode",
              "StockCode",
              "Code",

              "證券代號",
              "股票代號",
              "公司代號",
              "代號"
          ]


          TPEX_NAME_KEYS = [

              "CompanyName",
              "SecuritiesCompanyName",
              "SecuritiesName",
              "StockName",
              "Name",

              "公司簡稱",
              "證券名稱",
              "名稱"
          ]


          VOLUME_KEYS = [

              "TradingShares",
              "TradingVolume",
              "TransactionShares",
              "Volume",

              "成交股數",
              "成交量",
              "成交數量"
          ]


          def extract_tpex_volume_map(
              payload,
              target_date,
              multiplier=1
          ):

              result = {}


              for row in unwrap_records(
                  payload
              ):

                  if not isinstance(
                      row,
                      dict
                  ):

                      continue


                  if not row_matches_date(
                      row,
                      target_date
                  ):

                      continue


                  code = normalize_code(
                      pick_value(
                          row,
                          TPEX_CODE_KEYS,
                          ""
                      )
                  )


                  if not code:

                      continue


                  volume = to_int(
                      pick_value(
                          row,
                          VOLUME_KEYS,
                          0
                      )
                  )


                  # 部分欄位若明確標示「張」
                  # 自動轉成股
                  for key in row.keys():

                      key_normalized = (
                          normalize_key(
                              key
                          )
                      )

                      if (
                          normalize_key(
                              key
                          )
                          in
                          {
                              normalize_key(
                                  item
                              )
                              for item
                              in VOLUME_KEYS
                          }
                      ):

                          if (
                              "張"
                              in clean_text(
                                  key
                              )
                              or
                              "千股"
                              in clean_text(
                                  key
                              )
                          ):

                              volume *= 1000

                          break


                  volume *= multiplier


                  result[
                      code
                  ] = (
                      result.get(
                          code,
                          0
                      )
                      +
                      volume
                  )


              return result


          # ==================================================
          #
          # TWSE
          #
          # ==================================================

          print("")
          print(
              "=============================="
          )
          print(
              "TWSE"
          )
          print(
              "=============================="
          )


          # ==================================================
          # 1. Market
          # ==================================================

          twse_market_data = fetch_json(
              TWSE_MARKET_API
          )


          twse_company_data = fetch_json(
              TWSE_COMPANY_API
          )


          if (
              not isinstance(
                  twse_market_data,
                  list
              )
              or
              len(
                  twse_market_data
              ) < 500
          ):

              raise RuntimeError(
                  "TWSE market data too small"
              )


          # ==================================================
          # 2. Company whitelist
          # ==================================================

          twse_company_info = {}


          for company in (
              twse_company_data
          ):

              if not isinstance(
                  company,
                  dict
              ):

                  continue


              code = normalize_code(
                  company.get(
                      "公司代號",
                      ""
                  )
              )


              if not code:

                  continue


              (
                  industry_code,
                  industry_name
              ) = get_industry(
                  company.get(
                      "產業別",
                      ""
                  )
              )


              twse_company_info[
                  code
              ] = {

                  "IndustryCode":
                      industry_code,

                  "Industry":
                      industry_name
              }


          # ==================================================
          # 3. Listed stocks only
          # ==================================================

          twse_stocks = []


          for stock in twse_market_data:

              if not isinstance(
                  stock,
                  dict
              ):

                  continue


              code = normalize_code(
                  stock.get(
                      "Code",
                      ""
                  )
              )


              if (
                  not code
                  or
                  code not in twse_company_info
              ):

                  continue


              close = clean_text(
                  stock.get(
                      "ClosingPrice",
                      ""
                  )
              )


              if close in (
                  "",
                  "-",
                  "--",
                  "---"
              ):

                  continue


              item = dict(
                  stock
              )


              item.update(
                  twse_company_info[
                      code
                  ]
              )


              item[
                  "Market"
              ] = "TWSE"


              item[
                  "MarketName"
              ] = "上市"


              twse_stocks.append(
                  item
              )


          if len(
              twse_stocks
          ) < 500:

              raise RuntimeError(
                  "Too few TWSE stocks"
              )


          # ==================================================
          # 4. Trade Date
          # ==================================================

          trade_date = normalize_trade_date(
              twse_stocks[
                  0
              ].get(
                  "Date",
                  ""
              )
          )


          if not trade_date:

              raise RuntimeError(
                  "Cannot detect TWSE trade date"
              )


          gregorian_date = (
              roc_to_gregorian(
                  trade_date
              )
          )


          print(
              "Trade date:",
              trade_date,
              gregorian_date
          )


          # ==================================================
          # 5. TWSE Intraday Odd Lot
          # ==================================================

          common_params = (
              urllib.parse.urlencode({

                  "date":
                      gregorian_date,

                  "selectType":
                      "ALLBUT0999",

                  "response":
                      "json"
              })
          )


          (
              twse_intraday_odd,
              twse_intraday_source
          ) = fetch_twse_report(

              [

                  (
                      TWSE_WEB
                      + "/rwd/zh/afterTrading/"
                      + "TWTC7U?"
                      + common_params
                  ),

                  (
                      TWSE_WEB
                      + "/exchangeReport/"
                      + "TWTC7U?"
                      + common_params
                  )
              ],

              [
                  "成交股數"
              ]
          )


          # ==================================================
          # 6. TWSE After-hours Odd Lot
          # ==================================================

          (
              twse_after_odd,
              twse_after_odd_source
          ) = fetch_twse_report(

              [

                  (
                      TWSE_WEB
                      + "/rwd/zh/afterTrading/"
                      + "TWT53U?"
                      + common_params
                  ),

                  (
                      TWSE_WEB
                      + "/exchangeReport/"
                      + "TWT53U?"
                      + common_params
                  )
              ],

              [
                  "成交股數"
              ]
          )


          # ==================================================
          # 7. TWSE After-hours Fixed Price
          #
          # BFT41U 股票成交數量單位 = 千股
          # 所以 × 1000
          # ==================================================

          (
              twse_fixed,
              twse_fixed_source
          ) = fetch_twse_report(

              [

                  (
                      TWSE_WEB
                      + "/rwd/zh/afterTrading/"
                      + "BFT41U?"
                      + common_params
                  ),

                  (
                      TWSE_WEB
                      + "/exchangeReport/"
                      + "BFT41U?"
                      + common_params
                  )
              ],

              [
                  "成交數量"
              ],

              multiplier=1000
          )


          # ==================================================
          # 8. TWSE Block
          #
          # BFIAUU
          # 單位：股
          # 同股票多筆交易全部加總
          # ==================================================

          block_params = (
              urllib.parse.urlencode({

                  "date":
                      gregorian_date,

                  "response":
                      "json",

                  "selectType":
                      "S"
              })
          )


          (
              twse_block,
              twse_block_source
          ) = fetch_twse_report(

              [

                  (
                      TWSE_WEB
                      + "/block/BFIAUU?"
                      + block_params
                  )
              ],

              [
                  "成交股數"
              ],

              multiplier=1,

              required=False
          )


          # ==================================================
          # 9. TWSE Regular Session Volume
          #
          # STOCK_DAY_ALL
          # - intraday odd
          # - after-hours odd
          # - fixed price
          # - block
          # ==================================================

          for stock in twse_stocks:

              code = stock[
                  "Code"
              ]


              total_volume = to_int(
                  stock.get(
                      "TradeVolume",
                      0
                  )
              )


              intraday_odd = (
                  twse_intraday_odd.get(
                      code,
                      0
                  )
              )


              after_odd = (
                  twse_after_odd.get(
                      code,
                      0
                  )
              )


              fixed_volume = (
                  twse_fixed.get(
                      code,
                      0
                  )
              )


              block_volume = (
                  twse_block.get(
                      code,
                      0
                  )
              )


              odd_total = (
                  intraday_odd
                  +
                  after_odd
              )


              regular_volume = max(

                  0,

                  total_volume

                  -
                  odd_total

                  -
                  fixed_volume

                  -
                  block_volume
              )


              stock[
                  "TotalTradeVolume"
              ] = (
                  total_volume
              )


              stock[
                  "IntradayOddLotVolume"
              ] = (
                  intraday_odd
              )


              stock[
                  "AfterHoursOddLotVolume"
              ] = (
                  after_odd
              )


              stock[
                  "OddLotVolume"
              ] = (
                  odd_total
              )


              stock[
                  "AfterHoursFixedVolume"
              ] = (
                  fixed_volume
              )


              stock[
                  "BlockTradeVolume"
              ] = (
                  block_volume
              )


              stock[
                  "RegularSessionVolume"
              ] = (
                  regular_volume
              )


              # index.html 相容
              stock[
                  "AdjustedTradeVolume"
              ] = (
                  regular_volume
              )


              stock[
                  "RegularTradeVolume"
              ] = (
                  regular_volume
              )


          # ==================================================
          #
          # TPEx
          #
          # ==================================================

          print("")
          print(
              "=============================="
          )
          print(
              "TPEx"
          )
          print(
              "=============================="
          )


          # ==================================================
          # 10. TPEx Market
          # ==================================================

          tpex_market_payload = fetch_json(
              TPEX_MARKET_API
          )


          tpex_market_data = (
              unwrap_records(
                  tpex_market_payload
              )
          )


          tpex_company_payload = fetch_json(
              TPEX_COMPANY_API
          )


          tpex_company_data = (
              unwrap_records(
                  tpex_company_payload
              )
          )


          if len(
              tpex_market_data
          ) < 500:

              raise RuntimeError(
                  "TPEx market data too small"
              )


          if len(
              tpex_company_data
          ) < 500:

              raise RuntimeError(
                  "TPEx company data too small"
              )


          print(
              "TPEx market:",
              len(
                  tpex_market_data
              )
          )


          # ==================================================
          # 11. TPEx company whitelist
          # ==================================================

          tpex_company_info = {}


          for company in (
              tpex_company_data
          ):

              if not isinstance(
                  company,
                  dict
              ):

                  continue


              code = normalize_code(
                  pick_value(

                      company,

                      [
                          "公司代號",
                          "SecuritiesCompanyCode",
                          "StockCode",
                          "Code"
                      ],

                      ""
                  )
              )


              if not code:

                  continue


              (
                  industry_code,
                  industry_name
              ) = get_industry(

                  pick_value(

                      company,

                      [
                          "產業別",
                          "Industry",
                          "IndustryCode",
                          "產業類別"
                      ],

                      ""
                  )
              )


              tpex_company_info[
                  code
              ] = {

                  "IndustryCode":
                      industry_code,

                  "Industry":
                      industry_name
              }


          # ==================================================
          # 12. TPEx components
          # ==================================================

          tpex_odd_payload = fetch_json(
              TPEX_ODD_API,
              required=False
          )


          tpex_fixed_payload = fetch_json(
              TPEX_FIXED_API,
              required=False
          )


          tpex_block_payload = fetch_json(
              TPEX_BLOCK_API,
              required=False
          )


          tpex_odd = extract_tpex_volume_map(

              tpex_odd_payload,

              trade_date
          )


          tpex_fixed = extract_tpex_volume_map(

              tpex_fixed_payload,

              trade_date
          )


          tpex_block = extract_tpex_volume_map(

              tpex_block_payload,

              trade_date
          )


          print(
              "TPEx odd:",
              len(
                  tpex_odd
              )
          )


          print(
              "TPEx fixed:",
              len(
                  tpex_fixed
              )
          )


          print(
              "TPEx block:",
              len(
                  tpex_block
              )
          )


          # ==================================================
          # 13. TPEx normalize
          # ==================================================

          tpex_stocks = []


          seen_tpex = set()


          for row in tpex_market_data:

              if not isinstance(
                  row,
                  dict
              ):

                  continue


              if not row_matches_date(
                  row,
                  trade_date
              ):

                  continue


              code = normalize_code(
                  pick_value(
                      row,
                      TPEX_CODE_KEYS,
                      ""
                  )
              )


              if (
                  not code
                  or
                  code not in tpex_company_info
              ):

                  continue


              # 防止 API 多筆歷史資料
              if code in seen_tpex:

                  continue


              seen_tpex.add(
                  code
              )


              name = clean_text(
                  pick_value(
                      row,
                      TPEX_NAME_KEYS,
                      ""
                  )
              )


              close = clean_text(
                  pick_value(

                      row,

                      [
                          "Close",
                          "ClosingPrice",
                          "收盤",
                          "收盤價"
                      ],

                      ""
                  )
              )


              if close in (
                  "",
                  "-",
                  "--",
                  "---"
              ):

                  continue


              total_volume = to_int(
                  pick_value(
                      row,
                      VOLUME_KEYS,
                      0
                  )
              )


              odd_volume = (
                  tpex_odd.get(
                      code,
                      0
                  )
              )


              fixed_volume = (
                  tpex_fixed.get(
                      code,
                      0
                  )
              )


              block_volume = (
                  tpex_block.get(
                      code,
                      0
                  )
              )


              regular_volume = max(

                  0,

                  total_volume

                  -
                  odd_volume

                  -
                  fixed_volume

                  -
                  block_volume
              )


              item = {

                  "Date":
                      trade_date,

                  "Code":
                      code,

                  "Name":
                      name,

                  "TradeVolume":
                      str(
                          total_volume
                      ),

                  "TradeValue":
                      str(
                          to_int(
                              pick_value(

                                  row,

                                  [
                                      "TransactionAmount",
                                      "TradingAmount",
                                      "TradeValue",
                                      "成交金額",
                                      "成交金額(元)"
                                  ],

                                  0
                              )
                          )
                      ),

                  "Transaction":
                      str(
                          to_int(
                              pick_value(

                                  row,

                                  [
                                      "TransactionNumber",
                                      "Transactions",
                                      "Transaction",
                                      "成交筆數"
                                  ],

                                  0
                              )
                          )
                      ),

                  "OpeningPrice":
                      clean_text(
                          pick_value(

                              row,

                              [
                                  "Open",
                                  "OpeningPrice",
                                  "開盤",
                                  "開盤價"
                              ],

                              ""
                          )
                      ),

                  "HighestPrice":
                      clean_text(
                          pick_value(

                              row,

                              [
                                  "High",
                                  "HighestPrice",
                                  "最高",
                                  "最高價"
                              ],

                              ""
                          )
                      ),

                  "LowestPrice":
                      clean_text(
                          pick_value(

                              row,

                              [
                                  "Low",
                                  "LowestPrice",
                                  "最低",
                                  "最低價"
                              ],

                              ""
                          )
                      ),

                  "ClosingPrice":
                      close,

                  "Change":
                      clean_text(
                          pick_value(

                              row,

                              [
                                  "Change",
                                  "ChangeAmount",
                                  "漲跌",
                                  "漲跌價差"
                              ],

                              "0"
                          )
                      ),

                  "IndustryCode":
                      tpex_company_info[
                          code
                      ][
                          "IndustryCode"
                      ],

                  "Industry":
                      tpex_company_info[
                          code
                      ][
                          "Industry"
                      ],

                  "Market":
                      "TPEX",

                  "MarketName":
                      "上櫃",

                  "TotalTradeVolume":
                      total_volume,

                  "IntradayOddLotVolume":
                      0,

                  "AfterHoursOddLotVolume":
                      0,

                  "OddLotVolume":
                      odd_volume,

                  "AfterHoursFixedVolume":
                      fixed_volume,

                  "BlockTradeVolume":
                      block_volume,

                  "RegularSessionVolume":
                      regular_volume,

                  # index.html 相容
                  "AdjustedTradeVolume":
                      regular_volume,

                  "RegularTradeVolume":
                      regular_volume
              }


              tpex_stocks.append(
                  item
              )


          if len(
              tpex_stocks
          ) < 500:

              raise RuntimeError(
                  "Too few TPEx stocks after normalization: "
                  +
                  str(
                      len(
                          tpex_stocks
                      )
                  )
              )


          # ==================================================
          # 14. Merge
          # ==================================================

          all_stocks = (
              twse_stocks
              +
              tpex_stocks
          )


          if len(
              all_stocks
          ) < 1400:

              raise RuntimeError(
                  "Combined stock count too small: "
                  +
                  str(
                      len(
                          all_stocks
                      )
                  )
              )


          all_stocks.sort(
              key=lambda stock: (

                  stock.get(
                      "Market",
                      ""
                  ),

                  stock.get(
                      "Code",
                      ""
                  )
              )
          )


          # ==================================================
          # 15. TOP 10 preview
          # ==================================================

          candidate_preview = sorted(

              all_stocks,

              key=lambda stock:
                  to_int(
                      stock.get(
                          "RegularSessionVolume",
                          0
                      )
                  ),

              reverse=True

          )[:10]


          print("")
          print(
              "=============================="
          )
          print(
              "Regular Session Volume TOP 10"
          )
          print(
              "=============================="
          )


          for index, stock in enumerate(
              candidate_preview,
              start=1
          ):

              print(

                  index,

                  stock.get(
                      "MarketName"
                  ),

                  stock.get(
                      "Code"
                  ),

                  stock.get(
                      "Name"
                  ),

                  round(
                      to_int(
                          stock.get(
                              "RegularSessionVolume",
                              0
                          )
                      )
                      /
                      1000
                  ),

                  "張"
              )


          # ==================================================
          # 16. Debug
          #
          # 2344 / 6770 只用來看 Actions Log
          # 不影響計算
          # ==================================================

          verify_codes = {

              "2344",
              "6770"
          }


          print("")
          print(
              "=============================="
          )
          print(
              "Volume Verification"
          )
          print(
              "=============================="
          )


          for stock in all_stocks:

              if (
                  stock.get(
                      "Code"
                  )
                  not in verify_codes
              ):

                  continue


              print("")
              print(
                  stock.get(
                      "MarketName"
                  ),
                  stock.get(
                      "Code"
                  ),
                  stock.get(
                      "Name"
                  )
              )


              print(
                  "Total:",
                  stock.get(
                      "TotalTradeVolume"
                  )
              )


              print(
                  "Odd:",
                  stock.get(
                      "OddLotVolume"
                  )
              )


              print(
                  "Fixed:",
                  stock.get(
                      "AfterHoursFixedVolume"
                  )
              )


              print(
                  "Block:",
                  stock.get(
                      "BlockTradeVolume"
                  )
              )


              print(
                  "Regular:",
                  stock.get(
                      "RegularSessionVolume"
                  )
              )


              print(
                  "Regular lots:",
                  round(
                      to_int(
                          stock.get(
                              "RegularSessionVolume"
                          )
                      )
                      /
                      1000,
                      3
                  )
              )


          # ==================================================
          # 17. Output
          # ==================================================

          taipei_now = datetime.now(
              ZoneInfo(
                  "Asia/Taipei"
              )
          )


          output = {

              "updatedAt":
                  taipei_now.strftime(
                      "%Y-%m-%d %H:%M:%S"
                  ),

              "tradeDate":
                  trade_date,

              "source":
                  (
                      "TWSE + TPEx official data"
                  ),

              "type":
                  "TWSE_TPEX_STOCK_ONLY",

              "volumeMode":
                  "REGULAR_SESSION_ONLY",

              "volumeFormula":
                  (
                      "TotalTradeVolume "
                      "- OddLotVolume "
                      "- AfterHoursFixedVolume "
                      "- BlockTradeVolume"
                  ),

              "count":
                  len(
                      all_stocks
                  ),

              "marketCounts": {

                  "TWSE":
                      len(
                          twse_stocks
                      ),

                  "TPEX":
                      len(
                          tpex_stocks
                      )
              },

              "data":
                  all_stocks
          }


          with open(
              "stocks.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ==================================================
          # 18. Final log
          # ==================================================

          print("")
          print(
              "=============================="
          )
          print(
              "stocks.json updated"
          )
          print(
              "=============================="
          )


          print(
              "Trade Date:",
              trade_date
          )


          print(
              "TWSE:",
              len(
                  twse_stocks
              )
          )


          print(
              "TPEx:",
              len(
                  tpex_stocks
              )
          )


          print(
              "Total:",
              len(
                  all_stocks
              )
          )


          print("")
          print(
              "Volume formula:"
          )


          print(
              "Total"
              " - Odd"
              " - Fixed"
              " - Block"
              " = RegularSessionVolume"
          )


          print("")
          print(
              "TWSE sources:"
          )

          print(
              "Intraday odd:",
              twse_intraday_source
          )

          print(
              "After-hours odd:",
              twse_after_odd_source
          )

          print(
              "Fixed:",
              twse_fixed_source
          )

          print(
              "Block:",
              twse_block_source
          )

          PY


      # =======================================
      # 4. Validate stocks.json
      # =======================================

      - name: Validate stocks.json
        run: |

          python <<'PY'

          import json


          with open(
              "stocks.json",
              encoding="utf-8"
          ) as file:

              payload = json.load(
                  file
              )


          stocks = payload.get(
              "data",
              []
          )


          if not stocks:

              raise SystemExit(
                  "stocks.json is empty"
              )


          print(
              "Total:",
              payload.get(
                  "count"
              )
          )


          print(
              "Markets:",
              payload.get(
                  "marketCounts"
              )
          )


          print(
              "Volume mode:",
              payload.get(
                  "volumeMode"
              )
          )


          print(
              "Formula:",
              payload.get(
                  "volumeFormula"
              )
          )


          invalid = []


          for stock in stocks:

              total = int(
                  stock.get(
                      "TotalTradeVolume",
                      0
                  )
                  or
                  0
              )


              regular = int(
                  stock.get(
                      "RegularSessionVolume",
                      0
                  )
                  or
                  0
              )


              if (
                  regular < 0
                  or
                  regular > total
              ):

                  invalid.append(
                      stock.get(
                          "Code"
                      )
                  )


          if invalid:

              raise SystemExit(
                  "Invalid volume values: "
                  +
                  ", ".join(
                      invalid[:20]
                  )
              )


          print("")
          print(
              "Validation OK"
          )


          top10 = sorted(

              stocks,

              key=lambda stock:
                  int(
                      stock.get(
                          "RegularSessionVolume",
                          0
                      )
                      or
                      0
                  ),

              reverse=True

          )[:10]


          print("")
          print(
              "TOP 10"
          )


          for index, stock in enumerate(
              top10,
              1
          ):

              print(

                  index,

                  stock.get(
                      "MarketName"
                  ),

                  stock.get(
                      "Code"
                  ),

                  stock.get(
                      "Name"
                  ),

                  round(
                      int(
                          stock.get(
                              "RegularSessionVolume",
                              0
                          )
                          or
                          0
                      )
                      /
                      1000
                  ),

                  "張"
              )

          PY


      # =======================================
      # 5. stocks.json info
      # =======================================

      - name: Show stocks.json info
        run: |

          ls -lh stocks.json

          echo ""

          head -n 35 stocks.json


      # =======================================
      # 6. Commit
      # =======================================

      - name: Commit stock data
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add stocks.json


          if git diff \
            --cached \
            --quiet
          then

            echo "No changes."

          else

            git commit \
              -m "chore: update regular-session TWSE and TPEx volumes"

            git push

          fi
