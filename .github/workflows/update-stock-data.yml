name: Update Taiwan Stock Data

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 08:15，刷新今日當沖／先賣資格
    - cron: "15 0 * * 1-5"
    # 台灣時間 17:40
    - cron: "40 9 * * 1-5"
    # 台灣時間 18:00 / 18:20 / 18:40
    - cron: "0,20,40 10 * * 1-5"
    # 台灣時間 19:00 / 19:20 / 19:40
    - cron: "0,20,40 11 * * 1-5"
    # 台灣時間 20:00 最後補抓
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-taiwan-stock-data
  cancel-in-progress: false

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download TWSE and TPEx stock data
        id: market_data
        run: python scripts/update_stock_data.py

      - name: Enrich TPEx industry metadata
        if: steps.market_data.outputs.skip_update != 'true'
        run: python scripts/enrich_tpex_industry.py

      - name: Enrich day-trading eligibility
        if: steps.market_data.outputs.skip_update != 'true'
        run: python scripts/enrich_day_trade_eligibility.py

      - name: Validate stocks.json
        if: steps.market_data.outputs.skip_update != 'true'
        run: python scripts/validate_stock_data.py

      - name: Show stocks.json info
        if: steps.market_data.outputs.skip_update != 'true'
        run: |
          ls -lh stocks.json
          head -n 55 stocks.json

      - name: Commit stock data
        if: steps.market_data.outputs.skip_update != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.json

          if git diff --cached --quiet
          then
            echo "No changes. stocks.json remains unchanged."
          else
            git commit -m "chore: update synchronized Taiwan stock data"
            git push
          fi
