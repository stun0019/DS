name: Update Taiwan Stock Data

on:
  workflow_dispatch:

  # 台灣時間週一～週五 15:10
  # GitHub Actions cron = UTC
  # 07:10 UTC = 台灣 15:10
  schedule:
    - cron: "10 7 * * 1-5"


permissions:
  contents: write


jobs:

  update-stock-data:

    runs-on: ubuntu-latest


    steps:

      # =======================================
      # 1. Checkout
      # =======================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =======================================
      # 2. Python
      # =======================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # =======================================
      # 3. Build stocks.json
      # =======================================

      - name: Download TWSE and TPEx stock data
        run: |

          python <<'PY'

          import json
          import re
          import time
          import urllib.parse
          import urllib.request

          from datetime import datetime
          from zoneinfo import ZoneInfo


          # ==================================================
          # API
          # ==================================================

          TWSE_OPENAPI = (
              "https://openapi.twse.com.tw/v1"
          )


          TWSE_WEB = (
              "https://www.twse.com.tw"
          )


          TPEX_OPENAPI = (
              "https://www.tpex.org.tw/openapi/v1"
          )


          # -------------------------------
          # TWSE
          # -------------------------------

          TWSE_MARKET_API = (
              TWSE_OPENAPI
              + "/exchangeReport/STOCK_DAY_ALL"
          )


          TWSE_COMPANY_API = (
              TWSE_OPENAPI
              + "/opendata/t187ap03_L"
          )


          # -------------------------------
          # TPEx
          # -------------------------------

          TPEX_MARKET_API = (
              TPEX_OPENAPI
              + "/tpex_mainboard_daily_close_quotes"
          )


          TPEX_COMPANY_API = (
              TPEX_OPENAPI
              + "/mopsfin_t187ap03_O"
          )


          TPEX_ODD_API = (
              TPEX_OPENAPI
              + "/tpex_odd_stock"
          )


          TPEX_OFF_MARKET_API = (
              TPEX_OPENAPI
              + "/tpex_off_market"
          )


          # ==================================================
          # Industry
          # ==================================================

          INDUSTRY_MAP = {

              "01": "水泥工業",
              "02": "食品工業",
              "03": "塑膠工業",
              "04": "紡織纖維",
              "05": "電機機械",
              "06": "電器電纜",

              "08": "玻璃陶瓷",
              "09": "造紙工業",
              "10": "鋼鐵工業",
              "11": "橡膠工業",
              "12": "汽車工業",

              "14": "建材營造",
              "15": "航運業",
              "16": "觀光餐旅",
              "17": "金融保險",
              "18": "貿易百貨",
              "19": "綜合",
              "20": "其他",

              "21": "化學工業",
              "22": "生技醫療業",
              "23": "油電燃氣業",

              "24": "半導體業",
              "25": "電腦及週邊設備業",
              "26": "光電業",
              "27": "通信網路業",
              "28": "電子零組件業",
              "29": "電子通路業",
              "30": "資訊服務業",
              "31": "其他電子業",

              "35": "綠能環保",
              "36": "數位雲端",
              "37": "運動休閒",
              "38": "居家生活"
          }


          # ==================================================
          # HTTP
          # ==================================================

          def fetch_json(
              url,
              required=True
          ):

              print(
                  f"Fetching: {url}"
              )


              last_error = None


              for attempt in range(
                  1,
                  4
              ):

                  try:

                      request = (
                          urllib.request.Request(

                              url,

                              headers={

                                  "User-Agent":
                                      (
                                          "Mozilla/5.0 "
                                          "Taiwan-Stock-Dashboard"
                                      ),

                                  "Accept":
                                      (
                                          "application/json,"
                                          "text/plain,*/*"
                                      ),

                                  "Referer":
                                      (
                                          "https://www.twse.com.tw/"
                                      )
                              }
                          )
                      )


                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:

                          raw = response.read()


                      return json.loads(
                          raw.decode(
                              "utf-8-sig"
                          )
                      )


                  except Exception as error:

                      last_error = error


                      print(
                          f"Attempt {attempt} failed:",
                          repr(
                              error
                          )
                      )


                      if attempt < 3:

                          time.sleep(
                              2 * attempt
                          )


              if required:

                  raise RuntimeError(
                      f"API failed: {url}\n"
                      f"{last_error}"
                  )


              print(
                  "Optional API unavailable:",
                  url
              )


              return []


          # ==================================================
          # Helpers
          # ==================================================

          def clean_text(
              value
          ):

              text = str(
                  value
                  if value is not None
                  else ""
              )


              text = re.sub(
                  r"<[^>]+>",
                  "",
                  text
              )


              return (
                  text
                  .replace(
                      "\u3000",
                      " "
                  )
                  .replace(
                      "&nbsp;",
                      " "
                  )
                  .strip()
              )


          def to_number_text(
              value
          ):

              return (
                  clean_text(
                      value
                  )
                  .replace(
                      ",",
                      ""
                  )
                  .replace(
                      "+",
                      ""
                  )
                  .strip()
              )


          def to_int(
              value
          ):

              text = (
                  to_number_text(
                      value
                  )
              )


              if text in (
                  "",
                  "-",
                  "--",
                  "---",
                  "----"
              ):

                  return 0


              try:

                  return int(
                      float(
                          text
                      )
                  )

              except Exception:

                  text = re.sub(
                      r"[^0-9.\-]",
                      "",
                      text
                  )


                  try:

                      return int(
                          float(
                              text
                          )
                      )

                  except Exception:

                      return 0


          def normalize_code(
              value
          ):

              text = clean_text(
                  value
              )


              text = (
                  text
                  .replace(
                      '="',
                      ""
                  )
                  .replace(
                      '"',
                      ""
                  )
                  .replace(
                      "=",
                      ""
                  )
              )


              return re.sub(
                  r"[^0-9A-Za-z]",
                  "",
                  text
              ).strip()


          def normalize_industry_code(
              value
          ):

              text = clean_text(
                  value
              )


              if not text:

                  return ""


              if text.isdigit():

                  return text.zfill(
                      2
                  )


              return text


          def get_industry_name(
              raw_value
          ):

              raw_value = clean_text(
                  raw_value
              )


              industry_code = (
                  normalize_industry_code(
                      raw_value
                  )
              )


              if industry_code in INDUSTRY_MAP:

                  return (
                      industry_code,
                      INDUSTRY_MAP[
                          industry_code
                      ]
                  )


              if raw_value:

                  return (
                      industry_code,
                      raw_value
                  )


              return (
                  "",
                  "未分類"
              )


          def roc_to_gregorian(
              value
          ):

              raw = re.sub(
                  r"\D",
                  "",
                  str(
                      value or ""
                  )
              )


              if len(
                  raw
              ) == 7:

                  return (
                      f"{int(raw[:3]) + 1911}"
                      f"{raw[3:]}"
                  )


              if len(
                  raw
              ) == 8:

                  return raw


              raise RuntimeError(
                  f"Invalid trade date: {value}"
              )


          def normalize_trade_date(
              value
          ):

              raw = re.sub(
                  r"\D",
                  "",
                  str(
                      value or ""
                  )
              )


              if len(
                  raw
              ) == 7:

                  return raw


              if len(
                  raw
              ) == 8:

                  year = int(
                      raw[:4]
                  ) - 1911


                  return (
                      f"{year:03d}"
                      f"{raw[4:]}"
                  )


              return ""


          # ==================================================
          # Generic dictionary helpers
          # ==================================================

          def normalized_key(
              value
          ):

              return (
                  clean_text(
                      value
                  )
                  .replace(
                      " ",
                      ""
                  )
                  .replace(
                      "_",
                      ""
                  )
                  .lower()
              )


          def pick_value(
              row,
              candidates,
              default=""
          ):

              if not isinstance(
                  row,
                  dict
              ):

                  return default


              # Exact key first

              for candidate in candidates:

                  if candidate in row:

                      value = row.get(
                          candidate
                      )


                      if value not in (
                          None,
                          ""
                      ):

                          return value


              # Normalized key

              normalized_candidates = {

                  normalized_key(
                      candidate
                  )

                  for candidate
                  in candidates
              }


              for key, value in row.items():

                  if (
                      normalized_key(
                          key
                      )
                      in
                      normalized_candidates
                  ):

                      if value not in (
                          None,
                          ""
                      ):

                          return value


              return default


          def unwrap_records(
              payload
          ):

              if isinstance(
                  payload,
                  list
              ):

                  return payload


              if not isinstance(
                  payload,
                  dict
              ):

                  return []


              for key in (
                  "data",
                  "Data",
                  "result",
                  "results"
              ):

                  value = payload.get(
                      key
                  )


                  if isinstance(
                      value,
                      list
                  ):

                      return value


              return []


          # ==================================================
          # TWSE Web table parser
          # ==================================================

          def iter_twse_tables(
              payload
          ):

              if not isinstance(
                  payload,
                  dict
              ):

                  return


              fields = payload.get(
                  "fields"
              )


              data = payload.get(
                  "data"
              )


              if (
                  isinstance(
                      fields,
                      list
                  )
                  and
                  isinstance(
                      data,
                      list
                  )
              ):

                  yield (
                      fields,
                      data
                  )


              for index in range(
                  1,
                  40
              ):

                  fields = payload.get(
                      f"fields{index}"
                  )


                  data = payload.get(
                      f"data{index}"
                  )


                  if (
                      isinstance(
                          fields,
                          list
                      )
                      and
                      isinstance(
                          data,
                          list
                      )
                  ):

                      yield (
                          fields,
                          data
                      )


              tables = payload.get(
                  "tables"
              )


              if isinstance(
                  tables,
                  list
              ):

                  for table in tables:

                      if not isinstance(
                          table,
                          dict
                      ):

                          continue


                      fields = table.get(
                          "fields"
                      )


                      data = table.get(
                          "data"
                      )


                      if (
                          isinstance(
                              fields,
                              list
                          )
                          and
                          isinstance(
                              data,
                              list
                          )
                      ):

                          yield (
                              fields,
                              data
                          )


          def find_field_index(
              fields,
              candidates
          ):

              normalized_fields = [

                  normalized_key(
                      item
                  )

                  for item
                  in fields
              ]


              normalized_candidates = [

                  normalized_key(
                      item
                  )

                  for item
                  in candidates
              ]


              for index, field in enumerate(
                  normalized_fields
              ):

                  for candidate in (
                      normalized_candidates
                  ):

                      if candidate in field:

                          return index


              return None


          def extract_twse_volume_map(
              payload,
              volume_fields,
              multiplier=1
          ):

              result = {}


              for fields, rows in iter_twse_tables(
                  payload
              ):

                  code_index = (
                      find_field_index(

                          fields,

                          [
                              "證券代號",
                              "股票代號",
                              "公司代號",
                              "Code"
                          ]
                      )
                  )


                  volume_index = (
                      find_field_index(
                          fields,
                          volume_fields
                      )
                  )


                  if (
                      code_index is None
                      or
                      volume_index is None
                  ):

                      continue


                  for row in rows:

                      if not isinstance(
                          row,
                          list
                      ):

                          continue


                      if len(
                          row
                      ) <= max(
                          code_index,
                          volume_index
                      ):

                          continue


                      code = normalize_code(
                          row[
                              code_index
                          ]
                      )


                      if not code:

                          continue


                      volume = (
                          to_int(
                              row[
                                  volume_index
                              ]
                          )
                          *
                          multiplier
                      )


                      result[
                          code
                      ] = (
                          result.get(
                              code,
                              0
                          )
                          +
                          volume
                      )


              return result


          def fetch_twse_report(
              urls,
              volume_fields,
              multiplier=1,
              minimum_records=1
          ):

              errors = []


              for url in urls:

                  try:

                      payload = fetch_json(
                          url
                      )


                      if isinstance(
                          payload,
                          dict
                      ):

                          stat = clean_text(
                              payload.get(
                                  "stat",
                                  "OK"
                              )
                          )


                          if (
                              stat
                              and
                              stat != "OK"
                          ):

                              raise RuntimeError(
                                  f"TWSE stat={stat}"
                              )


                      result = (
                          extract_twse_volume_map(

                              payload,

                              volume_fields=
                                  volume_fields,

                              multiplier=
                                  multiplier
                          )
                      )


                      print(
                          "Parsed:",
                          len(
                              result
                          ),
                          url
                      )


                      if len(
                          result
                      ) >= minimum_records:

                          return (
                              result,
                              url
                          )


                  except Exception as error:

                      errors.append(
                          str(
                              error
                          )
                      )


              raise RuntimeError(
                  "TWSE report failed:\n"
                  +
                  "\n".join(
                      errors
                  )
              )


          # ==================================================
          # TPEx volume parser
          # ==================================================

          TPEX_CODE_KEYS = [

              "SecuritiesCompanyCode",
              "SecuritiesCode",
              "StockCode",
              "Code",
              "證券代號",
              "股票代號",
              "公司代號",
              "代號"
          ]


          TPEX_VOLUME_KEYS = [

              "TradingShares",
              "TradingVolume",
              "TransactionShares",
              "成交股數",
              "成交量",
              "成交數量"
          ]


          def find_tpex_volume_value(
              row
          ):

              # Exact candidates

              value = pick_value(
                  row,
                  TPEX_VOLUME_KEYS,
                  None
              )


              if value is not None:

                  return (
                      to_int(
                          value
                      ),
                      ""
                  )


              # Fuzzy fallback

              for key, value in row.items():

                  key_text = normalized_key(
                      key
                  )


                  if (
                      "成交金額"
                      in key_text
                      or
                      "amount"
                      in key_text
                  ):

                      continue


                  if (
                      "成交股數"
                      in key_text
                      or
                      "成交數量"
                      in key_text
                      or
                      "tradingshares"
                      in key_text
                      or
                      "tradingvolume"
                      in key_text
                  ):

                      number = to_int(
                          value
                      )


                      # 若欄位明確標示張數
                      if (
                          "張"
                          in clean_text(
                              key
                          )
                      ):

                          number *= 1000


                      return (
                          number,
                          key
                      )


              return (
                  0,
                  ""
              )


          def extract_tpex_volume_map(
              payload
          ):

              result = {}


              for row in unwrap_records(
                  payload
              ):

                  if not isinstance(
                      row,
                      dict
                  ):

                      continue


                  code = normalize_code(
                      pick_value(
                          row,
                          TPEX_CODE_KEYS
                      )
                  )


                  if not code:

                      continue


                  volume, _ = (
                      find_tpex_volume_value(
                          row
                      )
                  )


                  result[
                      code
                  ] = (
                      result.get(
                          code,
                          0
                      )
                      +
                      volume
                  )


              return result


          # ==================================================
          # 1. TWSE daily data
          # ==================================================

          print("")
          print(
              "===== TWSE ====="
          )


          twse_market_data = fetch_json(
              TWSE_MARKET_API
          )


          twse_company_data = fetch_json(
              TWSE_COMPANY_API
          )


          if (
              not isinstance(
                  twse_market_data,
                  list
              )
              or
              len(
                  twse_market_data
              ) < 500
          ):

              raise RuntimeError(
                  "TWSE market data too small"
              )


          if (
              not isinstance(
                  twse_company_data,
                  list
              )
              or
              len(
                  twse_company_data
              ) < 500
          ):

              raise RuntimeError(
                  "TWSE company data too small"
              )


          # ==================================================
          # 2. TWSE company whitelist
          # ==================================================

          twse_company_info = {}


          for company in (
              twse_company_data
          ):

              if not isinstance(
                  company,
                  dict
              ):

                  continue


              code = normalize_code(
                  company.get(
                      "公司代號",
                      ""
                  )
              )


              if not code:

                  continue


              (
                  industry_code,
                  industry_name
              ) = get_industry_name(
                  company.get(
                      "產業別",
                      ""
                  )
              )


              twse_company_info[
                  code
              ] = {

                  "IndustryCode":
                      industry_code,

                  "Industry":
                      industry_name
              }


          # ==================================================
          # 3. TWSE pure listed stocks
          # ==================================================

          twse_stocks = []


          for stock in (
              twse_market_data
          ):

              if not isinstance(
                  stock,
                  dict
              ):

                  continue


              code = normalize_code(
                  stock.get(
                      "Code",
                      ""
                  )
              )


              if (
                  not code
                  or
                  code not in twse_company_info
              ):

                  continue


              close = clean_text(
                  stock.get(
                      "ClosingPrice",
                      ""
                  )
              )


              if close in (
                  "",
                  "-",
                  "--",
                  "---"
              ):

                  continue


              item = dict(
                  stock
              )


              item.update(
                  twse_company_info[
                      code
                  ]
              )


              item[
                  "Market"
              ] = "TWSE"


              item[
                  "MarketName"
              ] = "上市"


              twse_stocks.append(
                  item
              )


          if len(
              twse_stocks
          ) < 500:

              raise RuntimeError(
                  "Too few TWSE stocks"
              )


          # ==================================================
          # 4. Trade date
          # ==================================================

          trade_date = normalize_trade_date(
              twse_stocks[
                  0
              ].get(
                  "Date",
                  ""
              )
          )


          gregorian_date = (
              roc_to_gregorian(
                  trade_date
              )
          )


          print(
              "Trade date:",
              trade_date
          )


          # ==================================================
          # 5. TWSE MI_INDEX
          # ==================================================

          mi_params = (
              urllib.parse.urlencode({

                  "date":
                      gregorian_date,

                  "type":
                      "ALLBUT0999",

                  "response":
                      "json"
              })
          )


          (
              twse_market_volume_map,
              twse_mi_source
          ) = fetch_twse_report(

              [

                  (
                      TWSE_WEB
                      + "/rwd/zh/"
                      + "afterTrading/"
                      + "MI_INDEX?"
                      + mi_params
                  ),

                  (
                      TWSE_WEB
                      + "/exchangeReport/"
                      + "MI_INDEX?"
                      + mi_params
                  )

              ],

              volume_fields=[
                  "成交股數"
              ],

              minimum_records=500
          )


          # ==================================================
          # 6. TWSE odd lots
          # ==================================================

          odd_params = (
              urllib.parse.urlencode({

                  "date":
                      gregorian_date,

                  "selectType":
                      "ALLBUT0999",

                  "response":
                      "json"
              })
          )


          (
              twse_intraday_odd_map,
              twse_intraday_source
          ) = fetch_twse_report(

              [

                  (
                      TWSE_WEB
                      + "/rwd/zh/"
                      + "afterTrading/"
                      + "TWTC7U?"
                      + odd_params
                  ),

                  (
                      TWSE_WEB
                      + "/exchangeReport/"
                      + "TWTC7U?"
                      + odd_params
                  )

              ],

              volume_fields=[
                  "成交股數"
              ],

              minimum_records=1
          )


          (
              twse_after_odd_map,
              twse_after_odd_source
          ) = fetch_twse_report(

              [

                  (
                      TWSE_WEB
                      + "/rwd/zh/"
                      + "afterTrading/"
                      + "TWT53U?"
                      + odd_params
                  ),

                  (
                      TWSE_WEB
                      + "/exchangeReport/"
                      + "TWT53U?"
                      + odd_params
                  )

              ],

              volume_fields=[
                  "成交股數"
              ],

              minimum_records=1
          )


          # ==================================================
          # 7. TWSE after-hours fixed
          #
          # Observation only.
          # NOT deducted.
          # ==================================================

          try:

              (
                  twse_fixed_map,
                  twse_fixed_source
              ) = fetch_twse_report(

                  [

                      (
                          TWSE_WEB
                          + "/rwd/zh/"
                          + "afterTrading/"
                          + "BFT41U?"
                          + odd_params
                      ),

                      (
                          TWSE_WEB
                          + "/exchangeReport/"
                          + "BFT41U?"
                          + odd_params
                      )

                  ],

                  volume_fields=[
                      "成交數量"
                  ],

                  multiplier=1000,

                  minimum_records=1
              )


          except Exception as error:

              print(
                  "TWSE fixed-price optional error:",
                  error
              )


              twse_fixed_map = {}
              twse_fixed_source = ""


          # ==================================================
          # 8. TWSE adjusted volume
          #
          # MI_INDEX
          # - intraday odd lot
          # - after-hours odd lot
          #
          # Fixed-price is NOT deducted.
          # ==================================================

          missing_twse_volume = []


          for stock in twse_stocks:

              code = stock[
                  "Code"
              ]


              if code not in (
                  twse_market_volume_map
              ):

                  missing_twse_volume.append(
                      code
                  )


                  market_volume = to_int(
                      stock.get(
                          "TradeVolume",
                          0
                      )
                  )

              else:

                  market_volume = (
                      twse_market_volume_map[
                          code
                      ]
                  )


              intraday_odd = (
                  twse_intraday_odd_map.get(
                      code,
                      0
                  )
              )


              after_odd = (
                  twse_after_odd_map.get(
                      code,
                      0
                  )
              )


              odd_total = (
                  intraday_odd
                  +
                  after_odd
              )


              adjusted_volume = max(

                  0,

                  market_volume
                  -
                  odd_total
              )


              stock[
                  "VolumeBasis"
              ] = market_volume


              stock[
                  "IntradayOddLotVolume"
              ] = intraday_odd


              stock[
                  "AfterHoursOddLotVolume"
              ] = after_odd


              stock[
                  "OddLotVolume"
              ] = odd_total


              stock[
                  "AfterHoursFixedVolume"
              ] = (
                  twse_fixed_map.get(
                      code,
                      0
                  )
              )


              stock[
                  "AdjustedTradeVolume"
              ] = adjusted_volume


              # Backward compatibility
              stock[
                  "RegularTradeVolume"
              ] = adjusted_volume


          # ==================================================
          # 9. TPEx
          # ==================================================

          print("")
          print(
              "===== TPEx ====="
          )


          tpex_market_payload = fetch_json(
              TPEX_MARKET_API
          )


          tpex_company_payload = fetch_json(
              TPEX_COMPANY_API
          )


          tpex_market_data = (
              unwrap_records(
                  tpex_market_payload
              )
          )


          tpex_company_data = (
              unwrap_records(
                  tpex_company_payload
              )
          )


          if len(
              tpex_market_data
          ) < 500:

              raise RuntimeError(
                  "TPEx market data too small"
              )


          if len(
              tpex_company_data
          ) < 500:

              raise RuntimeError(
                  "TPEx company data too small"
              )


          print(
              "TPEx market records:",
              len(
                  tpex_market_data
              )
          )


          print(
              "TPEx company records:",
              len(
                  tpex_company_data
              )
          )


          # ==================================================
          # 10. TPEx company whitelist
          # ==================================================

          tpex_company_info = {}


          for company in (
              tpex_company_data
          ):

              if not isinstance(
                  company,
                  dict
              ):

                  continue


              code = normalize_code(
                  pick_value(

                      company,

                      [
                          "公司代號",
                          "SecuritiesCompanyCode",
                          "StockCode",
                          "Code"
                      ]
                  )
              )


              if not code:

                  continue


              raw_industry = pick_value(

                  company,

                  [
                      "產業別",
                      "Industry",
                      "IndustryCode",
                      "產業類別"
                  ]
              )


              (
                  industry_code,
                  industry_name
              ) = get_industry_name(
                  raw_industry
              )


              tpex_company_info[
                  code
              ] = {

                  "IndustryCode":
                      industry_code,

                  "Industry":
                      industry_name
              }


          if len(
              tpex_company_info
          ) < 500:

              raise RuntimeError(
                  "Too few TPEx company codes"
              )


          # ==================================================
          # 11. TPEx odd lot
          # ==================================================

          tpex_odd_payload = fetch_json(
              TPEX_ODD_API
          )


          tpex_odd_map = (
              extract_tpex_volume_map(
                  tpex_odd_payload
              )
          )


          print(
              "TPEx odd-lot records:",
              len(
                  tpex_odd_map
              )
          )


          if len(
              tpex_odd_map
          ) < 1:

              raise RuntimeError(
                  "TPEx odd-lot data could not be parsed"
              )


          # ==================================================
          # 12. TPEx fixed price
          #
          # Observation only.
          # ==================================================

          tpex_off_payload = fetch_json(
              TPEX_OFF_MARKET_API,
              required=False
          )


          tpex_off_map = (
              extract_tpex_volume_map(
                  tpex_off_payload
              )
          )


          # ==================================================
          # 13. TPEx normalize
          # ==================================================

          tpex_stocks = []


          for row in (
              tpex_market_data
          ):

              if not isinstance(
                  row,
                  dict
              ):

                  continue


              code = normalize_code(
                  pick_value(
                      row,
                      TPEX_CODE_KEYS
                  )
              )


              if (
                  not code
                  or
                  code not in tpex_company_info
              ):

                  continue


              name = clean_text(
                  pick_value(

                      row,

                      [
                          "CompanyName",
                          "SecuritiesCompanyName",
                          "StockName",
                          "Name",
                          "名稱",
                          "證券名稱",
                          "公司簡稱"
                      ]
                  )
              )


              close = clean_text(
                  pick_value(

                      row,

                      [
                          "Close",
                          "ClosingPrice",
                          "收盤",
                          "收盤價"
                      ]
                  )
              )


              if close in (
                  "",
                  "-",
                  "--",
                  "---"
              ):

                  continue


              raw_volume, _ = (
                  find_tpex_volume_value(
                      row
                  )
              )


              odd_volume = (
                  tpex_odd_map.get(
                      code,
                      0
                  )
              )


              adjusted_volume = max(

                  0,

                  raw_volume
                  -
                  odd_volume
              )


              item = {

                  "Date":
                      trade_date,

                  "Code":
                      code,

                  "Name":
                      name,

                  "TradeVolume":
                      str(
                          raw_volume
                      ),

                  "TradeValue":
                      str(
                          to_int(
                              pick_value(

                                  row,

                                  [
                                      "TransactionAmount",
                                      "TradingAmount",
                                      "TradeValue",
                                      "成交金額",
                                      "成交金額(元)"
                                  ]
                              )
                          )
                      ),

                  "OpeningPrice":
                      clean_text(
                          pick_value(

                              row,

                              [
                                  "Open",
                                  "OpeningPrice",
                                  "開盤",
                                  "開盤價"
                              ]
                          )
                      ),

                  "HighestPrice":
                      clean_text(
                          pick_value(

                              row,

                              [
                                  "High",
                                  "HighestPrice",
                                  "最高",
                                  "最高價"
                              ]
                          )
                      ),

                  "LowestPrice":
                      clean_text(
                          pick_value(

                              row,

                              [
                                  "Low",
                                  "LowestPrice",
                                  "最低",
                                  "最低價"
                              ]
                          )
                      ),

                  "ClosingPrice":
                      close,

                  "Change":
                      clean_text(
                          pick_value(

                              row,

                              [
                                  "Change",
                                  "ChangeAmount",
                                  "漲跌",
                                  "漲跌價差"
                              ],

                              "0"
                          )
                      ),

                  "Transaction":
                      str(
                          to_int(
                              pick_value(

                                  row,

                                  [
                                      "TransactionNumber",
                                      "Transactions",
                                      "Transaction",
                                      "成交筆數"
                                  ]
                              )
                          )
                      ),

                  "IndustryCode":
                      (
                          tpex_company_info[
                              code
                          ][
                              "IndustryCode"
                          ]
                      ),

                  "Industry":
                      (
                          tpex_company_info[
                              code
                          ][
                              "Industry"
                          ]
                      ),

                  "Market":
                      "TPEX",

                  "MarketName":
                      "上櫃",

                  "VolumeBasis":
                      raw_volume,

                  "IntradayOddLotVolume":
                      0,

                  "AfterHoursOddLotVolume":
                      0,

                  "OddLotVolume":
                      odd_volume,

                  "AfterHoursFixedVolume":
                      (
                          tpex_off_map.get(
                              code,
                              0
                          )
                      ),

                  "AdjustedTradeVolume":
                      adjusted_volume,

                  # Backward compatibility
                  "RegularTradeVolume":
                      adjusted_volume
              }


              tpex_stocks.append(
                  item
              )


          if len(
              tpex_stocks
          ) < 500:

              raise RuntimeError(
                  "Too few normalized TPEx stocks"
              )


          # ==================================================
          # 14. Merge
          # ==================================================

          all_stocks = (
              twse_stocks
              +
              tpex_stocks
          )


          all_stocks.sort(
              key=lambda stock: (
                  stock.get(
                      "Market",
                      ""
                  ),
                  stock.get(
                      "Code",
                      ""
                  )
              )
          )


          # ==================================================
          # 15. Sanity check
          # ==================================================

          duplicate_keys = set()
          seen_keys = set()


          for stock in all_stocks:

              key = (
                  stock.get(
                      "Market"
                  ),
                  stock.get(
                      "Code"
                  )
              )


              if key in seen_keys:

                  duplicate_keys.add(
                      key
                  )


              seen_keys.add(
                  key
              )


          if duplicate_keys:

              raise RuntimeError(
                  "Duplicate stocks detected: "
                  +
                  str(
                      list(
                          duplicate_keys
                      )[:20]
                  )
              )


          if len(
              all_stocks
          ) < 1200:

              raise RuntimeError(
                  "Combined TWSE + TPEx "
                  "stock count is unexpectedly low"
              )


          # ==================================================
          # 16. Candidate Preview
          # ==================================================

          candidate_preview = sorted(

              all_stocks,

              key=lambda stock:
                  to_int(
                      stock.get(
                          "AdjustedTradeVolume",
                          0
                      )
                  ),

              reverse=True

          )[:10]


          print("")
          print(
              "===== Candidate TOP 10 ====="
          )


          for index, stock in enumerate(
              candidate_preview,
              start=1
          ):

              print(

                  index,

                  stock.get(
                      "MarketName"
                  ),

                  stock.get(
                      "Code"
                  ),

                  stock.get(
                      "Name"
                  ),

                  round(
                      to_int(
                          stock.get(
                              "AdjustedTradeVolume",
                              0
                          )
                      )
                      /
                      1000
                  ),

                  "lots"
              )


          # ==================================================
          # 17. Output
          # ==================================================

          taipei_now = datetime.now(
              ZoneInfo(
                  "Asia/Taipei"
              )
          )


          output = {

              "updatedAt":
                  taipei_now.strftime(
                      "%Y-%m-%d %H:%M:%S"
                  ),

              "tradeDate":
                  trade_date,

              "source":
                  (
                      "TWSE + TPEx official APIs"
                  ),

              "type":
                  "TWSE_TPEX_STOCK_ONLY",

              "volumeMode":
                  "EXCLUDE_ODD_LOT",

              "volumeFormula":
                  (
                      "Market volume "
                      "- odd-lot volume"
                  ),

              "count":
                  len(
                      all_stocks
                  ),

              "marketCounts": {

                  "TWSE":
                      len(
                          twse_stocks
                      ),

                  "TPEX":
                      len(
                          tpex_stocks
                      )
              },

              "data":
                  all_stocks
          }


          with open(
              "stocks.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ==================================================
          # 18. Log
          # ==================================================

          print("")
          print(
              "================================"
          )

          print(
              "stocks.json updated"
          )

          print(
              "================================"
          )

          print(
              "Trade date:",
              trade_date
          )

          print(
              "TWSE:",
              len(
                  twse_stocks
              )
          )

          print(
              "TPEx:",
              len(
                  tpex_stocks
              )
          )

          print(
              "Total:",
              len(
                  all_stocks
              )
          )

          print(
              "TWSE missing MI_INDEX:",
              len(
                  missing_twse_volume
              )
          )

          print(
              "TWSE MI_INDEX:",
              twse_mi_source
          )

          print(
              "TWSE intraday odd:",
              twse_intraday_source
          )

          print(
              "TWSE after odd:",
              twse_after_odd_source
          )

          print(
              "TWSE fixed:",
              twse_fixed_source
          )

          print(
              "TPEx odd records:",
              len(
                  tpex_odd_map
              )
          )

          print(
              "TPEx fixed records:",
              len(
                  tpex_off_map
              )
          )

          PY


      # =======================================
      # 4. Check output
      # =======================================

      - name: Show stocks.json info
        run: |

          echo "stocks.json:"
          ls -lh stocks.json

          echo ""

          echo "Header:"
          head -n 30 stocks.json

          echo ""

          python <<'PY'

          import json


          with open(
              "stocks.json",
              encoding="utf-8"
          ) as file:

              data = json.load(
                  file
              )


          print(
              "Total:",
              data.get(
                  "count"
              )
          )


          print(
              "Market counts:",
              data.get(
                  "marketCounts"
              )
          )


          stocks = data.get(
              "data",
              []
          )


          top10 = sorted(

              stocks,

              key=lambda stock:
                  int(
                      stock.get(
                          "AdjustedTradeVolume",
                          0
                      )
                      or
                      0
                  ),

              reverse=True

          )[:10]


          print("")
          print(
              "TOP 10:"
          )


          for stock in top10:

              print(
                  stock.get(
                      "MarketName"
                  ),
                  stock.get(
                      "Code"
                  ),
                  stock.get(
                      "Name"
                  ),
                  round(
                      int(
                          stock.get(
                              "AdjustedTradeVolume",
                              0
                          )
                          or
                          0
                      )
                      /
                      1000
                  )
              )

          PY


      # =======================================
      # 5. Commit
      # =======================================

      - name: Commit stock data
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add stocks.json


          if git diff \
            --cached \
            --quiet
          then

            echo "No changes."

          else

            git commit \
              -m "chore: update TWSE and TPEx stock data"

            git push

          fi
