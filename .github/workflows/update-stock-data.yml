                      "Fixed lots:",
                      stock.get(
                          "AfterHoursFixedLots",
                          0
                      )
                  )


              print(
                  "Broker lots:",
                  round(
                      int(
                          stock.get(
                              "BrokerComparableVolume",
                              0
                          )
                          or
                          0
                      )
                      /
                      1000,
                      3
                  )
              )


          # ===================================
          # TOP 10
          # ===================================

          top10 = sorted(

              stocks,

              key=lambda stock:
                  int(
                      stock.get(
                          "BrokerComparableVolume",
                          0
                      )
                      or
                      0
                  ),

              reverse=True

          )[:10]


          print("")
          print(
              "TOP 10"
          )


          for index, stock in enumerate(
              top10,
              1
          ):

              print(

                  index,

                  stock.get(
                      "MarketName"
                  ),

                  stock.get(
                      "Code"
                  ),

                  stock.get(
                      "Name"
                  ),

                  round(
                      int(
                          stock.get(
                              "BrokerComparableVolume",
                              0
                          )
                          or
                          0
                      )
                      /
                      1000
                  ),

                  "張"
              )

          PY


