name: Update TWSE Stock Data

on:

  # 手動執行
  workflow_dispatch:

  # 台灣時間週一～週五 15:10
  # GitHub Actions cron 使用 UTC
  # 07:10 UTC = 台灣 15:10
  #
  # 改到 15:10：
  # 因為盤後零股資料約 15:00 才完整
  schedule:
    - cron: "10 7 * * 1-5"


permissions:
  contents: write


jobs:

  update-stock-data:

    runs-on: ubuntu-latest


    steps:

      # =======================================
      # 1. Checkout
      # =======================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =======================================
      # 2. Setup Python
      # =======================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # =======================================
      # 3. 抓 TWSE
      #
      # STOCK_DAY_ALL
      # 上市公司基本資料
      # 盤中零股 TWTC7U
      # 盤後零股 TWT53U
      #
      # 最終：
      #
      # NonOddLotTradeVolume
      # =
      # TradeVolume
      # - IntradayOddLotVolume
      # - AfterHoursOddLotVolume
      #
      # =======================================

      - name: Download and enrich TWSE stock data
        run: |

          python <<'PY'

          import json
          import re
          import urllib.request
          import urllib.parse

          from datetime import datetime
          from zoneinfo import ZoneInfo


          # ===================================
          # Base URL
          # ===================================

          OPENAPI_BASE = (
              "https://openapi.twse.com.tw/v1"
          )


          TWSE_WEB_BASE = (
              "https://www.twse.com.tw"
          )


          MARKET_API = (
              OPENAPI_BASE
              + "/exchangeReport/STOCK_DAY_ALL"
          )


          COMPANY_API = (
              OPENAPI_BASE
              + "/opendata/t187ap03_L"
          )


          # ===================================
          # TWSE 上市公司產業代碼
          # ===================================

          INDUSTRY_MAP = {

              "01": "水泥工業",
              "02": "食品工業",
              "03": "塑膠工業",
              "04": "紡織纖維",
              "05": "電機機械",
              "06": "電器電纜",

              "08": "玻璃陶瓷",
              "09": "造紙工業",
              "10": "鋼鐵工業",
              "11": "橡膠工業",
              "12": "汽車工業",

              "14": "建材營造",
              "15": "航運業",
              "16": "觀光餐旅",
              "17": "金融保險",
              "18": "貿易百貨",
              "19": "綜合",
              "20": "其他",

              "21": "化學工業",
              "22": "生技醫療業",
              "23": "油電燃氣業",

              "24": "半導體業",
              "25": "電腦及週邊設備業",
              "26": "光電業",
              "27": "通信網路業",
              "28": "電子零組件業",
              "29": "電子通路業",
              "30": "資訊服務業",
              "31": "其他電子業",

              "35": "綠能環保",
              "36": "數位雲端",
              "37": "運動休閒",
              "38": "居家生活"
          }


          # ===================================
          # 通用 API 讀取
          # ===================================

          def fetch_json(url):

              print(
                  f"Fetching: {url}"
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 "
                          "TWSE-GitHub-Dashboard",

                      "Accept":
                          "application/json,text/plain,*/*",

                      "Referer":
                          "https://www.twse.com.tw/"
                  }
              )


              with urllib.request.urlopen(
                  request,
                  timeout=40
              ) as response:

                  raw = response.read()


              return json.loads(
                  raw.decode(
                      "utf-8-sig"
                  )
              )


          # ===================================
          # 清理 HTML / 空白
          # ===================================

          def clean_text(value):

              text = str(
                  value
                  if value is not None
                  else ""
              )


              text = re.sub(
                  r"<[^>]+>",
                  "",
                  text
              )


              text = (
                  text
                  .replace(
                      "\u3000",
                      " "
                  )
                  .replace(
                      "&nbsp;",
                      " "
                  )
                  .strip()
              )


              return text


          # ===================================
          # 數字轉整數
          # ===================================

          def to_int(value):

              text = clean_text(
                  value
              )


              text = (
                  text
                  .replace(
                      ",",
                      ""
                  )
                  .replace(
                      "+",
                      ""
                  )
                  .strip()
              )


              if text in (
                  "",
                  "-",
                  "--",
                  "---"
              ):

                  return 0


              try:

                  return int(
                      float(
                          text
                      )
                  )

              except Exception:

                  digits = re.sub(
                      r"[^\d.-]",
                      "",
                      text
                  )


                  try:

                      return int(
                          float(
                              digits
                          )
                      )

                  except Exception:

                      return 0


          # ===================================
          # 股票代碼清理
          #
          # 例如：
          # ="6770"
          # 6770
          #
          # 都轉成：
          # 6770
          # ===================================

          def normalize_code(value):

              text = clean_text(
                  value
              )


              text = (
                  text
                  .replace(
                      '="',
                      ""
                  )
                  .replace(
                      '"',
                      ""
                  )
                  .replace(
                      "=",
                      ""
                  )
                  .strip()
              )


              return re.sub(
                  r"[^0-9A-Za-z]",
                  "",
                  text
              )


          # ===================================
          # 正規化產業代碼
          # ===================================

          def normalize_industry_code(
              value
          ):

              value = str(
                  value or ""
              ).strip()


              if not value:

                  return ""


              if value.isdigit():

                  return value.zfill(
                      2
                  )


              return value


          # ===================================
          # ROC Date → YYYYMMDD
          #
          # 1150812
          # →
          # 20260812
          # ===================================

          def trade_date_to_gregorian(
              value
          ):

              raw = re.sub(
                  r"\D",
                  "",
                  str(
                      value or ""
                  )
              )


              if len(raw) == 7:

                  roc_year = int(
                      raw[:3]
                  )


                  return (
                      f"{roc_year + 1911}"
                      f"{raw[3:]}"
                  )


              if len(raw) == 8:

                  return raw


              raise RuntimeError(
                  "Invalid trade date: "
                  + str(value)
              )


          # ===================================
          # 從 TWSE 報表 JSON
          # 解析：
          #
          # 股票代碼 → 成交股數
          #
          # 同時支援：
          # fields/data
          # fields1/data1
          # tables[]
          # list[dict]
          # ===================================

          def extract_volume_map(
              payload
          ):

              result = {}


              # -------------------------------
              # OpenAPI list[dict]
              # -------------------------------

              if isinstance(
                  payload,
                  list
              ):

                  for row in payload:

                      if not isinstance(
                          row,
                          dict
                      ):
                          continue


                      code = normalize_code(
                          row.get(
                              "Code",
                              row.get(
                                  "證券代號",
                                  row.get(
                                      "股票代號",
                                      ""
                                  )
                              )
                          )
                      )


                      volume = to_int(
                          row.get(
                              "TradeVolume",
                              row.get(
                                  "成交股數",
                                  0
                              )
                          )
                      )


                      if code:

                          result[
                              code
                          ] = volume


                  return result


              if not isinstance(
                  payload,
                  dict
              ):

                  return result


              candidates = []


              # -------------------------------
              # fields / data
              # -------------------------------

              fields = payload.get(
                  "fields"
              )


              data = payload.get(
                  "data"
              )


              if (
                  isinstance(
                      fields,
                      list
                  )
                  and
                  isinstance(
                      data,
                      list
                  )
              ):

                  candidates.append(
                      (
                          fields,
                          data
                      )
                  )


              # -------------------------------
              # fields1/data1...
              # -------------------------------

              for index in range(
                  1,
                  30
              ):

                  fields = payload.get(
                      f"fields{index}"
                  )


                  data = payload.get(
                      f"data{index}"
                  )


                  if (
                      isinstance(
                          fields,
                          list
                      )
                      and
                      isinstance(
                          data,
                          list
                      )
                  ):

                      candidates.append(
                          (
                              fields,
                              data
                          )
                      )


              # -------------------------------
              # 新版 tables[]
              # -------------------------------

              tables = payload.get(
                  "tables"
              )


              if isinstance(
                  tables,
                  list
              ):

                  for table in tables:

                      if not isinstance(
                          table,
                          dict
                      ):
                          continue


                      fields = table.get(
                          "fields"
                      )


                      data = table.get(
                          "data"
                      )


                      if (
                          isinstance(
                              fields,
                              list
                          )
                          and
                          isinstance(
                              data,
                              list
                          )
                      ):

                          candidates.append(
                              (
                                  fields,
                                  data
                              )
                          )


              # -------------------------------
              # 搜尋證券代號、成交股數欄位
              # -------------------------------

              for fields, rows in candidates:

                  normalized_fields = [
                      clean_text(
                          field
                      )
                      for field in fields
                  ]


                  code_index = None
                  volume_index = None


                  for index, field in enumerate(
                      normalized_fields
                  ):

                      compact = (
                          field
                          .replace(
                              " ",
                              ""
                          )
                          .lower()
                      )


                      if (
                          "證券代號"
                          in compact
                          or
                          "股票代號"
                          in compact
                          or
                          compact == "code"
                      ):

                          code_index = index


                      if (
                          "成交股數"
                          in compact
                          or
                          compact
                          == "tradevolume"
                      ):

                          volume_index = index


                  if (
                      code_index
                      is None
                      or
                      volume_index
                      is None
                  ):

                      continue


                  for row in rows:

                      if not isinstance(
                          row,
                          list
                      ):
                          continue


                      max_index = max(
                          code_index,
                          volume_index
                      )


                      if len(
                          row
                      ) <= max_index:

                          continue


                      code = normalize_code(
                          row[
                              code_index
                          ]
                      )


                      volume = to_int(
                          row[
                              volume_index
                          ]
                      )


                      if code:

                          result[
                              code
                          ] = volume


                  if len(
                      result
                  ) > 100:

                      return result


              return result


          # ===================================
          # 抓指定日期零股報表
          #
          # 優先新版 rwd
          # 再 fallback 舊版 exchangeReport
          # ===================================

          def fetch_odd_lot_report(
              report_code,
              gregorian_date
          ):

              attempts = []


              for select_type in (
                  "ALLBUT0999",
                  "ALL"
              ):

                  params = urllib.parse.urlencode({
                      "response":
                          "json",

                      "date":
                          gregorian_date,

                      "selectType":
                          select_type
                  })


                  attempts.append(
                      (
                          TWSE_WEB_BASE
                          + "/rwd/zh/afterTrading/"
                          + report_code
                          + "?"
                          + params
                      )
                  )


                  attempts.append(
                      (
                          TWSE_WEB_BASE
                          + "/exchangeReport/"
                          + report_code
                          + "?"
                          + params
                      )
                  )


              last_error = None


              for url in attempts:

                  try:

                      payload = fetch_json(
                          url
                      )


                      volume_map = (
                          extract_volume_map(
                              payload
                          )
                      )


                      print(
                          report_code,
                          "records:",
                          len(
                              volume_map
                          )
                      )


                      if len(
                          volume_map
                      ) > 100:

                          return (
                              volume_map,
                              url
                          )


                  except Exception as error:

                      last_error = error


                      print(
                          report_code,
                          "attempt failed:",
                          repr(
                              error
                          )
                      )


              raise RuntimeError(
                  f"{report_code} "
                  "could not be loaded. "
                  f"Last error: {last_error}"
              )


          # ===================================
          # 4. 每日成交資料
          # ===================================

          market_data = fetch_json(
              MARKET_API
          )


          if not isinstance(
              market_data,
              list
          ):

              raise RuntimeError(
                  "Market API did not "
                  "return an array."
              )


          print(
              "Market records:",
              len(
                  market_data
              )
          )


          if len(
              market_data
          ) < 100:

              raise RuntimeError(
                  "Market API returned "
                  "too few records."
              )


          # ===================================
          # 5. 上市公司基本資料
          # ===================================

          company_data = fetch_json(
              COMPANY_API
          )


          if not isinstance(
              company_data,
              list
          ):

              raise RuntimeError(
                  "Company API did not "
                  "return an array."
              )


          print(
              "Company records:",
              len(
                  company_data
              )
          )


          if len(
              company_data
          ) < 100:

              raise RuntimeError(
                  "Company API returned "
                  "too few records."
              )


          # ===================================
          # 6. 建立上市公司 Map
          # ===================================

          company_info = {}


          for company in company_data:

              if not isinstance(
                  company,
                  dict
              ):
                  continue


              code = str(
                  company.get(
                      "公司代號",
                      ""
                  )
              ).strip()


              if not code:

                  continue


              raw_industry = str(
                  company.get(
                      "產業別",
                      ""
                  )
              ).strip()


              industry_code = (
                  normalize_industry_code(
                      raw_industry
                  )
              )


              if (
                  industry_code
                  in
                  INDUSTRY_MAP
              ):

                  industry_name = (
                      INDUSTRY_MAP[
                          industry_code
                      ]
                  )

              elif raw_industry:

                  industry_name = (
                      raw_industry
                  )

              else:

                  industry_name = (
                      "未分類"
                  )


              company_info[
                  code
              ] = {

                  "IndustryCode":
                      industry_code,

                  "Industry":
                      industry_name
              }


          print(
              "Listed company codes:",
              len(
                  company_info
              )
          )


          if len(
              company_info
          ) < 500:

              raise RuntimeError(
                  "Too few listed "
                  "company codes."
              )


          # ===================================
          # 7. 過濾純上市個股
          # ===================================

          stock_data = []


          for stock in market_data:

              if not isinstance(
                  stock,
                  dict
              ):
                  continue


              code = str(
                  stock.get(
                      "Code",
                      ""
                  )
              ).strip()


              close = str(
                  stock.get(
                      "ClosingPrice",
                      ""
                  )
              ).strip()


              if not code:

                  continue


              # ETF / ETN / 權證等排除
              if (
                  code
                  not in
                  company_info
              ):

                  continue


              if close in (
                  "",
                  "--",
                  "---",
                  "-"
              ):

                  continue


              enriched_stock = dict(
                  stock
              )


              enriched_stock[
                  "IndustryCode"
              ] = (
                  company_info[
                      code
                  ][
                      "IndustryCode"
                  ]
              )


              enriched_stock[
                  "Industry"
              ] = (
                  company_info[
                      code
                  ][
                      "Industry"
                  ]
              )


              stock_data.append(
                  enriched_stock
              )


          print(
              "Pure listed stocks:",
              len(
                  stock_data
              )
          )


          if len(
              stock_data
          ) < 500:

              raise RuntimeError(
                  "Too few pure stock "
                  "records. Abort update."
              )


          # ===================================
          # 8. 交易日期
          # ===================================

          trade_date = str(
              stock_data[
                  0
              ].get(
                  "Date",
                  ""
              )
          ).strip()


          gregorian_trade_date = (
              trade_date_to_gregorian(
                  trade_date
              )
          )


          print(
              "Trade date ROC:",
              trade_date
          )


          print(
              "Trade date Gregorian:",
              gregorian_trade_date
          )


          # ===================================
          # 9. 盤中零股
          #
          # TWTC7U
          # ===================================

          intraday_odd_lot_map, intraday_url = (
              fetch_odd_lot_report(
                  "TWTC7U",
                  gregorian_trade_date
              )
          )


          # ===================================
          # 10. 盤後零股
          #
          # TWT53U
          # ===================================

          after_hours_odd_lot_map, after_hours_url = (
              fetch_odd_lot_report(
                  "TWT53U",
                  gregorian_trade_date
              )
          )


          # ===================================
          # 11. 合併零股成交量
          # ===================================

          total_intraday_odd_lot = 0
          total_after_hours_odd_lot = 0


          for stock in stock_data:

              code = str(
                  stock.get(
                      "Code",
                      ""
                  )
              ).strip()


              total_volume = to_int(
                  stock.get(
                      "TradeVolume",
                      0
                  )
              )


              intraday_odd_lot_volume = (
                  intraday_odd_lot_map.get(
                      code,
                      0
                  )
              )


              after_hours_odd_lot_volume = (
                  after_hours_odd_lot_map.get(
                      code,
                      0
                  )
              )


              odd_lot_volume = (
                  intraday_odd_lot_volume
                  +
                  after_hours_odd_lot_volume
              )


              non_odd_lot_volume = max(
                  0,
                  total_volume
                  -
                  odd_lot_volume
              )


              stock[
                  "IntradayOddLotVolume"
              ] = (
                  intraday_odd_lot_volume
              )


              stock[
                  "AfterHoursOddLotVolume"
              ] = (
                  after_hours_odd_lot_volume
              )


              stock[
                  "OddLotVolume"
              ] = (
                  odd_lot_volume
              )


              stock[
                  "NonOddLotTradeVolume"
              ] = (
                  non_odd_lot_volume
              )


              total_intraday_odd_lot += (
                  intraday_odd_lot_volume
              )


              total_after_hours_odd_lot += (
                  after_hours_odd_lot_volume
              )


          # ===================================
          # Debug 力積電
          # ===================================

          for stock in stock_data:

              if str(
                  stock.get(
                      "Code",
                      ""
                  )
              ) == "6770":

                  print("")
                  print(
                      "===== 6770 Debug ====="
                  )

                  print(
                      "Total:",
                      stock.get(
                          "TradeVolume"
                      )
                  )

                  print(
                      "Intraday odd:",
                      stock.get(
                          "IntradayOddLotVolume"
                      )
                  )

                  print(
                      "After-hours odd:",
                      stock.get(
                          "AfterHoursOddLotVolume"
                      )
                  )

                  print(
                      "Odd total:",
                      stock.get(
                          "OddLotVolume"
                      )
                  )

                  print(
                      "Non odd:",
                      stock.get(
                          "NonOddLotTradeVolume"
                      )
                  )

                  print(
                      "======================"
                  )
                  print("")

                  break


          # ===================================
          # 12. 更新時間
          # ===================================

          taipei_now = datetime.now(
              ZoneInfo(
                  "Asia/Taipei"
              )
          )


          # ===================================
          # 13. 輸出 stocks.json
          # ===================================

          output = {

              "updatedAt":
                  taipei_now.strftime(
                      "%Y-%m-%d %H:%M:%S"
                  ),

              "tradeDate":
                  trade_date,

              "source":
                  (
                      "TWSE STOCK_DAY_ALL "
                      "+ t187ap03_L "
                      "+ TWTC7U "
                      "+ TWT53U"
                  ),

              "type":
                  "TWSE_LISTED_STOCK_ONLY",

              "volumeMode":
                  "EXCLUDE_ODD_LOT",

              "oddLotStatus":
                  "complete",

              "count":
                  len(
                      stock_data
                  ),

              "data":
                  stock_data
          }


          with open(
              "stocks.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ===================================
          # 14. Log
          # ===================================

          industry_counts = {}


          for stock in stock_data:

              industry = stock.get(
                  "Industry",
                  "未分類"
              )


              industry_counts[
                  industry
              ] = (
                  industry_counts.get(
                      industry,
                      0
                  )
                  + 1
              )


          print("")
          print(
              "-------------------------"
          )
          print(
              "stocks.json updated"
          )
          print(
              "-------------------------"
          )


          print(
              "Trade date:",
              trade_date
          )


          print(
              "Pure stocks:",
              len(
                  stock_data
              )
          )


          print(
              "Intraday odd-lot records:",
              len(
                  intraday_odd_lot_map
              )
          )


          print(
              "After-hours odd-lot records:",
              len(
                  after_hours_odd_lot_map
              )
          )


          print(
              "Intraday odd-lot shares:",
              total_intraday_odd_lot
          )


          print(
              "After-hours odd-lot shares:",
              total_after_hours_odd_lot
          )


          print(
              "Intraday source:",
              intraday_url
          )


          print(
              "After-hours source:",
              after_hours_url
          )


          print(
              "Industries:",
              len(
                  industry_counts
              )
          )


          print("")
          print(
              "Industry distribution:"
          )


          for industry, count in sorted(
              industry_counts.items(),
              key=lambda item: (
                  -item[1],
                  item[0]
              )
          ):

              print(
                  f"{industry}: {count}"
              )

          PY


      # =======================================
      # 15. 檢查輸出
      # =======================================

      - name: Show stocks.json info
        run: |

          echo "stocks.json size:"
          ls -lh stocks.json

          echo ""

          echo "First 40 lines:"
          head -n 40 stocks.json

          echo ""

          echo "6770:"
          grep -A 25 -B 3 '"Code": "6770"' stocks.json || true


      # =======================================
      # 16. Commit
      # =======================================

      - name: Commit stock data
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add stocks.json


          if git diff \
            --cached \
            --quiet
          then

            echo "No changes."

          else

            git commit \
