name: Update TWSE Stock Data

on:
  workflow_dispatch:

  # 台灣時間週一～週五 15:10
  # GitHub Actions cron 使用 UTC，07:10 UTC = 台灣 15:10
  schedule:
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

jobs:
  update-stock-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download and build TWSE stock data
        run: |
          python <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo


          OPENAPI_BASE = "https://openapi.twse.com.tw/v1"
          TWSE_BASE = "https://www.twse.com.tw"


          MARKET_API = (
              OPENAPI_BASE
              + "/exchangeReport/STOCK_DAY_ALL"
          )


          COMPANY_API = (
              OPENAPI_BASE
              + "/opendata/t187ap03_L"
          )


          INDUSTRY_MAP = {

              "01": "水泥工業",
              "02": "食品工業",
              "03": "塑膠工業",
              "04": "紡織纖維",
              "05": "電機機械",
              "06": "電器電纜",

              "08": "玻璃陶瓷",
              "09": "造紙工業",
              "10": "鋼鐵工業",
              "11": "橡膠工業",
              "12": "汽車工業",

              "14": "建材營造",
              "15": "航運業",
              "16": "觀光餐旅",
              "17": "金融保險",
              "18": "貿易百貨",
              "19": "綜合",
              "20": "其他",

              "21": "化學工業",
              "22": "生技醫療業",
              "23": "油電燃氣業",

              "24": "半導體業",
              "25": "電腦及週邊設備業",
              "26": "光電業",
              "27": "通信網路業",
              "28": "電子零組件業",
              "29": "電子通路業",
              "30": "資訊服務業",
              "31": "其他電子業",

              "35": "綠能環保",
              "36": "數位雲端",
              "37": "運動休閒",
              "38": "居家生活",
          }


          # ===================================
          # API
          # ===================================

          def fetch_json(url):

              print(
                  f"Fetching: {url}"
              )


              request = urllib.request.Request(

                  url,

                  headers={

                      "User-Agent":
                          "Mozilla/5.0 "
                          "TWSE-GitHub-Dashboard",

                      "Accept":
                          "application/json,text/plain,*/*",

                      "Referer":
                          "https://www.twse.com.tw/"
                  }
              )


              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  raw = response.read()


              return json.loads(
                  raw.decode(
                      "utf-8-sig"
                  )
              )


          # ===================================
          # Text
          # ===================================

          def clean_text(value):

              text = str(
                  value
                  if value is not None
                  else ""
              )


              text = re.sub(
                  r"<[^>]+>",
                  "",
                  text
              )


              return (
                  text
                  .replace(
                      "\u3000",
                      " "
                  )
                  .replace(
                      "&nbsp;",
                      " "
                  )
                  .strip()
              )


          # ===================================
          # Number
          # ===================================

          def to_int(value):

              text = (
                  clean_text(
                      value
                  )
                  .replace(
                      ",",
                      ""
                  )
                  .replace(
                      "+",
                      ""
                  )
                  .strip()
              )


              if text in (
                  "",
                  "-",
                  "--",
                  "---"
              ):

                  return 0


              try:

                  return int(
                      float(
                          text
                      )
                  )

              except Exception:

                  text = re.sub(
                      r"[^0-9.\-]",
                      "",
                      text
                  )


                  try:

                      return int(
                          float(
                              text
                          )
                      )

                  except Exception:

                      return 0


          # ===================================
          # Code
          # ===================================

          def normalize_code(value):

              text = clean_text(
                  value
              )


              text = (
                  text
                  .replace(
                      '="',
                      ""
                  )
                  .replace(
                      '"',
                      ""
                  )
                  .replace(
                      "=",
                      ""
                  )
              )


              return re.sub(
                  r"[^0-9A-Za-z]",
                  "",
                  text
              ).strip()


          # ===================================
          # Industry
          # ===================================

          def normalize_industry_code(
              value
          ):

              value = str(
                  value or ""
              ).strip()


              if not value:

                  return ""


              if value.isdigit():

                  return value.zfill(
                      2
                  )


              return value


          # ===================================
          # ROC → Gregorian
          #
          # 1150812
          # →
          # 20260812
          # ===================================

          def roc_to_gregorian(
              value
          ):

              raw = re.sub(
                  r"\D",
                  "",
                  str(
                      value or ""
                  )
              )


              if len(
                  raw
              ) == 7:

                  return (
                      f"{int(raw[:3]) + 1911}"
                      f"{raw[3:]}"
                  )


              if len(
                  raw
              ) == 8:

                  return raw


              raise RuntimeError(
                  f"Invalid TWSE trade date: {value}"
              )


          # ===================================
          # TWSE Table Parser
          # ===================================

          def iter_tables(
              payload
          ):

              if not isinstance(
                  payload,
                  dict
              ):

                  return


              fields = payload.get(
                  "fields"
              )


              data = payload.get(
                  "data"
              )


              if (
                  isinstance(
                      fields,
                      list
                  )
                  and
                  isinstance(
                      data,
                      list
                  )
              ):

                  yield (
                      fields,
                      data
                  )


              for i in range(
                  1,
                  40
              ):

                  fields = payload.get(
                      f"fields{i}"
                  )


                  data = payload.get(
                      f"data{i}"
                  )


                  if (
                      isinstance(
                          fields,
                          list
                      )
                      and
                      isinstance(
                          data,
                          list
                      )
                  ):

                      yield (
                          fields,
                          data
                      )


              tables = payload.get(
                  "tables"
              )


              if isinstance(
                  tables,
                  list
              ):

                  for table in tables:

                      if not isinstance(
                          table,
                          dict
                      ):

                          continue


                      fields = table.get(
                          "fields"
                      )


                      data = table.get(
                          "data"
                      )


                      if (
                          isinstance(
                              fields,
                              list
                          )
                          and
                          isinstance(
                              data,
                              list
                          )
                      ):

                          yield (
                              fields,
                              data
                          )


          # ===================================
          # Find Field
          # ===================================

          def find_field_index(
              fields,
              candidates
          ):

              normalized = [

                  clean_text(
                      item
                  ).replace(
                      " ",
                      ""
                  )

                  for item
                  in fields
              ]


              for index, field in enumerate(
                  normalized
              ):

                  for candidate in candidates:

                      if (
                          candidate
                          .replace(
                              " ",
                              ""
                          )
                          in field
                      ):

                          return index


              return None


          # ===================================
          # Volume Map
          # ===================================

          def extract_volume_map(
              payload,
              volume_fields,
              multiplier=1
          ):

              result = {}


              for fields, rows in iter_tables(
                  payload
              ):

                  code_index = find_field_index(

                      fields,

                      [
                          "證券代號",
                          "股票代號",
                          "公司代號",
                          "Code"
                      ]
                  )


                  volume_index = find_field_index(
                      fields,
                      volume_fields
                  )


                  if (
                      code_index
                      is None
                      or
                      volume_index
                      is None
                  ):

                      continue


                  for row in rows:

                      if not isinstance(
                          row,
                          list
                      ):

                          continue


                      if len(
                          row
                      ) <= max(
                          code_index,
                          volume_index
                      ):

                          continue


                      code = normalize_code(
                          row[
                              code_index
                          ]
                      )


                      if not code:

                          continue


                      volume = (
                          to_int(
                              row[
                                  volume_index
                              ]
                          )
                          *
                          multiplier
                      )


                      result[
                          code
                      ] = (
                          result.get(
                              code,
                              0
                          )
                          +
                          volume
                      )


              return result


          # ===================================
          # Report Downloader
          # ===================================

          def fetch_report_map(
              urls,
              volume_fields,
              multiplier=1,
              minimum_records=1
          ):

              errors = []


              for url in urls:

                  try:

                      payload = fetch_json(
                          url
                      )


                      if isinstance(
                          payload,
                          dict
                      ):

                          stat = clean_text(
                              payload.get(
                                  "stat",
                                  "OK"
                              )
                          )


                          if (
                              stat
                              and
                              stat != "OK"
                          ):

                              raise RuntimeError(
                                  f"TWSE stat={stat}"
                              )


                      result = extract_volume_map(

                          payload,

                          volume_fields=
                              volume_fields,

                          multiplier=
                              multiplier
                      )


                      print(
                          "Parsed records:",
                          len(
                              result
                          )
                      )


                      if len(
                          result
                      ) >= minimum_records:

                          return (
                              result,
                              url
                          )


                      raise RuntimeError(
                          "Parsed only "
                          f"{len(result)} "
                          "records; "
                          "expected >= "
                          f"{minimum_records}"
                      )


                  except Exception as error:

                      errors.append(
                          f"{url}: {error}"
                      )


                      print(
                          "Attempt failed:",
                          repr(
                              error
                          )
                      )


              raise RuntimeError(

                  "All TWSE report "
                  "URLs failed:\n"
                  +
                  "\n".join(
                      errors
                  )
              )


          # ===================================
          # 1. STOCK_DAY_ALL
          #
          # 保留：
          # OHLC
          # 成交金額
          # 成交筆數
          # ===================================

          market_data = fetch_json(
              MARKET_API
          )


          if (
              not isinstance(
                  market_data,
                  list
              )
              or
              len(
                  market_data
              ) < 500
          ):

              raise RuntimeError(
                  "STOCK_DAY_ALL "
                  "returned too few records"
              )


          # ===================================
          # 2. 公司基本資料
          # ===================================

          company_data = fetch_json(
              COMPANY_API
          )


          if (
              not isinstance(
                  company_data,
                  list
              )
              or
              len(
                  company_data
              ) < 500
          ):

              raise RuntimeError(
                  "t187ap03_L "
                  "returned too few records"
              )


          company_info = {}


          for company in company_data:

              if not isinstance(
                  company,
                  dict
              ):

                  continue


              code = str(
                  company.get(
                      "公司代號",
                      ""
                  )
              ).strip()


              if not code:

                  continue


              raw_industry = str(
                  company.get(
                      "產業別",
                      ""
                  )
              ).strip()


              industry_code = (
                  normalize_industry_code(
                      raw_industry
                  )
              )


              industry_name = (
                  INDUSTRY_MAP.get(

                      industry_code,

                      raw_industry
                      if raw_industry
                      else "未分類"
                  )
              )


              company_info[
                  code
              ] = {

                  "IndustryCode":
                      industry_code,

                  "Industry":
                      industry_name
              }


          if len(
              company_info
          ) < 500:

              raise RuntimeError(
                  "Too few listed "
                  "company codes"
              )


          # ===================================
          # 3. 純上市個股
          # ===================================

          stock_data = []


          for stock in market_data:

              if not isinstance(
                  stock,
                  dict
              ):

                  continue


              code = str(
                  stock.get(
                      "Code",
                      ""
                  )
              ).strip()


              close = str(
                  stock.get(
                      "ClosingPrice",
                      ""
                  )
              ).strip()


              if (
                  not code
                  or
                  code not in company_info
              ):

                  continue


              if close in (
                  "",
                  "-",
                  "--",
                  "---"
              ):

                  continue


              enriched = dict(
                  stock
              )


              enriched.update(
                  company_info[
                      code
                  ]
              )


              stock_data.append(
                  enriched
              )


          if len(
              stock_data
          ) < 500:

              raise RuntimeError(
                  "Too few pure "
                  "listed stocks"
              )


          # ===================================
          # 4. Trade Date
          # ===================================

          trade_date = str(

              stock_data[
                  0
              ].get(
                  "Date",
                  ""
              )

          ).strip()


          gregorian_date = (
              roc_to_gregorian(
                  trade_date
              )
          )


          print(
              "Trade date ROC:",
              trade_date
          )


          print(
              "Trade date Gregorian:",
              gregorian_date
          )


          # ===================================
          # 5. MI_INDEX
          #
          # 此成交量口徑：
          #
          # 一般交易
          # + 盤中零股
          # + 盤後零股
          # + 盤後定價
          #
          # 不含鉅額交易
          # ===================================

          mi_params = (
              urllib.parse.urlencode({

                  "date":
                      gregorian_date,

                  "type":
                      "ALLBUT0999",

                  "response":
                      "json"
              })
          )


          mi_volume_map, mi_source = (
              fetch_report_map(

                  [

                      (
                          f"{TWSE_BASE}"
                          "/rwd/zh/"
                          "afterTrading/"
                          "MI_INDEX?"
                          f"{mi_params}"
                      ),

                      (
                          f"{TWSE_BASE}"
                          "/exchangeReport/"
                          "MI_INDEX?"
                          f"{mi_params}"
                      )

                  ],

                  volume_fields=[
                      "成交股數"
                  ],

                  multiplier=1,

                  minimum_records=500
              )
          )


          # ===================================
          # 6. 盤中零股
          #
          # 單位：股
          # ===================================

          odd_params = (
              urllib.parse.urlencode({

                  "date":
                      gregorian_date,

                  "selectType":
                      "ALLBUT0999",

                  "response":
                      "json"
              })
          )


          (
              intraday_odd_map,
              intraday_source
          ) = fetch_report_map(

              [

                  (
                      f"{TWSE_BASE}"
                      "/rwd/zh/"
                      "afterTrading/"
                      "TWTC7U?"
                      f"{odd_params}"
                  ),

                  (
                      f"{TWSE_BASE}"
                      "/exchangeReport/"
                      "TWTC7U?"
                      f"{odd_params}"
                  )

              ],

              volume_fields=[
                  "成交股數"
              ],

              multiplier=1,

              minimum_records=1
          )


          # ===================================
          # 7. 盤後零股
          #
          # 單位：股
          # ===================================

          (
              after_odd_map,
              after_odd_source
          ) = fetch_report_map(

              [

                  (
                      f"{TWSE_BASE}"
                      "/rwd/zh/"
                      "afterTrading/"
                      "TWT53U?"
                      f"{odd_params}"
                  ),

                  (
                      f"{TWSE_BASE}"
                      "/exchangeReport/"
                      "TWT53U?"
                      f"{odd_params}"
                  )

              ],

              volume_fields=[
                  "成交股數"
              ],

              multiplier=1,

              minimum_records=1
          )


          # ===================================
          # 8. 盤後定價
          #
          # BFT41U
          #
          # 上市股票「成交數量」
          # 單位為千股
          #
          # 所以 × 1000
          # ===================================

          (
              fixed_map,
              fixed_source
          ) = fetch_report_map(

              [

                  (
                      f"{TWSE_BASE}"
                      "/rwd/zh/"
                      "afterTrading/"
                      "BFT41U?"
                      f"{odd_params}"
                  ),

                  (
                      f"{TWSE_BASE}"
                      "/exchangeReport/"
                      "BFT41U?"
                      f"{odd_params}"
                  )

              ],

              volume_fields=[
                  "成交數量"
              ],

              multiplier=1000,

              minimum_records=1
          )


          # ===================================
          # 9. 一般交易成交量
          #
          # MI_INDEX 已排除鉅額
          #
          # 所以：
          #
          # RegularTradeVolume
          #
          # =
          #
          # MI_INDEX
          # - 盤中零股
          # - 盤後零股
          # - 盤後定價
          # ===================================

          missing_mi_codes = []


          for stock in stock_data:

              code = str(
                  stock.get(
                      "Code",
                      ""
                  )
              ).strip()


              if code not in mi_volume_map:

                  missing_mi_codes.append(
                      code
                  )

                  continue


              market_volume = (
                  mi_volume_map.get(
                      code,
                      0
                  )
              )


              intraday_odd = (
                  intraday_odd_map.get(
                      code,
                      0
                  )
              )


              after_odd = (
                  after_odd_map.get(
                      code,
                      0
                  )
              )


              fixed_volume = (
                  fixed_map.get(
                      code,
                      0
                  )
              )


              odd_total = (
                  intraday_odd
                  +
                  after_odd
              )


              regular_volume = max(

                  0,

                  (
                      market_volume
                      -
                      odd_total
                      -
                      fixed_volume
                  )
              )


              stock[
                  "MarketVolumeExBlock"
              ] = market_volume


              stock[
                  "IntradayOddLotVolume"
              ] = intraday_odd


              stock[
                  "AfterHoursOddLotVolume"
              ] = after_odd


              stock[
                  "OddLotVolume"
              ] = odd_total


              stock[
                  "AfterHoursFixedVolume"
              ] = fixed_volume


              stock[
                  "RegularTradeVolume"
              ] = regular_volume


          if missing_mi_codes:

              raise RuntimeError(

                  "MI_INDEX missing "
                  "listed stock codes: "
                  +
                  ", ".join(
                      missing_mi_codes[
                          :20
                      ]
                  )
                  +
                  (
                      " ..."
                      if len(
                          missing_mi_codes
                      ) > 20
                      else ""
                  )
              )


          # ===================================
          # 10. Output
          # ===================================

          taipei_now = datetime.now(
              ZoneInfo(
                  "Asia/Taipei"
              )
          )


          output = {

              "updatedAt":
                  taipei_now.strftime(
                      "%Y-%m-%d %H:%M:%S"
                  ),

              "tradeDate":
                  trade_date,

              "source":
                  (
                      "TWSE STOCK_DAY_ALL "
                      "+ t187ap03_L "
                      "+ MI_INDEX "
                      "+ TWTC7U "
                      "+ TWT53U "
                      "+ BFT41U"
                  ),

              "type":
                  "TWSE_LISTED_STOCK_ONLY",

              "volumeMode":
                  "REGULAR_TRADING_ONLY",

              "volumeFormula":
                  (
                      "MI_INDEX "
                      "- IntradayOddLotVolume "
                      "- AfterHoursOddLotVolume "
                      "- AfterHoursFixedVolume"
                  ),

              "count":
                  len(
                      stock_data
                  ),

              "data":
                  stock_data
          }


          with open(
              "stocks.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ===================================
          # 11. Debug
          #
          # 2344 / 6770 只是 Log 驗證
          # 不會寫死任何成交量
          # ===================================

          verify_codes = {
              "2344",
              "6770"
          }


          for stock in stock_data:

              if str(
                  stock.get(
                      "Code",
                      ""
                  )
              ) not in verify_codes:

                  continue


              print("")
              print(
                  "============================"
              )


              print(
                  stock.get(
                      "Code"
                  ),
                  stock.get(
                      "Name"
                  )
              )


              print(
                  "STOCK_DAY_ALL:",
                  stock.get(
                      "TradeVolume"
                  )
              )


              print(
                  "MI_INDEX no block:",
                  stock.get(
                      "MarketVolumeExBlock"
                  )
              )


              print(
                  "Intraday odd:",
                  stock.get(
                      "IntradayOddLotVolume"
                  )
              )


              print(
                  "After-hours odd:",
                  stock.get(
                      "AfterHoursOddLotVolume"
                  )
              )


              print(
                  "After-hours fixed:",
                  stock.get(
                      "AfterHoursFixedVolume"
                  )
              )


              print(
                  "Regular volume:",
                  stock.get(
                      "RegularTradeVolume"
                  )
              )


              print(
                  "Regular lots:",
                  (
                      to_int(
                          stock.get(
                              "RegularTradeVolume"
                          )
                      )
                      /
                      1000
                  )
              )


              print(
                  "============================"
              )


          print("")
          print(
              "stocks.json updated"
          )


          print(
              "Trade date:",
              trade_date
          )


          print(
              "Stocks:",
              len(
                  stock_data
              )
          )


          print(
              "MI_INDEX source:",
              mi_source
          )


          print(
              "Intraday odd source:",
              intraday_source
          )


          print(
              "After-hours odd source:",
              after_odd_source
          )


          print(
              "After-hours fixed source:",
              fixed_source
          )

          PY


      - name: Show stocks.json info
        run: |

          ls -lh stocks.json

          echo ""

          head -n 25 stocks.json

          echo ""

          echo "2344 / 6770 sample:"

          grep \
            -A 24 \
            -B 3 \
            '"Code": "2344"\|"Code": "6770"' \
            stocks.json \
            || true


      - name: Commit stock data
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add stocks.json


          if git diff \
            --cached \
            --quiet
          then

            echo "No changes."

          else

            git commit \
              -m "chore: update regular-session TWSE stock volume"

            git push

          fi
