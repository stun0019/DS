name: Update Taiwan Stock Data

on:
  workflow_dispatch:

  # 台灣時間週一～週五 17:40
  # GitHub Actions 使用 UTC
  # 09:40 UTC = 台灣 17:40
  schedule:
    - cron: "40 9 * * 1-5"

permissions:
  contents: write

jobs:
  update-stock-data:
    runs-on: ubuntu-latest

    steps:

      # =======================================
      # 1. Checkout
      # =======================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =======================================
      # 2. Python
      # =======================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # =======================================
      # 3. Build stocks.json
      # =======================================

      - name: Download TWSE and TPEx stock data
        run: |

          python <<'PY'

          import json
          import re
          import ssl
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          from datetime import datetime
          from zoneinfo import ZoneInfo


          # ==================================================
          # API
          # ==================================================

          TWSE_OPENAPI = "https://openapi.twse.com.tw/v1"
          TWSE_WEB = "https://www.twse.com.tw"
          TPEX_OPENAPI = "https://www.tpex.org.tw/openapi/v1"


          # --------------------------------------------------
          # TWSE
          # --------------------------------------------------

          TWSE_MARKET_API = (
              TWSE_OPENAPI
              + "/exchangeReport/STOCK_DAY_ALL"
          )

          TWSE_COMPANY_API = (
              TWSE_OPENAPI
              + "/opendata/t187ap03_L"
          )


          # --------------------------------------------------
          # TPEx
          # --------------------------------------------------

          # 上櫃股票「收盤行情」
          #
          # 這個 TradingShares 對應等價成交系統成交量。
          #
          # 寶雅 5904：
          #
          # mainboard_quotes = 84,375 張
          #
          TPEX_MARKET_API = (
              TPEX_OPENAPI
              + "/tpex_mainboard_quotes"
          )

          TPEX_COMPANY_API = (
              TPEX_OPENAPI
              + "/mopsfin_t187ap03_O"
          )

          # 零股
          # 只保留稽核資料
          # 不參與 TPEx BrokerComparableVolume
          TPEX_ODD_API = (
              TPEX_OPENAPI
              + "/tpex_odd_stock"
          )

          # 盤後定價
          #
          # 重要：
          # 此成交量需要加回 mainboard_quotes
          #
          # 一般股票交易單位 = 1 張 = 1000 股
          #
          TPEX_FIXED_API = (
              TPEX_OPENAPI
              + "/tpex_off_market"
          )

          # 鉅額
          # 只保留稽核資料
          # 不參與 TPEx BrokerComparableVolume
          TPEX_BLOCK_API = (
              TPEX_OPENAPI
              + "/tpex_daily_qutoes_block"
          )


          # ==================================================
          # Industry
          # ==================================================

          INDUSTRY_MAP = {

              "01": "水泥工業",
              "02": "食品工業",
              "03": "塑膠工業",
              "04": "紡織纖維",
              "05": "電機機械",
              "06": "電器電纜",

              "08": "玻璃陶瓷",
              "09": "造紙工業",
              "10": "鋼鐵工業",
              "11": "橡膠工業",
              "12": "汽車工業",

              "14": "建材營造",
              "15": "航運業",
              "16": "觀光餐旅",
              "17": "金融保險",
              "18": "貿易百貨",
              "19": "綜合",
              "20": "其他",

              "21": "化學工業",
              "22": "生技醫療業",
              "23": "油電燃氣業",

              "24": "半導體業",
              "25": "電腦及週邊設備業",
              "26": "光電業",
              "27": "通信網路業",
              "28": "電子零組件業",
              "29": "電子通路業",
              "30": "資訊服務業",
              "31": "其他電子業",

              "35": "綠能環保",
              "36": "數位雲端",
              "37": "運動休閒",
              "38": "居家生活",
          }


          # ==================================================
          # HTTP
          # ==================================================

          def fetch_json(
              url,
              required=True
          ):

              print(
                  f"Fetching: {url}"
              )

              last_error = None

              for attempt in range(
                  1,
                  4
              ):

                  try:

                      is_tpex = (
                          "tpex.org.tw"
                          in url
                      )

                      referer = (
                          "https://www.tpex.org.tw/"
                          if is_tpex
                          else
                          "https://www.twse.com.tw/"
                      )

                      request = urllib.request.Request(

                          url,

                          headers={

                              "User-Agent":
                                  (
                                      "Mozilla/5.0 "
                                      "Taiwan-Stock-Dashboard"
                                  ),

                              "Accept":
                                  (
                                      "application/json,"
                                      "text/plain,*/*"
                                  ),

                              "Referer":
                                  referer
                          }
                      )

                      context = (
                          ssl.create_default_context()
                      )

                      try:

                          with urllib.request.urlopen(
                              request,
                              timeout=45,
                              context=context
                          ) as response:

                              raw = response.read()

                      except Exception as first_error:

                          cert_error = (

                              isinstance(
                                  first_error,
                                  ssl.SSLCertVerificationError
                              )

                              or

                              (
                                  isinstance(
                                      first_error,
                                      urllib.error.URLError
                                  )
                                  and
                                  isinstance(
                                      getattr(
                                          first_error,
                                          "reason",
                                          None
                                      ),
                                      ssl.SSLCertVerificationError
                                  )
                              )

                              or

                              (
                                  "CERTIFICATE_VERIFY_FAILED"
                                  in repr(
                                      first_error
                                  )
                              )

                              or

                              (
                                  "Missing Subject Key Identifier"
                                  in repr(
                                      first_error
                                  )
                              )
                          )

                          if (
                              not is_tpex
                              or
                              not cert_error
                          ):

                              raise

                          print(
                              "TPEx SSL fallback:",
                              repr(
                                  first_error
                              )
                          )

                          insecure_context = (
                              ssl.create_default_context()
                          )

                          insecure_context.check_hostname = (
                              False
                          )

                          insecure_context.verify_mode = (
                              ssl.CERT_NONE
                          )

                          with urllib.request.urlopen(
                              request,
                              timeout=45,
                              context=insecure_context
                          ) as response:

                              raw = response.read()

                      return json.loads(
                          raw.decode(
                              "utf-8-sig"
                          )
                      )

                  except Exception as error:

                      last_error = error

                      print(
                          f"Attempt {attempt} failed:",
                          repr(
                              error
                          )
                      )

                      if attempt < 3:

                          time.sleep(
                              attempt * 2
                          )

              if required:

                  raise RuntimeError(
                      f"API failed: {url}\n"
                      f"{last_error}"
                  )

              print(
                  "Optional API failed:",
                  url
              )

              return []


          # ==================================================
          # Helpers
          # ==================================================

          def clean_text(
              value
          ):

              text = str(
                  value
                  if value is not None
                  else ""
              )

              text = re.sub(
                  r"<[^>]+>",
                  "",
                  text
              )

              return (
                  text
                  .replace(
                      "\u3000",
                      " "
                  )
                  .replace(
                      "&nbsp;",
                      " "
                  )
                  .strip()
              )


          def normalize_key(
              value
          ):

              return (
                  clean_text(
                      value
                  )
                  .replace(
                      " ",
                      ""
                  )
                  .replace(
                      "_",
                      ""
                  )
                  .replace(
                      "-",
                      ""
                  )
                  .lower()
              )


          def to_int(
              value
          ):

              text = (
                  clean_text(
                      value
                  )
                  .replace(
                      ",",
                      ""
                  )
                  .replace(
                      "+",
                      ""
                  )
                  .strip()
              )

              if text in (
                  "",
                  "-",
                  "--",
                  "---",
                  "----"
              ):

                  return 0

              try:

                  return int(
                      float(
                          text
                      )
                  )

              except Exception:

                  text = re.sub(
                      r"[^0-9.\-]",
                      "",
                      text
                  )

                  try:

                      return int(
                          float(
                              text
                          )
                      )

                  except Exception:

                      return 0


          def normalize_code(
              value
          ):

              text = clean_text(
                  value
              )

              text = (
                  text
                  .replace(
                      '="',
                      ""
                  )
                  .replace(
                      '"',
                      ""
                  )
                  .replace(
                      "=",
                      ""
                  )
              )

              return re.sub(
                  r"[^0-9A-Za-z]",
                  "",
                  text
              ).strip()


          def normalize_industry_code(
              value
          ):

              text = clean_text(
                  value
              )

              if not text:

                  return ""

              if text.isdigit():

                  return text.zfill(
                      2
                  )

              return text


          def get_industry(
              value
          ):

              raw = clean_text(
                  value
              )

              code = (
                  normalize_industry_code(
                      raw
                  )
              )

              name = INDUSTRY_MAP.get(
                  code,
                  raw
                  if raw
                  else "未分類"
              )

              return (
                  code,
                  name
              )


          def normalize_trade_date(
              value
          ):

              raw = re.sub(
                  r"\D",
                  "",
                  str(
                      value or ""
                  )
              )

              # ROC
              # 1150812
              if len(
                  raw
              ) == 7:

                  return raw

              # Gregorian
              # 20260812
              if len(
                  raw
              ) == 8:

                  year = (
                      int(
                          raw[:4]
                      )
                      -
                      1911
                  )

                  return (
                      f"{year:03d}"
                      f"{raw[4:]}"
                  )

              return ""


          def roc_to_gregorian(
              value
          ):

              raw = normalize_trade_date(
                  value
              )

              if len(
                  raw
              ) != 7:

                  raise RuntimeError(
                      f"Invalid ROC date: {value}"
                  )

              return (
                  f"{int(raw[:3]) + 1911}"
                  f"{raw[3:]}"
              )


          # ==================================================
          # Generic dict helpers
          # ==================================================

          def pick_value(
              row,
              candidates,
              default=""
          ):

              if not isinstance(
                  row,
                  dict
              ):

                  return default

              for candidate in candidates:

                  if candidate in row:

                      value = row.get(
                          candidate
                      )

                      if value not in (
                          None,
                          ""
                      ):

                          return value

              normalized_candidates = {

                  normalize_key(
                      candidate
                  )

                  for candidate
                  in candidates
              }

              for key, value in row.items():

                  if (
                      normalize_key(
                          key
                      )
                      in
                      normalized_candidates
                  ):

                      if value not in (
                          None,
                          ""
                      ):

                          return value

              return default


          def unwrap_records(
              payload
          ):

              if isinstance(
                  payload,
                  list
              ):

                  return payload

              if not isinstance(
                  payload,
                  dict
              ):

                  return []

              for key in (
                  "data",
                  "Data",
                  "result",
                  "results"
              ):

                  rows = payload.get(
                      key
                  )

                  if isinstance(
                      rows,
                      list
                  ):

                      return rows

              return []


          # ==================================================
          # Date matching
          # ==================================================

          DATE_KEYS = [

              "Date",
              "TradeDate",
              "TradingDate",
              "TradeDateString",

              "資料日期",
              "交易日期",
              "成交日期",
              "日期"
          ]


          def row_matches_date(
              row,
              target_roc
          ):

              if not isinstance(
                  row,
                  dict
              ):

                  return True

              raw_date = pick_value(
                  row,
                  DATE_KEYS,
                  ""
              )

              # 即時／當日 OpenAPI
              # 有些資料沒有 Date 欄位
              if not raw_date:

                  return True

              normalized = (
                  normalize_trade_date(
                      raw_date
                  )
              )

              if not normalized:

                  return True

              return (
                  normalized
                  ==
                  target_roc
              )


          # ==================================================
          # TWSE table parser
          # ==================================================

          def iter_twse_tables(
              payload
          ):

              if not isinstance(
                  payload,
                  dict
              ):

                  return

              fields = payload.get(
                  "fields"
              )

              data = payload.get(
                  "data"
              )

              if (
                  isinstance(
                      fields,
                      list
                  )
                  and
                  isinstance(
                      data,
                      list
                  )
              ):

                  yield (
                      fields,
                      data
                  )

              for index in range(
                  1,
                  40
              ):

                  fields = payload.get(
                      f"fields{index}"
                  )

                  data = payload.get(
                      f"data{index}"
                  )

                  if (
                      isinstance(
                          fields,
                          list
                      )
                      and
                      isinstance(
                          data,
                          list
                      )
                  ):

                      yield (
                          fields,
                          data
                      )

              tables = payload.get(
                  "tables"
              )

              if isinstance(
                  tables,
                  list
              ):

                  for table in tables:

                      if not isinstance(
                          table,
                          dict
                      ):

                          continue

                      fields = table.get(
                          "fields"
                      )

                      data = table.get(
                          "data"
                      )

                      if (
                          isinstance(
                              fields,
                              list
                          )
                          and
                          isinstance(
                              data,
                              list
                          )
                      ):

                          yield (
                              fields,
                              data
                          )


          def find_field_index(
              fields,
              candidates
          ):

              normalized_fields = [

                  normalize_key(
                      field
                  )

                  for field
                  in fields
              ]

              normalized_candidates = [

                  normalize_key(
                      candidate
                  )

                  for candidate
                  in candidates
              ]

              for index, field in enumerate(
                  normalized_fields
              ):

                  for candidate in (
                      normalized_candidates
                  ):

                      if candidate in field:

                          return index

              return None


          def extract_twse_volume_map(
              payload,
              volume_fields,
              multiplier=1
          ):

              result = {}

              for fields, rows in (
                  iter_twse_tables(
                      payload
                  )
              ):

                  code_index = (
                      find_field_index(

                          fields,

                          [
                              "證券代號",
                              "股票代號",
                              "公司代號",
                              "Code"
                          ]
                      )
                  )

                  volume_index = (
                      find_field_index(
                          fields,
                          volume_fields
                      )
                  )

                  if (
                      code_index is None
                      or
                      volume_index is None
                  ):

                      continue

                  for row in rows:

                      if not isinstance(
                          row,
                          list
                      ):

                          continue

                      if len(
                          row
                      ) <= max(
                          code_index,
                          volume_index
                      ):

                          continue

                      code = normalize_code(
                          row[
                              code_index
                          ]
                      )

                      if (
                          not code
                          or
                          code in (
                              "TOTAL",
                              "合計",
                              "總計"
                          )
                      ):

                          continue

                      volume = (
                          to_int(
                              row[
                                  volume_index
                              ]
                          )
                          *
                          multiplier
                      )

                      result[
                          code
                      ] = (
                          result.get(
                              code,
                              0
                          )
                          +
                          volume
                      )

              return result


          def fetch_twse_report(
              urls,
              volume_fields,
              multiplier=1,
              required=True
          ):

              errors = []

              for url in urls:

                  try:

                      payload = fetch_json(
                          url
                      )

                      if isinstance(
                          payload,
                          dict
                      ):

                          stat = clean_text(
                              payload.get(
                                  "stat",
                                  "OK"
                              )
                          )

                          if (
                              stat
                              and
                              stat != "OK"
                          ):

                              raise RuntimeError(
                                  f"TWSE stat={stat}"
                              )

                      result = (
                          extract_twse_volume_map(

                              payload,

                              volume_fields,

                              multiplier
                          )
                      )

                      print(
                          "Parsed",
                          len(
                              result
                          ),
                          "records"
                      )

                      return (
                          result,
                          url
                      )

                  except Exception as error:

                      errors.append(
                          f"{url}: {error}"
                      )

              if required:

                  raise RuntimeError(
                      "TWSE report failed:\n"
                      +
                      "\n".join(
                          errors
                      )
                  )

              return (
                  {},
                  ""
              )


          # ==================================================
          # TPEx parsers
          # ==================================================

          TPEX_CODE_KEYS = [

              "SecuritiesCompanyCode",
              "SecuritiesCode",
              "StockCode",
              "Code",

              "證券代號",
              "股票代號",
              "公司代號",
              "代號"
          ]


          TPEX_NAME_KEYS = [

              "CompanyName",
              "SecuritiesCompanyName",
              "SecuritiesName",
              "StockName",
              "Name",

              "公司簡稱",
              "證券名稱",
              "名稱"
          ]


          TPEX_VOLUME_KEYS = [

              "TradingShares",
              "TradingVolume",
              "TransactionShares",
              "TradeVolume",
              "Volume",

              "成交股數",
              "成交量",
              "成交數量",
              "成交張數"
          ]


          TPEX_INDUSTRY_KEYS = [

              "產業別",
              "產業類別",

              "Industry",
              "IndustryCode",
              "IndustryCategory"
          ]


          def extract_tpex_volume_map(
              payload,
              target_date
          ):

              result = {}

              for row in unwrap_records(
                  payload
              ):

                  if not isinstance(
                      row,
                      dict
                  ):

                      continue

                  if not row_matches_date(
                      row,
                      target_date
                  ):

                      continue

                  code = normalize_code(
                      pick_value(
                          row,
                          TPEX_CODE_KEYS,
                          ""
                      )
                  )

                  if not code:

                      continue

                  value = pick_value(
                      row,
                      TPEX_VOLUME_KEYS,
                      ""
                  )

                  if value in (
                      "",
                      None
                  ):

                      continue

                  volume = to_int(
                      value
                  )

                  result[
                      code
                  ] = (
                      result.get(
                          code,
                          0
                      )
                      +
                      volume
                  )

              return result


          # ==================================================
          # TPEx盤後定價 parser
          #
          # tpex_off_market 的數量依交易單位
          #
          # 一般股票：
          # 1 單位 = 1張 = 1000股
          #
          # 這裡直接轉成「股」
          # ==================================================

          def extract_tpex_fixed_map(
              payload,
              target_date
          ):

              result = {}

              for row in unwrap_records(
                  payload
              ):

                  if not isinstance(
                      row,
                      dict
                  ):

                      continue

                  if not row_matches_date(
                      row,
                      target_date
                  ):

                      continue

                  code = normalize_code(
                      pick_value(
                          row,
                          TPEX_CODE_KEYS,
                          ""
                      )
                  )

                  if not code:

                      continue

                  raw_units = pick_value(

                      row,

                      [
                          "TradingShares",
                          "TradingVolume",
                          "TransactionShares",
                          "TradeVolume",
                          "Volume",

                          "成交股數",
                          "成交量",
                          "成交數量",
                          "成交張數"
                      ],

                      ""
                  )

                  if raw_units in (
                      "",
                      None
                  ):

                      continue

                  fixed_lots = to_int(
                      raw_units
                  )

                  fixed_shares = (
                      fixed_lots
                      *
                      1000
                  )

                  result[
                      code
                  ] = (
                      result.get(
                          code,
                          0
                      )
                      +
                      fixed_shares
                  )

              return result


          # ==================================================
          # TWSE
          # ==================================================

          print("")
          print(
              "=============================="
          )
          print(
              "TWSE"
          )
          print(
              "=============================="
          )


          # ==================================================
          # 1. Market
          # ==================================================

          twse_market_data = fetch_json(
              TWSE_MARKET_API
          )

          twse_company_data = fetch_json(
              TWSE_COMPANY_API
          )

          if (
              not isinstance(
                  twse_market_data,
                  list
              )
              or
              len(
                  twse_market_data
              ) < 500
          ):

              raise RuntimeError(
                  "TWSE market data too small"
              )


          # ==================================================
          # 2. Company whitelist
          # ==================================================

          twse_company_info = {}

          for company in (
              twse_company_data
          ):

              if not isinstance(
                  company,
                  dict
              ):

                  continue

              code = normalize_code(
                  company.get(
                      "公司代號",
                      ""
                  )
              )

              if not code:

                  continue

              (
                  industry_code,
                  industry_name
              ) = get_industry(
                  company.get(
                      "產業別",
                      ""
                  )
              )

              twse_company_info[
                  code
              ] = {

                  "IndustryCode":
                      industry_code,

                  "Industry":
                      industry_name
              }


          # ==================================================
          # 3. Listed stocks only
          # ==================================================

          twse_stocks = []

          for stock in twse_market_data:

              if not isinstance(
                  stock,
                  dict
              ):

                  continue

              code = normalize_code(
                  stock.get(
                      "Code",
                      ""
                  )
              )

              if (
                  not code
                  or
                  code not in twse_company_info
              ):

                  continue

              close = clean_text(
                  stock.get(
                      "ClosingPrice",
                      ""
                  )
              )

              if close in (
                  "",
                  "-",
                  "--",
                  "---"
              ):

                  continue

              item = dict(
                  stock
              )

              item.update(
                  twse_company_info[
                      code
                  ]
              )

              item[
                  "Market"
              ] = "TWSE"

              item[
                  "MarketName"
              ] = "上市"

              twse_stocks.append(
                  item
              )

          if len(
              twse_stocks
          ) < 500:

              raise RuntimeError(
                  "Too few TWSE stocks"
              )


          # ==================================================
          # 4. Trade Date
          # ==================================================

          trade_date = normalize_trade_date(
              twse_stocks[
                  0
              ].get(
                  "Date",
                  ""
              )
          )

          if not trade_date:

              raise RuntimeError(
                  "Cannot detect TWSE trade date"
              )

