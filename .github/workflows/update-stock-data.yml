name: Update TWSE Stock Data

on:

  # 手動執行
  workflow_dispatch:

  # 台灣時間週一～週五 14:40
  # GitHub Actions cron 使用 UTC
  # 06:40 UTC = 台灣 14:40
  schedule:
    - cron: "40 6 * * 1-5"


permissions:
  contents: write


jobs:

  update-stock-data:

    runs-on: ubuntu-latest


    steps:

      # ---------------------------------------
      # 1. Checkout
      # ---------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------
      # 2. Setup Python
      # ---------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # ---------------------------------------
      # 3. 抓 TWSE 資料
      #    + 過濾純個股
      #    + 加入產業別
      # ---------------------------------------

      - name: Download and enrich TWSE stock data
        run: |

          python <<'PY'

          import json
          import urllib.request

          from datetime import datetime
          from zoneinfo import ZoneInfo


          BASE_URL = "https://openapi.twse.com.tw/v1"


          MARKET_API = (
              BASE_URL
              + "/exchangeReport/STOCK_DAY_ALL"
          )


          COMPANY_API = (
              BASE_URL
              + "/opendata/t187ap03_L"
          )


          # -----------------------------------
          # TWSE 上市公司產業代碼
          # -----------------------------------

          INDUSTRY_MAP = {

              "01": "水泥工業",
              "02": "食品工業",
              "03": "塑膠工業",
              "04": "紡織纖維",
              "05": "電機機械",
              "06": "電器電纜",

              "08": "玻璃陶瓷",
              "09": "造紙工業",
              "10": "鋼鐵工業",
              "11": "橡膠工業",
              "12": "汽車工業",

              "14": "建材營造",
              "15": "航運業",
              "16": "觀光餐旅",
              "17": "金融保險",
              "18": "貿易百貨",
              "19": "綜合",
              "20": "其他",

              "21": "化學工業",
              "22": "生技醫療業",
              "23": "油電燃氣業",

              "24": "半導體業",
              "25": "電腦及週邊設備業",
              "26": "光電業",
              "27": "通信網路業",
              "28": "電子零組件業",
              "29": "電子通路業",
              "30": "資訊服務業",
              "31": "其他電子業",

              "35": "綠能環保",
              "36": "數位雲端",
              "37": "運動休閒",
              "38": "居家生活"
          }


          # -----------------------------------
          # API 讀取
          # -----------------------------------

          def fetch_json(url):

              print(
                  f"Fetching: {url}"
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 TWSE-GitHub-Dashboard",

                      "Accept":
                          "application/json"
                  }
              )


              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  raw = response.read()


              data = json.loads(
                  raw.decode(
                      "utf-8-sig"
                  )
              )


              if not isinstance(
                  data,
                  list
              ):

                  raise RuntimeError(
                      "API did not return "
                      f"array: {url}"
                  )


              return data


          # -----------------------------------
          # 正規化產業代碼
          # -----------------------------------

          def normalize_industry_code(
              value
          ):

              value = str(
                  value or ""
              ).strip()


              if not value:

                  return ""


              if value.isdigit():

                  return value.zfill(2)


              return value


          # -----------------------------------
          # 4. 每日成交資訊
          # -----------------------------------

          market_data = fetch_json(
              MARKET_API
          )


          print(
              "Market records:",
              len(market_data)
          )


          if len(market_data) < 100:

              raise RuntimeError(
                  "Market API returned "
                  "too few records."
              )


          # -----------------------------------
          # 5. 上市公司基本資料
          # -----------------------------------

          company_data = fetch_json(
              COMPANY_API
          )


          print(
              "Company records:",
              len(company_data)
          )


          if len(company_data) < 100:

              raise RuntimeError(
                  "Company API returned "
                  "too few records."
              )


          # -----------------------------------
          # 6. 建立公司資料 Map
          #
          # code →
          # IndustryCode
          # Industry
          # -----------------------------------

          company_info = {}


          for company in company_data:

              if not isinstance(
                  company,
                  dict
              ):
                  continue


              code = str(
                  company.get(
                      "公司代號",
                      ""
                  )
              ).strip()


              if not code:
                  continue


              raw_industry = str(
                  company.get(
                      "產業別",
                      ""
                  )
              ).strip()


              industry_code = (
                  normalize_industry_code(
                      raw_industry
                  )
              )


              # 如果 API 回傳的本身就是中文名稱
              if industry_code in INDUSTRY_MAP:

                  industry_name = (
                      INDUSTRY_MAP[
                          industry_code
                      ]
                  )

              elif raw_industry:

                  industry_name = (
                      raw_industry
                  )

              else:

                  industry_name = (
                      "未分類"
                  )


              company_info[
                  code
              ] = {

                  "IndustryCode":
                      industry_code,

                  "Industry":
                      industry_name
              }


          print(
              "Listed company codes:",
              len(company_info)
          )


          if len(company_info) < 500:

              raise RuntimeError(
                  "Too few listed "
                  "company codes."
              )


          # -----------------------------------
          # 7. 只保留真正上市公司
          #    並加入產業資料
          # -----------------------------------

          stock_data = []


          for stock in market_data:

              if not isinstance(
                  stock,
                  dict
              ):
                  continue


              code = str(
                  stock.get(
                      "Code",
                      ""
                  )
              ).strip()


              close = str(
                  stock.get(
                      "ClosingPrice",
                      ""
                  )
              ).strip()


              if not code:
                  continue


              # ETF / ETN / 權證等排除
              if code not in company_info:
                  continue


              if close in (
                  "",
                  "--",
                  "---",
                  "-"
              ):
                  continue


              # 複製行情資料
              enriched_stock = dict(
                  stock
              )


              # 加入產業資料
              enriched_stock[
                  "IndustryCode"
              ] = (
                  company_info[
                      code
                  ][
                      "IndustryCode"
                  ]
              )


              enriched_stock[
                  "Industry"
              ] = (
                  company_info[
                      code
                  ][
                      "Industry"
                  ]
              )


              stock_data.append(
                  enriched_stock
              )


          print(
              "Pure listed stocks:",
              len(stock_data)
          )


          # -----------------------------------
          # 防呆
          # -----------------------------------

          if len(stock_data) < 500:

              raise RuntimeError(
                  "Too few pure stock "
                  "records. Abort update."
              )


          # -----------------------------------
          # 8. 交易日期
          # -----------------------------------

          trade_date = ""


          if stock_data:

              trade_date = str(
                  stock_data[
                      0
                  ].get(
                      "Date",
                      ""
                  )
              ).strip()


          # -----------------------------------
          # 9. 更新時間
          # -----------------------------------

          taipei_now = datetime.now(
              ZoneInfo(
                  "Asia/Taipei"
              )
          )


          # -----------------------------------
          # 10. 輸出 stocks.json
          # -----------------------------------

          output = {

              "updatedAt":
                  taipei_now.strftime(
                      "%Y-%m-%d %H:%M:%S"
                  ),

              "tradeDate":
                  trade_date,

              "source":
                  "TWSE STOCK_DAY_ALL + t187ap03_L",

              "type":
                  "TWSE_LISTED_STOCK_ONLY",

              "count":
                  len(stock_data),

              "data":
                  stock_data
          }


          with open(
              "stocks.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # -----------------------------------
          # 11. Log
          # -----------------------------------

          industry_counts = {}


          for stock in stock_data:

              industry = stock.get(
                  "Industry",
                  "未分類"
              )


              industry_counts[
                  industry
              ] = (
                  industry_counts.get(
                      industry,
                      0
                  )
                  + 1
              )


          print("")
          print("-------------------------")
          print("stocks.json updated")
          print("-------------------------")

          print(
              "Trade date:",
              trade_date
          )

          print(
              "Pure stocks:",
              len(stock_data)
          )

          print(
              "Industries:",
              len(industry_counts)
          )


          print("")
          print("Industry distribution:")


          for industry, count in sorted(
              industry_counts.items(),
              key=lambda item: (
                  -item[1],
                  item[0]
              )
          ):

              print(
                  f"{industry}: {count}"
              )

          PY


      # ---------------------------------------
      # 12. 檢查輸出
      # ---------------------------------------

      - name: Show stocks.json info
        run: |

          echo "stocks.json size:"
          ls -lh stocks.json

          echo ""

          echo "First 30 lines:"
          head -n 30 stocks.json


      # ---------------------------------------
      # 13. Commit
      # ---------------------------------------

      - name: Commit stock data
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add stocks.json


          if git diff \
            --cached \
            --quiet
          then

            echo "No changes."

          else

            git commit \
              -m "chore: update TWSE stock data with industry"

            git push

          fi
