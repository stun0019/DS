name: Update Taiwan Stock Data

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 08:15，刷新今日當沖／先賣資格
    - cron: "15 0 * * 1-5"
    # 台灣時間 17:40
    - cron: "40 9 * * 1-5"
    # 台灣時間 18:00 / 18:20 / 18:40
    - cron: "0,20,40 10 * * 1-5"
    # 台灣時間 19:00 / 19:20 / 19:40
    - cron: "0,20,40 11 * * 1-5"
    # 台灣時間 20:00 最後補抓
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-taiwan-stock-data
  cancel-in-progress: false

jobs:
  update-stock-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download TWSE and TPEx stock data
        id: market_data
        run: |
          python <<'PY'
          import json
          import os
          import re
          import ssl
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import Counter
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from scripts.trading_calendar import (
              build_twse_trading_calendar,
              get_candidate_valid_for_date,
              get_previous_trading_date,
              is_incoming_trade_date_older,
          )

          VOLUME_MODE = "BROKER_COMPARABLE_V4_DATE_SYNC"

          def set_step_output(name, value):
              output_path = os.environ.get("GITHUB_OUTPUT")
              if not output_path:
                  return
              with open(output_path, "a", encoding="utf-8") as output_file:
                  output_file.write(f"{name}={value}\n")

          TWSE_OPENAPI = "https://openapi.twse.com.tw/v1"
          TWSE_WEB = "https://www.twse.com.tw"
          TPEX_OPENAPI = "https://www.tpex.org.tw/openapi/v1"

          TWSE_MARKET_API = TWSE_OPENAPI + "/exchangeReport/STOCK_DAY_ALL"
          TWSE_COMPANY_API = TWSE_OPENAPI + "/opendata/t187ap03_L"
          TWSE_HOLIDAY_API = (
              TWSE_WEB
              + "/holidaySchedule/holidaySchedule?response=json&date={year}"
          )

          # TPEx 主成交量來源：券商 K 線比較基礎
          TPEX_MARKET_API = TPEX_OPENAPI + "/tpex_mainboard_quotes"

          # TPEx 日期確認專用：只取交易日期，不拿成交量計算
          TPEX_DATE_API = TPEX_OPENAPI + "/tpex_mainboard_daily_close_quotes"

          TPEX_COMPANY_API = TPEX_OPENAPI + "/mopsfin_t187ap03_O"
          TPEX_ODD_API = TPEX_OPENAPI + "/tpex_odd_stock"
          TPEX_FIXED_API = TPEX_OPENAPI + "/tpex_off_market"
          TPEX_BLOCK_API = TPEX_OPENAPI + "/tpex_daily_qutoes_block"

          INDUSTRY_MAP = {
              "01": "水泥工業", "02": "食品工業", "03": "塑膠工業",
              "04": "紡織纖維", "05": "電機機械", "06": "電器電纜",
              "08": "玻璃陶瓷", "09": "造紙工業", "10": "鋼鐵工業",
              "11": "橡膠工業", "12": "汽車工業", "14": "建材營造",
              "15": "航運業", "16": "觀光餐旅", "17": "金融保險",
              "18": "貿易百貨", "19": "綜合", "20": "其他",
              "21": "化學工業", "22": "生技醫療業", "23": "油電燃氣業",
              "24": "半導體業", "25": "電腦及週邊設備業", "26": "光電業",
              "27": "通信網路業", "28": "電子零組件業", "29": "電子通路業",
              "30": "資訊服務業", "31": "其他電子業",
              "32": "文化創意業", "33": "農業科技業", "35": "綠能環保",
              "36": "數位雲端", "37": "運動休閒", "38": "居家生活",
              "80": "管理股票",
          }

          DATE_KEYS = [
              "Date", "TradeDate", "TradingDate", "TradeDateString", "DataDate",
              "資料日期", "交易日期", "成交日期", "日期",
          ]

          TPEX_CODE_KEYS = [
              "SecuritiesCompanyCode", "SecuritiesCode", "StockCode", "Code",
              "證券代號", "股票代號", "公司代號", "代號",
          ]

          TPEX_NAME_KEYS = [
              "CompanyName", "SecuritiesCompanyName", "SecuritiesName",
              "StockName", "Name", "公司簡稱", "證券名稱", "名稱",
          ]

          TPEX_VOLUME_KEYS = [
              "TradingShares", "TradingVolume", "TransactionShares",
              "TradeVolume", "Volume", "成交股數", "成交量", "成交數量", "成交張數",
          ]

          TPEX_INDUSTRY_KEYS = [
              "產業別", "產業類別", "Industry", "IndustryCode", "IndustryCategory",
              "SecuritiesIndustryCode",
          ]

          def is_certificate_verification_error(error):
              pending = [error]
              visited = set()

              while pending:
                  current = pending.pop()
                  if id(current) in visited:
                      continue

                  visited.add(id(current))

                  if isinstance(current, ssl.SSLCertVerificationError):
                      return True

                  message = str(current).upper()
                  if (
                      "CERTIFICATE_VERIFY_FAILED" in message
                      or "MISSING SUBJECT KEY IDENTIFIER" in message
                  ):
                      return True

                  for nested in (
                      getattr(current, "reason", None),
                      current.__cause__,
                      current.__context__,
                  ):
                      if isinstance(nested, BaseException):
                          pending.append(nested)

              return False

          def create_tpex_fallback_context():
              context = ssl.create_default_context()
              context.check_hostname = False
              context.verify_mode = ssl.CERT_NONE
              return context

          def fetch_json(url, required=True):
              print(f"Fetching: {url}")
              last_error = None

              for attempt in range(1, 4):
                  try:
                      is_tpex = "tpex.org.tw" in url
                      referer = (
                          "https://www.tpex.org.tw/"
                          if is_tpex
                          else "https://www.twse.com.tw/"
                      )

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0 Taiwan-Stock-Dashboard",
                              "Accept": "application/json,text/plain,*/*",
                              "Referer": referer,
                              "Cache-Control": "no-cache",
                              "Pragma": "no-cache",
                          },
                      )

                      try:
                          with urllib.request.urlopen(
                              request,
                              timeout=45,
                              context=ssl.create_default_context(),
                          ) as response:
                              raw = response.read()

                      except Exception as verified_error:
                          if not (
                              is_tpex
                              and is_certificate_verification_error(verified_error)
                          ):
                              raise

                          print(
                              "SECURITY WARNING: TPEx certificate verification "
                              "failed; retrying this TPEx request only without "
                              "certificate verification."
                          )

                          with urllib.request.urlopen(
                              request,
                              timeout=45,
                              context=create_tpex_fallback_context(),
                          ) as response:
                              raw = response.read()

                      return json.loads(raw.decode("utf-8-sig"))

                  except Exception as error:
                      last_error = error
                      print(f"Attempt {attempt} failed:", repr(error))
                      if attempt < 3:
                          time.sleep(attempt * 2)

              if required:
                  raise RuntimeError(f"API failed: {url}\n{last_error}")

              print("Optional API failed:", url)
              return []

          def clean_text(value):
              text = str(value if value is not None else "")
              text = re.sub(r"<[^>]+>", "", text)
              return text.replace("\u3000", " ").replace("&nbsp;", " ").strip()

          def normalize_key(value):
              return (
                  clean_text(value)
                  .replace(" ", "")
                  .replace("_", "")
                  .replace("-", "")
                  .lower()
              )

          def to_int(value):
              text = clean_text(value).replace(",", "").replace("+", "").strip()
              if text in ("", "-", "--", "---", "----"):
                  return 0
              try:
                  return int(float(text))
              except Exception:
                  text = re.sub(r"[^0-9.\-]", "", text)
                  try:
                      return int(float(text))
                  except Exception:
                      return 0

          def normalize_code(value):
              text = clean_text(value).replace('="', "").replace('"', "").replace("=", "")
              return re.sub(r"[^0-9A-Za-z]", "", text).strip()

          def normalize_industry_code(value):
              text = clean_text(value)
              if not text:
                  return ""
              return text.zfill(2) if text.isdigit() else text

          def get_industry(value):
              raw = clean_text(value)
              code = normalize_industry_code(raw)
              return code, INDUSTRY_MAP.get(code, raw if raw else "未分類")

          def normalize_trade_date(value):
              raw = re.sub(r"\D", "", str(value or ""))

              if len(raw) == 7:
                  return raw

              if len(raw) == 8:
                  year = int(raw[:4]) - 1911
                  if year <= 0:
                      return ""
                  return f"{year:03d}{raw[4:]}"

              return ""

          def roc_to_gregorian(value):
              raw = normalize_trade_date(value)
              if len(raw) != 7:
                  raise RuntimeError(f"Invalid ROC date: {value}")
              return f"{int(raw[:3]) + 1911}{raw[3:]}"

          def roc_to_iso(value):
              date = roc_to_gregorian(value)
              return f"{date[:4]}-{date[4:6]}-{date[6:8]}"

          def pick_value(row, candidates, default=""):
              if not isinstance(row, dict):
                  return default

              for candidate in candidates:
                  if candidate in row:
                      value = row.get(candidate)
                      if value not in (None, ""):
                          return value

              normalized_candidates = {
                  normalize_key(candidate) for candidate in candidates
              }

              for key, value in row.items():
                  if normalize_key(key) in normalized_candidates and value not in (None, ""):
                      return value

              return default

          def unwrap_records(payload):
              if isinstance(payload, list):
                  return payload
              if not isinstance(payload, dict):
                  return []

              for key in ("data", "Data", "result", "results"):
                  rows = payload.get(key)
                  if isinstance(rows, list):
                      return rows

              return []

          def extract_row_date(row):
              if not isinstance(row, dict):
                  return ""
              return normalize_trade_date(pick_value(row, DATE_KEYS, ""))

          def detect_latest_trade_date(payload, label):
              dates = []

              if isinstance(payload, dict):
                  top_date = normalize_trade_date(pick_value(payload, DATE_KEYS, ""))
                  if top_date:
                      dates.append(top_date)

              for row in unwrap_records(payload):
                  row_date = extract_row_date(row)
                  if row_date:
                      dates.append(row_date)

              if not dates:
                  print(f"{label}: no date field detected")
                  return ""

              counts = Counter(dates)
              latest_date = max(counts.keys())

              print(f"{label} detected dates:", dict(sorted(counts.items())))
              print(f"{label} latest date:", latest_date)
              return latest_date

          def row_matches_date(row, target_roc, allow_missing=True):
              row_date = extract_row_date(row)
              if not row_date:
                  return allow_missing
              return row_date == target_roc

          def read_existing_meta():
              if not os.path.exists("stocks.json"):
                  return {}
              try:
                  with open("stocks.json", encoding="utf-8") as file:
                      payload = json.load(file)
                  return {
                      "tradeDate": payload.get("tradeDate", ""),
                      "updatedAt": payload.get("updatedAt", ""),
                      "validForTradingDate": payload.get(
                          "validForTradingDate", ""
                      ),
                      "expectedPreviousTradingDate": payload.get(
                          "expectedPreviousTradingDate", ""
                      ),
                      "tradingCalendar": payload.get("tradingCalendar"),
                      "volumeMode": payload.get("volumeMode", ""),
                  }
              except Exception as error:
                  print("Cannot read existing stocks.json:", repr(error))
                  return {}

          def iter_twse_tables(payload):
              if not isinstance(payload, dict):
                  return

              fields = payload.get("fields")
              data = payload.get("data")
              if isinstance(fields, list) and isinstance(data, list):
                  yield fields, data

              for index in range(1, 40):
                  fields = payload.get(f"fields{index}")
                  data = payload.get(f"data{index}")
                  if isinstance(fields, list) and isinstance(data, list):
                      yield fields, data

              tables = payload.get("tables")
              if isinstance(tables, list):
                  for table in tables:
                      if not isinstance(table, dict):
                          continue
                      fields = table.get("fields")
                      data = table.get("data")
                      if isinstance(fields, list) and isinstance(data, list):
                          yield fields, data

          def find_field_index(fields, candidates):
              normalized_fields = [normalize_key(field) for field in fields]
              normalized_candidates = [normalize_key(candidate) for candidate in candidates]

              for index, field in enumerate(normalized_fields):
                  for candidate in normalized_candidates:
                      if candidate in field:
                          return index
              return None

          def extract_twse_volume_map(payload, volume_fields, multiplier=1):
              result = {}

              for fields, rows in iter_twse_tables(payload):
                  code_index = find_field_index(
                      fields,
                      ["證券代號", "股票代號", "公司代號", "Code"],
                  )
                  volume_index = find_field_index(fields, volume_fields)

                  if code_index is None or volume_index is None:
                      continue

                  for row in rows:
                      if not isinstance(row, list):
                          continue
                      if len(row) <= max(code_index, volume_index):
                          continue

                      code = normalize_code(row[code_index])
                      if not code or code in ("TOTAL", "合計", "總計"):
                          continue

                      volume = to_int(row[volume_index]) * multiplier
                      result[code] = result.get(code, 0) + volume

              return result

          def fetch_twse_report(urls, volume_fields, multiplier=1, required=True):
              errors = []

              for url in urls:
                  try:
                      payload = fetch_json(url)

                      if isinstance(payload, dict):
                          stat = clean_text(payload.get("stat", "OK"))
                          if stat and stat != "OK":
                              raise RuntimeError(f"TWSE stat={stat}")

                      result = extract_twse_volume_map(
                          payload,
                          volume_fields,
                          multiplier,
                      )
                      print("Parsed", len(result), "records")
                      return result, url

                  except Exception as error:
                      errors.append(f"{url}: {error}")

              if required:
                  raise RuntimeError("TWSE report failed:\n" + "\n".join(errors))

              return {}, ""

          def extract_tpex_volume_map(payload, target_date):
              result = {}

              for row in unwrap_records(payload):
                  if not isinstance(row, dict):
                      continue
                  if not row_matches_date(row, target_date, allow_missing=True):
                      continue

                  code = normalize_code(pick_value(row, TPEX_CODE_KEYS, ""))
                  if not code:
                      continue

                  value = pick_value(row, TPEX_VOLUME_KEYS, "")
                  if value in ("", None):
                      continue

                  result[code] = result.get(code, 0) + to_int(value)

              return result

          def extract_tpex_fixed_map(payload, target_date):
              result = {}

              for row in unwrap_records(payload):
                  if not isinstance(row, dict):
                      continue
                  if not row_matches_date(row, target_date, allow_missing=True):
                      continue

                  code = normalize_code(pick_value(row, TPEX_CODE_KEYS, ""))
                  if not code:
                      continue

                  raw_units = pick_value(row, TPEX_VOLUME_KEYS, "")
                  if raw_units in ("", None):
                      continue

                  # TPEx 盤後定價普通股：1 交易單位 = 1,000 股
                  fixed_lots = to_int(raw_units)
                  fixed_shares = fixed_lots * 1000
                  result[code] = result.get(code, 0) + fixed_shares

              return result

          # ==================================================
          # 1. 先檢查 TWSE / TPEx 最新交易日期
          # ==================================================

          print("")
          print("==============================")
          print("MARKET DATE CHECK")
          print("==============================")

          taipei_now = datetime.now(ZoneInfo("Asia/Taipei"))
          today_iso = taipei_now.strftime("%Y-%m-%d")
          calendar_years = (
              taipei_now.year - 1,
              taipei_now.year,
          )

          twse_holiday_payloads = {
              str(year): fetch_json(
                  TWSE_HOLIDAY_API.format(year=year),
                  required=True,
              )
              for year in calendar_years
          }
          trading_calendar = build_twse_trading_calendar(
              twse_holiday_payloads
          )

          twse_market_data = fetch_json(TWSE_MARKET_API)
          tpex_market_payload = fetch_json(TPEX_MARKET_API)

          # fixed 是 TPEx BrokerComparableVolume 的必要組成，
          # 因此提前抓取並把它當成 TPEx 日期的重要同步訊號。
          tpex_fixed_payload = fetch_json(TPEX_FIXED_API, required=True)

          # daily_close 只做第二日期訊號；若本身沒有日期欄位則忽略。
          tpex_date_payload = fetch_json(TPEX_DATE_API, required=False)

          if not isinstance(twse_market_data, list) or len(twse_market_data) < 500:
              raise RuntimeError("TWSE market data too small")

          tpex_market_data = unwrap_records(tpex_market_payload)
          if len(tpex_market_data) < 500:
              raise RuntimeError("TPEx market data too small")

          twse_trade_date = detect_latest_trade_date(
              twse_market_data,
              "TWSE STOCK_DAY_ALL",
          )

          tpex_fixed_date = detect_latest_trade_date(
              tpex_fixed_payload,
              "TPEx off_market",
          )

          tpex_daily_date = detect_latest_trade_date(
              tpex_date_payload,
              "TPEx daily_close date check",
          )

          # mainboard_quotes 若本身帶日期，也做交叉確認；沒有日期就不強制。
          tpex_quotes_date = detect_latest_trade_date(
              tpex_market_payload,
              "TPEx mainboard_quotes",
          )

          # 優先使用 fixed 的最新日期，因為 fixed 直接參與成交量公式。
          # 若 fixed API 未提供可辨識日期，再退回 daily_close 日期訊號。
          tpex_trade_date = tpex_fixed_date or tpex_daily_date

          if not twse_trade_date:
              raise RuntimeError("Cannot detect TWSE trade date")

          if not tpex_trade_date:
              raise RuntimeError("Cannot detect TPEx trade date")

          print("")
          print("TWSE latest date:", twse_trade_date)
          print("TPEx latest date:", tpex_trade_date)
          print("TPEx fixed date:", tpex_fixed_date or "no date field")
          print("TPEx daily-close date:", tpex_daily_date or "no date field")
          print("TPEx quotes date:", tpex_quotes_date or "no date field")

          existing_meta = read_existing_meta()
          print("")
          print("Existing trade date:", existing_meta.get("tradeDate", ""))
          print("Existing updated at:", existing_meta.get("updatedAt", ""))
          print("Existing volume mode:", existing_meta.get("volumeMode", ""))

          dates_are_synced = twse_trade_date == tpex_trade_date

          # 如果其他 TPEx 日期訊號存在，也必須與 fixed/主日期一致。
          if tpex_daily_date and tpex_daily_date != tpex_trade_date:
              dates_are_synced = False

          if tpex_quotes_date and tpex_quotes_date != tpex_trade_date:
              dates_are_synced = False

          if not dates_are_synced:
              print("")
              print("==============================")
              print("SKIP UPDATE - MARKET DATE MISMATCH")
              print("==============================")
              print("TWSE:", twse_trade_date)
              print("TPEx date source:", tpex_trade_date)
              print("TPEx fixed:", tpex_fixed_date or "no date field")
              print("TPEx daily-close:", tpex_daily_date or "no date field")
              print("TPEx quotes:", tpex_quotes_date or "no date field")
              print("stocks.json will NOT be overwritten.")

              if not os.path.exists("stocks.json"):
                  raise RuntimeError(
                      "Market dates mismatch and no existing stocks.json is available"
                  )

              set_step_output("skip_update", "true")
              raise SystemExit(0)

          trade_date = twse_trade_date

          if is_incoming_trade_date_older(
              trade_date,
              existing_meta.get("tradeDate"),
          ):
              print("")
              print("==============================")
              print("SKIP UPDATE - FETCHED DATE IS OLDER")
              print("==============================")
              print("Fetched trade date:", trade_date)
              print("Existing trade date:", existing_meta.get("tradeDate"))
              print("stocks.json will NOT be overwritten.")
              set_step_output("skip_update", "true")
              raise SystemExit(0)

          gregorian_date = roc_to_gregorian(trade_date)

          print("")
          print("Synchronized trade date:", trade_date)
          print("Gregorian date:", gregorian_date)

          expected_previous_trading_date = get_previous_trading_date(
              today_iso,
              trading_calendar,
          )
          candidate_session_date = (
              get_candidate_valid_for_date(
                  trade_date,
                  today_iso,
                  trading_calendar,
              )
          )

          # 同一天且已經是 V4，就不重新寫 updatedAt，也不製造多餘 commit。
          if (
              existing_meta.get("tradeDate") == trade_date
              and existing_meta.get("volumeMode") == VOLUME_MODE
          ):
              if (
                  existing_meta.get("validForTradingDate")
                  != candidate_session_date
                  or existing_meta.get("expectedPreviousTradingDate")
                  != (expected_previous_trading_date or "")
                  or existing_meta.get("tradingCalendar")
                  != trading_calendar
              ):
                  with open("stocks.json", encoding="utf-8") as file:
                      existing_payload = json.load(file)

                  existing_payload["validForTradingDate"] = (
                      candidate_session_date
                  )
                  existing_payload["expectedPreviousTradingDate"] = (
                      expected_previous_trading_date or ""
                  )
                  existing_payload["tradingCalendar"] = trading_calendar
                  if candidate_session_date:
                      existing_payload["candidateDataUpdatedAt"] = (
                          taipei_now.strftime("%Y-%m-%d %H:%M:%S")
                      )
                  else:
                      existing_payload["candidateDataUpdatedAt"] = ""

                  with open("stocks.json", "w", encoding="utf-8") as file:
                      json.dump(
                          existing_payload,
                          file,
                          ensure_ascii=False,
                          indent=2,
                      )

                  print(
                      "Candidate data applicability:",
                      candidate_session_date or "DATA_STALE",
                  )
                  print(
                      "Expected previous trading date:",
                      expected_previous_trading_date or "UNAVAILABLE",
                  )

              print("")
              print("==============================")
              print("SKIP UPDATE - ALREADY CURRENT")
              print("==============================")
              print("Trade date:", trade_date)
              print("Mode:", VOLUME_MODE)
              raise SystemExit(0)

          # ==================================================
          # 2. 公司資料
          # ==================================================

          twse_company_data = fetch_json(TWSE_COMPANY_API)
          tpex_company_payload = fetch_json(TPEX_COMPANY_API)
          tpex_company_data = unwrap_records(tpex_company_payload)

          if not isinstance(twse_company_data, list) or len(twse_company_data) < 500:
              raise RuntimeError("TWSE company data too small")

          if len(tpex_company_data) < 500:
              raise RuntimeError("TPEx company data too small")

          # ==================================================
          # 3. TWSE 公司白名單 + 股票行情
          # ==================================================

          twse_company_info = {}

          for company in twse_company_data:
              if not isinstance(company, dict):
                  continue

              code = normalize_code(company.get("公司代號", ""))
              if not code:
                  continue

              industry_code, industry_name = get_industry(
                  company.get("產業別", "")
              )

              twse_company_info[code] = {
                  "IndustryCode": industry_code,
                  "Industry": industry_name,
              }

          twse_stocks = []

          for stock in twse_market_data:
              if not isinstance(stock, dict):
                  continue

              if not row_matches_date(stock, trade_date, allow_missing=False):
                  continue

              code = normalize_code(stock.get("Code", ""))
              if not code or code not in twse_company_info:
                  continue

              close = clean_text(stock.get("ClosingPrice", ""))
              if close in ("", "-", "--", "---"):
                  continue

              item = dict(stock)
              item.update(twse_company_info[code])
              item["Market"] = "TWSE"
              item["MarketName"] = "上市"
              twse_stocks.append(item)

          if len(twse_stocks) < 500:
              raise RuntimeError("Too few TWSE stocks")

          # ==================================================
          # 4. TWSE 零股 / 盤後定價 / 鉅額
          # ==================================================

          common_params = urllib.parse.urlencode({
              "date": gregorian_date,
              "selectType": "ALLBUT0999",
              "response": "json",
          })

          twse_intraday_odd, twse_intraday_source = fetch_twse_report(
              [
                  TWSE_WEB + "/rwd/zh/afterTrading/TWTC7U?" + common_params,
                  TWSE_WEB + "/exchangeReport/TWTC7U?" + common_params,
              ],
              ["成交股數"],
          )

          twse_after_odd, twse_after_odd_source = fetch_twse_report(
              [
                  TWSE_WEB + "/rwd/zh/afterTrading/TWT53U?" + common_params,
                  TWSE_WEB + "/exchangeReport/TWT53U?" + common_params,
              ],
              ["成交股數"],
          )

          twse_fixed, twse_fixed_source = fetch_twse_report(
              [
                  TWSE_WEB + "/rwd/zh/afterTrading/BFT41U?" + common_params,
                  TWSE_WEB + "/exchangeReport/BFT41U?" + common_params,
              ],
              ["成交數量"],
              multiplier=1000,
          )

          block_params = urllib.parse.urlencode({
              "date": gregorian_date,
              "response": "json",
              "selectType": "S",
          })

          twse_block, twse_block_source = fetch_twse_report(
              [TWSE_WEB + "/block/BFIAUU?" + block_params],
              ["成交股數"],
              required=True,
          )

          # ==================================================
          # 5. TWSE BrokerComparableVolume
          # = Total - Odd - Block
          # 盤後定價 Fixed 不扣
          # ==================================================

          for stock in twse_stocks:
              code = stock["Code"]

              total_volume = to_int(stock.get("TradeVolume", 0))
              intraday_odd = twse_intraday_odd.get(code, 0)
              after_odd = twse_after_odd.get(code, 0)
              odd_total = intraday_odd + after_odd
              fixed_volume = twse_fixed.get(code, 0)
              block_volume = twse_block.get(code, 0)

              broker_volume = max(
                  0,
                  total_volume - odd_total - block_volume,
              )

              stock["TotalTradeVolume"] = total_volume
              stock["IntradayOddLotVolume"] = intraday_odd
              stock["AfterHoursOddLotVolume"] = after_odd
              stock["OddLotVolume"] = odd_total
              stock["AfterHoursFixedVolume"] = fixed_volume
              stock["BlockTradeVolume"] = block_volume
              stock["BrokerComparableVolume"] = broker_volume
              stock["BrokerDisplayVolume"] = broker_volume
              stock["RegularSessionVolume"] = broker_volume
              stock["AdjustedTradeVolume"] = broker_volume
              stock["RegularTradeVolume"] = broker_volume

          # ==================================================
          # 6. TPEx 公司白名單
          # ==================================================

          tpex_company_info = {}

          for company in tpex_company_data:
              if not isinstance(company, dict):
                  continue

              code = normalize_code(
                  pick_value(
                      company,
                      ["公司代號", "SecuritiesCompanyCode", "StockCode", "Code"],
                      "",
                  )
              )

              if not code:
                  continue

              industry_code, industry_name = get_industry(
                  pick_value(company, TPEX_INDUSTRY_KEYS, "")
              )

              tpex_company_info[code] = {
                  "IndustryCode": industry_code,
                  "Industry": industry_name,
              }

          # ==================================================
          # 7. TPEx 盤後元件
          # ==================================================

          print("")
          print("==============================")
          print("TPEX COMPONENTS")
          print("==============================")

          tpex_odd_payload = fetch_json(TPEX_ODD_API, required=False)
          # tpex_fixed_payload 已在日期同步檢查階段抓取，這裡直接重用。
          tpex_block_payload = fetch_json(TPEX_BLOCK_API, required=False)

          tpex_odd = extract_tpex_volume_map(tpex_odd_payload, trade_date)
          tpex_fixed = extract_tpex_fixed_map(tpex_fixed_payload, trade_date)
          tpex_block = extract_tpex_volume_map(tpex_block_payload, trade_date)

          print("TPEx odd:", len(tpex_odd))
          print("TPEx fixed:", len(tpex_fixed))
          print("TPEx block:", len(tpex_block))

          # ==================================================
          # 8. TPEx BrokerComparableVolume
          # = Mainboard + After-hours Fixed
          # odd / block 僅稽核，不重複扣除
          # ==================================================

          tpex_stocks = []
          seen_tpex = set()

          for row in tpex_market_data:
              if not isinstance(row, dict):
                  continue

              if not row_matches_date(row, trade_date, allow_missing=True):
                  continue

              code = normalize_code(pick_value(row, TPEX_CODE_KEYS, ""))

              if (
                  not code
                  or code not in tpex_company_info
                  or code in seen_tpex
              ):
                  continue

              seen_tpex.add(code)

              name = clean_text(pick_value(row, TPEX_NAME_KEYS, ""))
              close = clean_text(
                  pick_value(
                      row,
                      ["Close", "ClosingPrice", "收盤", "收盤價"],
                      "",
                  )
              )

              if close in ("", "-", "--", "---"):
                  continue

              mainboard_volume = to_int(
                  pick_value(row, TPEX_VOLUME_KEYS, 0)
              )
              fixed_volume = tpex_fixed.get(code, 0)
              odd_volume = tpex_odd.get(code, 0)
              block_volume = tpex_block.get(code, 0)
              broker_volume = mainboard_volume + fixed_volume

              tpex_stocks.append({
                  "Date": trade_date,
                  "Code": code,
                  "Name": name,
                  "TradeVolume": str(mainboard_volume),
                  "TradeValue": str(
                      to_int(
                          pick_value(
                              row,
                              [
                                  "TransactionAmount", "TradingAmount", "TradeValue",
                                  "成交金額", "成交金額(元)",
                              ],
                              0,
                          )
                      )
                  ),
                  "Transaction": str(
                      to_int(
                          pick_value(
                              row,
                              [
                                  "TransactionNumber", "Transactions", "Transaction", "成交筆數",
                              ],
                              0,
                          )
                      )
                  ),
                  "OpeningPrice": clean_text(
                      pick_value(row, ["Open", "OpeningPrice", "開盤", "開盤價"], "")
                  ),
                  "HighestPrice": clean_text(
                      pick_value(row, ["High", "HighestPrice", "最高", "最高價"], "")
                  ),
                  "LowestPrice": clean_text(
                      pick_value(row, ["Low", "LowestPrice", "最低", "最低價"], "")
                  ),
                  "ClosingPrice": close,
                  "Change": clean_text(
                      pick_value(
                          row,
                          ["Change", "ChangeAmount", "漲跌", "漲跌價差"],
                          "0",
                      )
                  ),
                  "IndustryCode": tpex_company_info[code]["IndustryCode"],
                  "Industry": tpex_company_info[code]["Industry"],
                  "Market": "TPEX",
                  "MarketName": "上櫃",
                  "MainboardTradeVolume": mainboard_volume,
                  "TotalTradeVolume": broker_volume,
                  "IntradayOddLotVolume": 0,
                  "AfterHoursOddLotVolume": 0,
                  "OddLotVolume": odd_volume,
                  "AfterHoursFixedVolume": fixed_volume,
                  "AfterHoursFixedLots": fixed_volume // 1000,
                  "BlockTradeVolume": block_volume,
                  "BrokerComparableVolume": broker_volume,
                  "BrokerDisplayVolume": broker_volume,
                  "RegularSessionVolume": broker_volume,
                  "AdjustedTradeVolume": broker_volume,
                  "RegularTradeVolume": broker_volume,
              })

          if len(tpex_stocks) < 500:
              raise RuntimeError(
                  "Too few TPEx stocks after normalization: "
                  + str(len(tpex_stocks))
              )

          # ==================================================
          # 9. Merge + internal validation
          # ==================================================

          all_stocks = twse_stocks + tpex_stocks

          if len(all_stocks) < 1400:
              raise RuntimeError(
                  "Combined stock count too small: "
                  + str(len(all_stocks))
              )

          all_stocks.sort(
              key=lambda stock: (
                  stock.get("Market", ""),
                  stock.get("Code", ""),
              )
          )

          invalid = []

          for stock in all_stocks:
              code = stock.get("Code")
              market = stock.get("Market")
              stock_date = normalize_trade_date(stock.get("Date", ""))

              if stock_date != trade_date:
                  invalid.append(
                      (code, f"date={stock_date}, expected={trade_date}")
                  )
                  continue

              broker = to_int(stock.get("BrokerComparableVolume", 0))
              adjusted = to_int(stock.get("AdjustedTradeVolume", 0))

              if broker != adjusted:
                  invalid.append(
                      (code, f"broker={broker}, adjusted={adjusted}")
                  )
                  continue

              if market == "TWSE":
                  total = to_int(stock.get("TotalTradeVolume", 0))
                  odd = to_int(stock.get("OddLotVolume", 0))
                  block = to_int(stock.get("BlockTradeVolume", 0))
                  expected = max(0, total - odd - block)

              elif market == "TPEX":
                  mainboard = to_int(stock.get("MainboardTradeVolume", 0))
                  fixed = to_int(stock.get("AfterHoursFixedVolume", 0))
                  expected = mainboard + fixed

              else:
                  invalid.append((code, "Unknown market"))
                  continue

              if broker != expected:
                  invalid.append(
                      (code, f"broker={broker}, expected={expected}")
                  )

          if invalid:
              print("Invalid records:")
              for item in invalid[:30]:
                  print(item)
              raise RuntimeError("Internal volume/date validation failed")

          # ==================================================
          # 10. Preview / verification
          # ==================================================

          top10 = sorted(
              all_stocks,
              key=lambda stock: to_int(stock.get("AdjustedTradeVolume", 0)),
              reverse=True,
          )[:10]

          print("")
          print("==============================")
          print("Broker Comparable Volume TOP 10")
          print("==============================")

          for index, stock in enumerate(top10, 1):
              print(
                  index,
                  stock.get("MarketName"),
                  stock.get("Code"),
                  stock.get("Name"),
                  round(to_int(stock.get("AdjustedTradeVolume", 0)) / 1000),
                  "張",
              )

          verify_codes = {"2344", "6770", "5904"}

          print("")
          print("==============================")
          print("Volume Verification")
          print("==============================")

          for stock in all_stocks:
              if stock.get("Code") not in verify_codes:
                  continue

              print("")
              print(
                  stock.get("MarketName"),
                  stock.get("Code"),
                  stock.get("Name"),
              )
              print("Date:", stock.get("Date"))

              if stock.get("Market") == "TWSE":
                  print("TWSE Total:", stock.get("TotalTradeVolume"))
                  print("TWSE Odd:", stock.get("OddLotVolume"))
                  print(
                      "TWSE Fixed (NOT deducted):",
                      stock.get("AfterHoursFixedVolume"),
                  )
                  print("TWSE Block:", stock.get("BlockTradeVolume"))
              else:
                  print("TPEx Mainboard:", stock.get("MainboardTradeVolume"))
                  print("TPEx Fixed shares:", stock.get("AfterHoursFixedVolume"))
                  print("TPEx Fixed lots:", stock.get("AfterHoursFixedLots"))
                  print("TPEx Odd (audit only):", stock.get("OddLotVolume"))
                  print("TPEx Block (audit only):", stock.get("BlockTradeVolume"))

              print("Broker Volume:", stock.get("BrokerComparableVolume"))
              print(
                  "Broker lots:",
                  round(to_int(stock.get("BrokerComparableVolume", 0)) / 1000, 3),
              )

          # ==================================================
          # 11. Output
          # ==================================================

          output = {
              # 真正行情交易日期，不使用 Actions 執行日期冒充
              "tradeDate": trade_date,
              "tradeDateISO": roc_to_iso(trade_date),

              # stocks.json 真正產生時間（台灣時間）
              "updatedAt": taipei_now.strftime("%Y-%m-%d %H:%M:%S"),
              "candidateDataUpdatedAt": (
                  taipei_now.strftime("%Y-%m-%d %H:%M:%S")
                  if candidate_session_date
                  else ""
              ),
              "validForTradingDate": candidate_session_date,
              "expectedPreviousTradingDate": (
                  expected_previous_trading_date or ""
              ),
              "tradingCalendar": trading_calendar,

              # 兩市場日期同步狀態
              "marketTradeDates": {
                  "TWSE": twse_trade_date,
                  "TPEX": tpex_trade_date,
              },
              "syncStatus": "SYNCED",

              "source": "TWSE + TPEx official data",
              "type": "TWSE_TPEX_STOCK_ONLY",
              "volumeMode": VOLUME_MODE,

              "volumeFormula": (
                  "TWSE: TotalTradeVolume - OddLotVolume - BlockTradeVolume | "
                  "TPEX: MainboardTradeVolume + AfterHoursFixedVolume"
              ),

              "volumeFormulaByMarket": {
                  "TWSE": "TotalTradeVolume - OddLotVolume - BlockTradeVolume",
                  "TPEX": "MainboardTradeVolume + AfterHoursFixedVolume",
              },

              "volumeSource": {
                  "TWSE": "STOCK_DAY_ALL",
                  "TPEX": "tpex_mainboard_quotes",
                  "TPEX_DATE_CHECK": "tpex_mainboard_daily_close_quotes",
                  "TPEX_AFTER_HOURS_FIXED": "tpex_off_market",
              },

              "count": len(all_stocks),
              "marketCounts": {
                  "TWSE": len(twse_stocks),
                  "TPEX": len(tpex_stocks),
              },
              "data": all_stocks,
          }

          with open("stocks.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print("")
          print("==============================")
          print("stocks.json updated")
          print("==============================")
          print("Trade Date:", trade_date)
          print("Trade Date ISO:", output["tradeDateISO"])
          print("Generated At:", output["updatedAt"])
          print("TWSE:", len(twse_stocks))
          print("TPEx:", len(tpex_stocks))
          print("Total:", len(all_stocks))
          print("Mode:", VOLUME_MODE)
          print("TWSE formula: Total - Odd - Block")
          print("TPEx formula: Mainboard + After-hours Fixed")
          PY

      - name: Enrich TPEx industry metadata
        if: steps.market_data.outputs.skip_update != 'true'
        run: python scripts/enrich_tpex_industry.py

      - name: Enrich day-trading eligibility
        if: steps.market_data.outputs.skip_update != 'true'
        run: python scripts/enrich_day_trade_eligibility.py

      - name: Validate stocks.json
        if: steps.market_data.outputs.skip_update != 'true'
        run: |
          python <<'PY'
          import json

          from scripts.trading_calendar import get_previous_trading_date

          with open("stocks.json", encoding="utf-8") as file:
              payload = json.load(file)

          stocks = payload.get("data", [])

          if not stocks:
              raise SystemExit("stocks.json is empty")

          valid_for_trading_date = payload.get("validForTradingDate", "")
          expected_previous_trading_date = payload.get(
              "expectedPreviousTradingDate", ""
          )
          trading_calendar = payload.get("tradingCalendar")

          if valid_for_trading_date:
              recomputed_previous_trading_date = get_previous_trading_date(
                  valid_for_trading_date,
                  trading_calendar,
              )

              if not recomputed_previous_trading_date:
                  raise SystemExit("Candidate trading calendar is incomplete")

              if (
                  recomputed_previous_trading_date
                  != expected_previous_trading_date
              ):
                  raise SystemExit("Expected previous trading date mismatch")

              if payload.get("tradeDateISO") != expected_previous_trading_date:
                  raise SystemExit(
                      "Candidate data is not the actual previous trading date"
                  )

          eligibility = payload.get("dayTradeEligibility", {})
          eligibility_counts = eligibility.get("counts", {})
          suspension_meta = eligibility.get("sellFirstSuspensions", {})

          if eligibility_counts.get("eligible", 0) < 300:
              raise SystemExit("Day-trading eligibility coverage is too small")

          if not suspension_meta.get("asOfDate"):
              raise SystemExit("Missing sell-first suspension as-of date")

          tpex_unclassified = sum(
              1
              for stock in stocks
              if stock.get("Market") == "TPEX"
              and stock.get("Industry") == "未分類"
          )

          if tpex_unclassified > 10:
              raise SystemExit(
                  "Too many unclassified TPEx stocks: "
                  + str(tpex_unclassified)
              )

          for stock in stocks:
              if not isinstance(stock.get("DayTradeEligible"), bool):
                  raise SystemExit(
                      "Missing DayTradeEligible for " + str(stock.get("Code"))
                  )

              if not isinstance(stock.get("SellFirstDayTradeAllowed"), bool):
                  raise SystemExit(
                      "Missing SellFirstDayTradeAllowed for "
                      + str(stock.get("Code"))
                  )

              if not isinstance(stock.get("SellFirstSuspended"), bool):
                  raise SystemExit(
                      "Missing SellFirstSuspended for "
                      + str(stock.get("Code"))
                  )

          trade_date = payload.get("tradeDate", "")

          print("Trade Date:", trade_date)
          print("Trade Date ISO:", payload.get("tradeDateISO", ""))
          print("Updated At:", payload.get("updatedAt"))
          print("Market Trade Dates:", payload.get("marketTradeDates", {}))
          print("Sync Status:", payload.get("syncStatus", "legacy"))
          print("Total:", payload.get("count"))
          print("Markets:", payload.get("marketCounts"))
          print("Mode:", payload.get("volumeMode"))

          invalid = []

          for stock in stocks:
              code = stock.get("Code")
              market = stock.get("Market")
              stock_date = stock.get("Date", "")

              if (
                  payload.get("syncStatus") == "SYNCED"
                  and stock_date != trade_date
              ):
                  invalid.append(
                      (code, f"date={stock_date}, tradeDate={trade_date}")
                  )
                  continue

              broker = int(
                  stock.get(
                      "BrokerComparableVolume",
                      stock.get("AdjustedTradeVolume", 0),
                  ) or 0
              )

              adjusted = int(stock.get("AdjustedTradeVolume", 0) or 0)

              if broker != adjusted:
                  invalid.append(
                      (code, f"broker={broker}, adjusted={adjusted}")
                  )
                  continue

              if market == "TWSE":
                  total = int(stock.get("TotalTradeVolume", 0) or 0)
                  odd = int(stock.get("OddLotVolume", 0) or 0)
                  block = int(stock.get("BlockTradeVolume", 0) or 0)
                  expected = max(0, total - odd - block)

              elif market == "TPEX":
                  mainboard = int(
                      stock.get(
                          "MainboardTradeVolume",
                          stock.get("TradeVolume", 0),
                      ) or 0
                  )
                  fixed = int(stock.get("AfterHoursFixedVolume", 0) or 0)
                  expected = mainboard + fixed

              else:
                  invalid.append((code, "Unknown market"))
                  continue

              if broker != expected:
                  invalid.append(
                      (code, f"broker={broker}, expected={expected}")
                  )

          if invalid:
              print("Invalid records:")
              for item in invalid[:30]:
                  print(item)
              raise SystemExit("Volume/date validation failed")

          print("")
          print("Validation OK")

          verify_codes = {"2344", "6770", "5904"}

          print("")
          print("Verification stocks:")

          for stock in stocks:
              if stock.get("Code") not in verify_codes:
                  continue

              print("")
              print(
                  stock.get("MarketName"),
                  stock.get("Code"),
                  stock.get("Name"),
              )
              print("Date:", stock.get("Date"))

              if stock.get("Market") == "TPEX":
                  print(
                      "Mainboard lots:",
                      round(
                          int(
                              stock.get(
                                  "MainboardTradeVolume",
                                  stock.get("TradeVolume", 0),
                              ) or 0
                          ) / 1000,
                          3,
                      ),
                  )
                  print(
                      "Fixed lots:",
                      stock.get(
                          "AfterHoursFixedLots",
                          int(stock.get("AfterHoursFixedVolume", 0) or 0) // 1000,
                      ),
                  )

              print(
                  "Broker lots:",
                  round(
                      int(
                          stock.get(
                              "BrokerComparableVolume",
                              stock.get("AdjustedTradeVolume", 0),
                          ) or 0
                      ) / 1000,
                      3,
                  ),
              )

          top10 = sorted(
              stocks,
              key=lambda stock: int(
                  stock.get(
                      "BrokerComparableVolume",
                      stock.get("AdjustedTradeVolume", 0),
                  ) or 0
              ),
              reverse=True,
          )[:10]

          print("")
          print("TOP 10")

          for index, stock in enumerate(top10, 1):
              print(
                  index,
                  stock.get("MarketName"),
                  stock.get("Code"),
                  stock.get("Name"),
                  round(
                      int(
                          stock.get(
                              "BrokerComparableVolume",
                              stock.get("AdjustedTradeVolume", 0),
                          ) or 0
                      ) / 1000
                  ),
                  "張",
              )
          PY

      - name: Show stocks.json info
        if: steps.market_data.outputs.skip_update != 'true'
        run: |
          ls -lh stocks.json
          echo ""
          head -n 55 stocks.json

      - name: Commit stock data
        if: steps.market_data.outputs.skip_update != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stocks.json

          if git diff --cached --quiet
          then
            echo "No changes. stocks.json remains unchanged."
          else
            git commit -m "chore: update synchronized Taiwan stock data"
            git push
          fi
