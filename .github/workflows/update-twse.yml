name: Update TWSE Data

on:
  workflow_dispatch:

  schedule:
    # 台灣時間 08:15
    - cron: "15 0 * * 1-5"

    # 台灣時間 17:40
    - cron: "40 9 * * 1-5"

    # 台灣時間 18:00 / 18:20 / 18:40
    - cron: "0,20,40 10 * * 1-5"

    # 台灣時間 19:00 / 19:20 / 19:40
    - cron: "0,20,40 11 * * 1-5"

    # 台灣時間 20:00
    - cron: "0 12 * * 1-5"


permissions:
  contents: write


concurrency:
  group: ds-market-data-write
  cancel-in-progress: false


jobs:

  update-twse:

    runs-on: ubuntu-latest

    timeout-minutes: 15


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      - name: Update TWSE
        run: python TWSE/update.py


      - name: Validate TWSE
        run: python TWSE/validate.py


      - name: Show TWSE data
        run: |
          ls -lh TWSE/stocks.json
          head -n 30 TWSE/stocks.json


      - name: Commit TWSE data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add TWSE/stocks.json

          if git diff --cached --quiet
          then

            echo "TWSE data unchanged."

            exit 0

          fi

          git commit \
            -m "chore: update TWSE data"

          git pull \
            --rebase \
            origin main

          git push
