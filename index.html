<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f1115"
  >

  <title>台股隔日當沖候選系統</title>


  <style>

    :root {

      --bg: #0f1115;

      --surface: #171a20;
      --surface-2: #1d2129;
      --surface-3: #242933;

      --border: #2b313d;

      --text: #f3f5f7;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;

      --up: #ff5a67;
      --down: #35c98b;

      --accent: #7c8cff;

      --radius-lg: 16px;
      --radius-md: 12px;

      --shadow:
        0 10px 28px rgba(0, 0, 0, 0.2);

    }


    * {
      box-sizing: border-box;
    }


    html {
      background: var(--bg);
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #11141a 0%,
          var(--bg) 220px
        );

      color: var(--text);

      -webkit-font-smoothing:
        antialiased;

    }


    button,
    select {
      font: inherit;
    }


    .app {

      width: min(
        1500px,
        96%
      );

      margin: 0 auto;

      padding:
        28px
        0
        50px;

    }


    /* ========================================
       Header
    ======================================== */

    .header {

      display: flex;

      align-items:
        flex-start;

      justify-content:
        space-between;

      gap: 18px;

      margin-bottom: 22px;

    }


    .title-area {
      min-width: 0;
    }


    .eyebrow {

      margin-bottom: 7px;

      color: var(--accent);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.08em;

    }


    h1 {

      margin: 0;

      font-size: 28px;
      line-height: 1.25;

      letter-spacing: -0.02em;

    }


    .subtitle {

      margin-top: 8px;

      color:
        var(--text-secondary);

      font-size: 14px;
      line-height: 1.6;

    }


    .reload-btn {

      flex-shrink: 0;

      border:
        1px solid
        var(--border);

      border-radius: 10px;

      padding:
        10px
        15px;

      background:
        var(--surface-2);

      color:
        var(--text);

      cursor: pointer;

    }


    .reload-btn:active {
      transform: scale(0.97);
    }


    /* ========================================
       Summary
    ======================================== */

    .summary {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin-bottom: 20px;

    }


    .summary-card {

      padding:
        15px
        17px;

      background:
        linear-gradient(
          145deg,
          var(--surface-2),
          var(--surface)
        );

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius-md);

    }


    .summary-label {

      margin-bottom: 7px;

      color:
        var(--text-secondary);

      font-size: 12px;

    }


    .summary-value {

      overflow: hidden;

      font-size: 18px;
      font-weight: 700;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

    }


    /* ========================================
       Controls
    ======================================== */

    .controls {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 12px;

      margin-bottom: 16px;

    }


    .status {

      color:
        var(--text-secondary);

      font-size: 13px;

    }


    .status.error {
      color: var(--up);
    }


    .desktop-hint {

      color:
        var(--text-muted);

      font-size: 12px;

    }


    .mobile-sort {
      display: none;
    }


    .sort-select {

      width: 100%;

      border:
        1px solid
        var(--border);

      border-radius: 10px;

      padding:
        11px
        38px
        11px
        13px;

      background:
        var(--surface-2);

      color:
        var(--text);

      outline: none;

    }


    /* ========================================
       Desktop
    ======================================== */

    .desktop-table {

      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius-lg);

      background:
        var(--surface);

      box-shadow:
        var(--shadow);

    }


    .table-scroll {
      overflow-x: auto;
    }


    table {

      width: 100%;

      min-width: 1260px;

      border-collapse:
        collapse;

    }


    thead {
      background: #1b1f27;
    }


    th {

      position: sticky;

      top: 0;

      z-index: 2;

      padding:
        13px
        12px;

      border-bottom:
        1px solid
        var(--border);

      color:
        var(--text-secondary);

      background:
        #1b1f27;

      font-size: 12px;
      font-weight: 600;

      text-align: right;

      white-space:
        nowrap;

      user-select:
        none;

    }


    td {

      padding:
        13px
        12px;

      border-bottom:
        1px solid
        rgba(
          43,
          49,
          61,
          0.75
        );

      color:
        #d9dde3;

      font-size: 13px;

      text-align: right;

      white-space:
        nowrap;

    }


    tbody tr:hover {
      background: #1c2027;
    }


    tbody tr:last-child td {
      border-bottom: none;
    }


    th:nth-child(1),
    th:nth-child(2),
    th:nth-child(3),
    td:nth-child(1),
    td:nth-child(2),
    td:nth-child(3) {
      text-align: left;
    }


    .sortable {
      cursor: pointer;
    }


    .sortable:hover {

      color:
        var(--text);

      background:
        #242932;

    }


    .sortable.active {

      color:
        var(--text);

      background:
        #232832;

    }


    .sort-icon {

      display:
        inline-block;

      min-width:
        14px;

      margin-left:
        3px;

      color:
        var(--accent);

    }


    .code {
      color:
        var(--text-secondary);
    }


    .stock-name {

      color:
        var(--text);

      font-weight:
        650;

    }


    .industry {
      color: #aeb5c0;
    }


    .up {
      color: var(--up);
    }


    .down {
      color: var(--down);
    }


    .neutral {
      color:
        var(--text-secondary);
    }


    /* ========================================
       Mobile
    ======================================== */

    .mobile-list {
      display: none;
    }


    .mobile-stock-card {

      position: relative;

      margin-bottom:
        8px;

      border:
        1px solid
        var(--border);

      border-radius:
        14px;

      background:
        linear-gradient(
          145deg,
          #1a1e25,
          #16191f
        );

      overflow: hidden;

      cursor: pointer;

      transition:
        border-color
        0.15s,
        background
        0.15s;

    }


    .mobile-stock-card:active {
      background: #1d2129;
    }


    /* ========================================
       收合卡片
    ======================================== */

    .mobile-card-summary {

      padding:
        13px
        14px
        12px;

    }


    .mobile-line {

      display: flex;

      align-items:
        center;

      min-width: 0;

    }


    /* 第一行 */

    .mobile-line-primary {

      gap: 7px;

      line-height: 1.35;

    }


    .mobile-name {

      flex-shrink: 0;

      color:
        var(--text);

      font-size: 16px;
      font-weight: 750;

    }


    .mobile-code {

      flex-shrink: 0;

      color:
        var(--text-muted);

      font-size: 11px;
      font-weight: 650;

    }


    .mobile-divider {

      flex-shrink: 0;

      color: #414854;

      font-size: 11px;

    }


    .mobile-change-percent {

      flex-shrink: 0;

      font-size: 14px;
      font-weight: 750;

      font-variant-numeric:
        tabular-nums;

    }


    /* 第二行 */

    .mobile-line-secondary {

      gap: 6px;

      margin-top: 8px;

      color:
        var(--text-secondary);

      font-size: 11px;

      line-height: 1.4;

    }


    .mobile-industry-inline {

      flex-shrink: 1;

      min-width: 0;

      overflow: hidden;

      max-width: 110px;

      color: #aeb5c0;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

    }


    .mobile-stat-inline {

      flex-shrink: 0;

      white-space:
        nowrap;

      font-variant-numeric:
        tabular-nums;

    }


    /* 第三行 */

    .mobile-ohlc-row {

      position: relative;

      margin-top: 9px;

      padding-right:
        30px;

      color:
        var(--text-secondary);

      font-size:
        10.5px;

      line-height:
        1.4;

      font-variant-numeric:
        tabular-nums;

      white-space:
        nowrap;

    }


    .mobile-ohlc-separator {

      color: #4a515d;

      margin:
        0
        2px;

    }


    /* ========================================
       Arrow
    ======================================== */

    .mobile-arrow {

      position:
        absolute;

      right: 16px;
      bottom: 17px;

      width: 10px;
      height: 10px;

      border-right:
        2px solid
        var(--text-muted);

      border-bottom:
        2px solid
        var(--text-muted);

      transform:
        rotate(
          45deg
        );

      transition:
        transform
        0.2s;

    }


    .mobile-stock-card.expanded
    .mobile-arrow {

      transform:
        rotate(
          225deg
        );

    }


    /* ========================================
       展開
    ======================================== */

    .mobile-card-details {

      max-height: 0;

      overflow: hidden;

      opacity: 0;

      border-top:
        1px solid
        transparent;

      transition:
        max-height
        0.25s ease,
        opacity
        0.2s ease,
        padding
        0.25s ease,
        border-color
        0.25s ease;

    }


    .mobile-stock-card.expanded
    .mobile-card-details {

      max-height:
        320px;

      padding:
        12px
        14px
        14px;

      opacity: 1;

      border-top:
        1px solid
        var(--border);

    }


    .mobile-stock-card.expanded
    .mobile-arrow {

      bottom: auto;

      top: 64px;

    }


    .detail-grid {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 8px;

    }


    .detail-item {

      min-width: 0;

      padding:
        9px
        10px;

      border:
        1px solid
        rgba(
          43,
          49,
          61,
          0.8
        );

      border-radius:
        9px;

      background:
        rgba(
          255,
          255,
          255,
          0.025
        );

    }


    .detail-label {

      margin-bottom: 4px;

      color:
        var(--text-muted);

      font-size: 9px;

    }


    .detail-value {

      overflow: hidden;

      color:
        #e1e5ea;

      font-size: 12px;
      font-weight: 650;

      font-variant-numeric:
        tabular-nums;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

    }


    /* ========================================
       Loading
    ======================================== */

    .loading {

      padding:
        50px
        20px;

      color:
        var(--text-secondary);

      text-align:
        center;

    }


    /* ========================================
       Mobile 9:16
    ======================================== */

    @media (
      max-width: 720px
    ) {

      body {
        background:
          var(--bg);
      }


      .app {

        width: 100%;

        padding:
          max(
            18px,
            env(
              safe-area-inset-top
            )
          )
          14px
          calc(
            32px
            +
            env(
              safe-area-inset-bottom
            )
          );

      }


      .header {

        align-items:
          center;

        margin-bottom:
          17px;

      }


      .eyebrow {

        margin-bottom:
          5px;

        font-size:
          10px;

      }


      h1 {
        font-size: 21px;
      }


      .subtitle {
        display: none;
      }


      .reload-btn {

        padding:
          9px
          12px;

        font-size:
          12px;

      }


      .summary {

        grid-template-columns:
          1fr
          1fr;

        gap: 8px;

        margin-bottom:
          14px;

      }


      .summary-card {

        padding:
          12px
          13px;

      }


      .summary-card:last-child {

        grid-column:
          1 / -1;

      }


      .summary-label {

        margin-bottom:
          5px;

        font-size:
          10px;

      }


      .summary-value {
        font-size: 15px;
      }


      .controls {

        display: block;

        margin-bottom:
          12px;

      }


      .status {

        margin-bottom:
          9px;

        font-size:
          11px;

      }


      .desktop-hint {
        display: none;
      }


      .mobile-sort {
        display: block;
      }


      .desktop-table {
        display: none;
      }


      .mobile-list {
        display: block;
      }

    }


    @media (
      max-width: 390px
    ) {

      .mobile-card-summary {

        padding-left:
          12px;

        padding-right:
          12px;

      }


      .mobile-name {
        font-size: 15px;
      }


      .mobile-change-percent {
        font-size: 13px;
      }


      .mobile-line-secondary {

        gap: 5px;

        font-size: 10px;

      }


      .mobile-industry-inline {
        max-width: 86px;
      }


      .mobile-ohlc-row {

        padding-right:
          28px;

        font-size:
          9.5px;

      }

    }

  </style>

</head>


<body>

  <main class="app">


    <!-- =====================================
         Header
    ====================================== -->

    <header class="header">

      <div class="title-area">

        <div class="eyebrow">
          TWSE MARKET WATCH
        </div>

        <h1>
          台股隔日當沖候選
        </h1>

        <div class="subtitle">
          使用前一交易日上市個股行情，觀察成交、價格與產業分布。
        </div>

      </div>


      <button
        id="reloadBtn"
        class="reload-btn"
      >
        重新讀取
      </button>

    </header>


    <!-- =====================================
         Summary
    ====================================== -->

    <section class="summary">

      <div class="summary-card">

        <div class="summary-label">
          交易日期
        </div>

        <div
          id="tradeDateValue"
          class="summary-value"
        >
          -
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          有效個股
        </div>

        <div
          id="countValue"
          class="summary-value"
        >
          -
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          資料更新
        </div>

        <div
          id="updatedAtValue"
          class="summary-value"
        >
          -
        </div>

      </div>

    </section>


    <!-- =====================================
         Controls
    ====================================== -->

    <section class="controls">

      <div
        id="status"
        class="status"
      >
        載入資料中...
      </div>


      <div class="desktop-hint">
        點擊欄位名稱切換升冪 / 降冪
      </div>


      <div class="mobile-sort">

        <select
          id="mobileSortSelect"
          class="sort-select"
        >

          <option value="">
            排序方式
          </option>

          <option value="TradeVolume:desc">
            成交量｜大 → 小
          </option>

          <option value="TradeVolume:asc">
            成交量｜小 → 大
          </option>

          <option value="TradeValue:desc">
            成交金額｜大 → 小
          </option>

          <option value="TradeValue:asc">
            成交金額｜小 → 大
          </option>

          <option value="Transaction:desc">
            成交筆數｜大 → 小
          </option>

          <option value="Transaction:asc">
            成交筆數｜小 → 大
          </option>

          <option value="ChangePercent:desc">
            漲跌幅｜高 → 低
          </option>

          <option value="ChangePercent:asc">
            漲跌幅｜低 → 高
          </option>

          <option value="Amplitude:desc">
            振幅｜大 → 小
          </option>

          <option value="Amplitude:asc">
            振幅｜小 → 大
          </option>

          <option value="Industry:asc">
            產業別｜A → Z
          </option>

        </select>

      </div>

    </section>


    <!-- =====================================
         Desktop Table
    ====================================== -->

    <section class="desktop-table">

      <div class="table-scroll">

        <table>

          <thead>

            <tr>

              <th
                class="sortable"
                data-key="Code"
                data-type="text"
              >
                代號
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="Name"
                data-type="text"
              >
                名稱
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="Industry"
                data-type="text"
              >
                產業別
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="TradeVolume"
                data-type="number"
              >
                成交量（不含零股／張）
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="Transaction"
                data-type="number"
              >
                成交筆數
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="TradeValue"
                data-type="number"
              >
                成交金額
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="OpeningPrice"
                data-type="number"
              >
                開盤
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="HighestPrice"
                data-type="number"
              >
                最高
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="LowestPrice"
                data-type="number"
              >
                最低
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="ClosingPrice"
                data-type="number"
              >
                收盤
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="ChangePercent"
                data-type="number"
              >
                漲跌幅
                <span class="sort-icon"></span>
              </th>


              <th
                class="sortable"
                data-key="Amplitude"
                data-type="number"
              >
                振幅
                <span class="sort-icon"></span>
              </th>

            </tr>

          </thead>


          <tbody
            id="stockTableBody"
          >
          </tbody>

        </table>

      </div>

    </section>


    <!-- =====================================
         Mobile
    ====================================== -->

    <section
      id="mobileStockList"
      class="mobile-list"
    >

      <div class="loading">
        載入資料中...
      </div>

    </section>

  </main>


  <script>

    const DATA_URL =
      "./stocks.json";


    let stocks = [];

    let currentView = [];


    let sortState = {

      key: null,

      direction: null

    };


    const statusEl =
      document.getElementById(
        "status"
      );


    const tableBody =
      document.getElementById(
        "stockTableBody"
      );


    const mobileStockList =
      document.getElementById(
        "mobileStockList"
      );


    const tradeDateValue =
      document.getElementById(
        "tradeDateValue"
      );


    const countValue =
      document.getElementById(
        "countValue"
      );


    const updatedAtValue =
      document.getElementById(
        "updatedAtValue"
      );


    const mobileSortSelect =
      document.getElementById(
        "mobileSortSelect"
      );


    /* ========================================
       Number
    ======================================== */

    function toNumber(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return 0;

      }


      const cleaned =
        String(
          value
        )

          .replace(
            /,/g,
            ""
          )

          .replace(
            /\+/g,
            ""
          )

          .trim();


      const number =
        Number(
          cleaned
        );


      return Number.isFinite(
        number
      )
        ? number
        : 0;

    }


    /* ========================================
       Escape
    ======================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ========================================
       Format Number
    ======================================== */

    function formatNumber(
      value
    ) {

      return Number(
        toNumber(
          value
        )
      ).toLocaleString(
        "zh-TW"
      );

    }


    /* ========================================
       成交量
       優先使用不含零股
    ======================================== */

    function getTradeVolumeShares(
      stock
    ) {

      if (
        stock
          .NonOddLotTradeVolume
        !== undefined
        &&
        stock
          .NonOddLotTradeVolume
        !== null
        &&
        stock
          .NonOddLotTradeVolume
        !== ""
      ) {

        return Math.max(
          0,
          toNumber(
            stock
              .NonOddLotTradeVolume
          )
        );

      }


      /*
        舊版 stocks.json fallback：

        如果已經有零股欄位，
        前端自行扣除。
      */

      if (
        stock
          .OddLotVolume
        !== undefined
      ) {

        return Math.max(
          0,

          toNumber(
            stock.TradeVolume
          )
          -
          toNumber(
            stock.OddLotVolume
          )
        );

      }


      /*
        最舊版 JSON：

        還沒有零股資料，
        暫時使用原始成交量。
      */

      return Math.max(
        0,
        toNumber(
          stock.TradeVolume
        )
      );

    }


    /* ========================================
       股 → 張
    ======================================== */

    function getVolumeLots(
      stock
    ) {

      return (
        getTradeVolumeShares(
          stock
        )
        /
        1000
      );

    }


    function formatVolumeLots(
      stock
    ) {

      return (
        Math.round(
          getVolumeLots(
            stock
          )
        )
        .toLocaleString(
          "zh-TW"
        )
        +
        "張"
      );

    }


    function formatVolumeLotsNumber(
      stock
    ) {

      return Math.round(
        getVolumeLots(
          stock
        )
      ).toLocaleString(
        "zh-TW"
      );

    }


    /* ========================================
       Money
    ======================================== */

    function formatCompactMoney(
      value
    ) {

      const number =
        toNumber(
          value
        );


      if (
        number >=
        100000000
      ) {

        const result =
          number
          /
          100000000;


        if (
          result >= 100
        ) {

          return (
            result.toFixed(
              1
            )
            +
            "億"
          );

        }


        return (
          result.toFixed(
            2
          )
          +
          "億"
        );

      }


      if (
        number >=
        10000
      ) {

        const result =
          number
          /
          10000;


        if (
          result >= 100
        ) {

          return (
            result.toFixed(
              0
            )
            +
            "萬"
          );

        }


        return (
          result.toFixed(
            1
          )
          +
          "萬"
        );

      }


      return formatNumber(
        number
      );

    }


    /* ========================================
       Price
    ======================================== */

    function formatPrice(
      value
    ) {

      const number =
        toNumber(
          value
        );


      if (
        number <= 0
      ) {

        return "-";

      }


      return number.toLocaleString(
        "zh-TW",
        {

          minimumFractionDigits:
            0,

          maximumFractionDigits:
            2

        }
      );

    }


    /* ========================================
       Date
    ======================================== */

    function formatTradeDate(
      value
    ) {

      const raw =
        String(
          value || ""
        ).trim();


      if (
        raw.length !== 7
      ) {

        return raw || "-";

      }


      const rocYear =
        Number(
          raw.slice(
            0,
            3
          )
        );


      const month =
        raw.slice(
          3,
          5
        );


      const day =
        raw.slice(
          5,
          7
        );


      if (
        !Number.isFinite(
          rocYear
        )
      ) {

        return raw;

      }


      return (
        `${rocYear + 1911}/${month}/${day}`
      );

    }


    /* ========================================
       漲跌
    ======================================== */

    function getChangeClass(
      value
    ) {

      const number =
        toNumber(
          value
        );


      if (
        number > 0
      ) {

        return "up";

      }


      if (
        number < 0
      ) {

        return "down";

      }


      return "neutral";

    }


    function calculatePreviousClose(
      stock
    ) {

      return (
        toNumber(
          stock.ClosingPrice
        )
        -
        toNumber(
          stock.Change
        )
      );

    }


    function calculateChangePercent(
      stock
    ) {

      const previousClose =
        calculatePreviousClose(
          stock
        );


      const change =
        toNumber(
          stock.Change
        );


      if (
        previousClose <= 0
      ) {

        return 0;

      }


      return (
        change
        /
        previousClose
        *
        100
      );

    }


    function formatChangePercent(
      stock
    ) {

      const percent =
        calculateChangePercent(
          stock
        );


      const prefix =
        percent > 0
          ? "+"
          : "";


      return (
        prefix
        +
        percent.toFixed(
          2
        )
        +
        "%"
      );

    }


    function formatPriceChange(
      stock
    ) {

      const change =
        toNumber(
          stock.Change
        );


      const prefix =
        change > 0
          ? "+"
          : "";


      return (
        prefix
        +
        change
      );

    }


    /* ========================================
       振幅
    ======================================== */

    function calculateAmplitude(
      stock
    ) {

      const high =
        toNumber(
          stock.HighestPrice
        );


      const low =
        toNumber(
          stock.LowestPrice
        );


      const open =
        toNumber(
          stock.OpeningPrice
        );


      if (
        high <= 0
        ||
        low <= 0
        ||
        open <= 0
      ) {

        return 0;

      }


      return (
        (
          high
          -
          low
        )
        /
        open
        *
        100
      );

    }


    /* ========================================
       Desktop Render
    ======================================== */

    function renderDesktopTable(
      data
    ) {

      tableBody.innerHTML =
        "";


      const fragment =
        document

      data.forEach(
        stock => {

          const tr =
            document.createElement(
              "tr"
            );


          const changePercent =
            calculateChangePercent(
              stock
            );


          const amplitude =
            calculateAmplitude(
              stock
            );


          tr.innerHTML = `

            <td class="code">

              ${escapeHtml(
                stock.Code || ""

            </td>


            <td class="stock-name">

              ${escapeHtml(
                stock.Name || ""
              )}

            </td>


            <td class="industry">

              ${escapeHtml(
                stock.Industry
                ||
                "未分類"
              )}

            </td>


            <td>

              ${formatVolumeLotsNumber(
                stock
              )}

            </td>


            <td>

              ${formatNumber(
                stock.Transaction
              )}

            </td>


            <td>

              ${formatNumber(
                stock.TradeValue
              )}

            </td>


            <td>

              ${formatPrice(
                stock.OpeningPrice
              )}

            </td>


            <td>

              ${formatPrice(
                stock.HighestPrice
              )}

            </td>


            <td>

              ${formatPrice(
                stock.LowestPrice
              )}

            </td>


            <td>

              ${formatPrice(
                stock.ClosingPrice
              )}

            </td>


            <td
              class="
                ${getChangeClass(
                  changePercent
                )}
              "
            >

              ${formatChangePercent(
                stock
              )}

            </td>


            <td>

              ${amplitude.toFixed(
                2
              )}%

            </td>

          `;


          fragment.appendChild(
            tr

        }
      );


      tableBody.appendChild(
        fragment
      );

    }

    ======================================== */

            );

            calculateAmplitude(

            );

            getChangeClass(

            );


          card.innerHTML = `

            <div

              <!-- 第一行 -->

                "

                  )}

                >

                  "

                </span>


                <span

                  "

                </span>

              </div>


              <!-- 第二行 -->

              <div
                class="

                  mobile-line-secondary
                "
              >

                <span
                  class="
                    mobile-industry-inline
                  "
                >

                  ${escapeHtml(
                    stock.Industry
                    ||
                    "未分類"
                  )}

                </span>


                <span
                  class="
                    mobile-divider
                  "
                >
                  |
                </span>


                <span
                  class="
                    mobile-stat-inline
                  "
                >

                  成交量
                  ${formatVolumeLots(

                  )}

                </span>


                <span
                  class="
                    mobile-divider
                  "
                >
                  |
                </span>


                <span
                  class="
                    mobile-stat-inline
                  "
                >

                  成交金額
                  ${formatCompactMoney(
                    stock.TradeValue
                  )}

                </span>

              </div>


              <!-- 第三行 -->

              <div

                  mobile-ohlc-row
                "
              >

                <span>

                  開
                  ${formatPrice(
                    stock.OpeningPrice
                  )}

                </span>


                <span
                  class="
                    mobile-ohlc-separator
                  "
                >
                  ｜
                </span>


                <span>

                  高
                  ${formatPrice(
                    stock.HighestPrice
                  )}

                </span>


                <span
                  class="
                    mobile-ohlc-separator
                  "
                >
                  ｜
                </span>


                <span>

                  低
                  ${formatPrice(
                    stock.LowestPrice
                  )}

                </span>


                <span
                  class="
                    mobile-ohlc-separator
                  "
                >
                  ｜
                </span>


                <span>

                  收
                  ${formatPrice(
                    stock.ClosingPrice
                  )}

                </span>

              </div>

            </div>


            <span
              class="
                mobile-arrow
              "
            >
            </span>


            <!-- 展開 -->

            <div
              class="
                mobile-card-details
              "
            >

              <div
                class="
                  detail-grid
                "
              >

                <div
                  class="
                    detail-item
                  "
                >

                  <div
                    class="
                      detail-label
                    "
                  >
                    成交筆數
                  </div>

                  <div
                    class="
                      detail-value
                    "
                  >

                    ${formatNumber(
                      stock.Transaction
                    )}

                <div
                  class="
                    detail-item

                >

                  <div

                      detail-label

                  >
                    漲跌價差

                      detail-value

                    "

                  "
                >

                    "
                  >
                    振幅
                  </div>

                      detail-value
                    "
                  >

                    ${amplitude.toFixed(
                      2
                    )}%

                  </div>

                <div
                  class="
                    detail-item
                  "
                >

                    "
                  >

                  </div>

                    "

                    ${formatVolumeLots(

                <div

                  "
                >

                  <div
                    class="
                      detail-label
                    "
                  >
                    完整成交金額

                    "

                    ${formatNumber(

          card.addEventListener(

              card.classList.toggle(

          card.addEventListener(
            "keydown",
            event => {

              if (
                event.key
                ===
                "Enter"
                ||
                event.key
                ===
                " "
              ) {

                event.preventDefault();


                card.classList.toggle(
                  "expanded"
                );

              }

            }
          );


          fragment.appendChild(
            card
          );

        }
      );


      mobileStockList.appendChild(
        fragment
      );

    }


    /* ========================================
       Render All
    ======================================== */

    function renderAll() {

      renderDesktopTable(
        currentView
      );


      renderMobileCards(
        currentView
      );

    }


    /* ========================================
       Sorting
    ======================================== */

    function getSortValue(
      stock,
      key,
      type
    ) {

      if (
        key ===
        "Amplitude"
      ) {

        return calculateAmplitude(
          stock
        );

      }


      if (
        key ===
        "ChangePercent"
      ) {

        return calculateChangePercent(
          stock
        );

      }


      /*
        成交量排序：

        改用「不含零股成交量」
      */

      if (
        key ===
        "TradeVolume"
      ) {

        return getTradeVolumeShares(
          stock
        );

      }


      if (
        type ===
        "number"
      ) {

        return toNumber(
          stock[
            key
          ]
        );

      }


      return String(
        stock[
          key
        ]
        ||
        ""
      );

    }


    function applySort(
      key,
      direction,
      type
    ) {

      sortState = {

        key,

        direction

      };


      currentView =
        [...stocks]
          .sort(
            (
              a,
              b
            ) => {

              const aValue =
                getSortValue(
                  a,
                  key,
                  type
                );


              const bValue =
                getSortValue(
                  b,
                  key,
                  type
                );


              let result = 0;


              if (
                type ===
                "number"
              ) {

                result =
                  aValue
                  -
                  bValue;

              }

              else {

                result =
                  aValue.localeCompare(
                    bValue,
                    "zh-Hant"
                  );

              }


              return (
                direction
                ===
                "asc"
              )
                ? result
                : -result;

            }
          );


      renderAll();


      updateDesktopSortIcons();

    }


    /* ========================================
       Desktop Sort
    ======================================== */

    function sortFromHeader(
      th
    ) {

      const key =
        th.dataset.key;


      const type =
        th.dataset.type;


      let direction;


      if (
        sortState.key
        ===
        key
      ) {

        direction =
          sortState.direction
          ===
          "desc"
            ? "asc"
            : "desc";

      }

      else {

        direction =
          type
          ===
          "number"
            ? "desc"
            : "asc";

      }


      applySort(
        key,
        direction,
        type
      );

    }


    function updateDesktopSortIcons() {

      document
        .querySelectorAll(
          "th.sortable"
        )
        .forEach(
          th => {

            th.classList.remove(
              "active"
            );


            const icon =
              th.querySelector(
                ".sort-icon"
              );


            icon.textContent =
              "";


            if (
              th.dataset.key
              ===
              sortState.key
            ) {

              th.classList.add(
                "active"
              );


              icon.textContent =
                sortState.direction
                ===
                "desc"
                  ? "↓"
                  : "↑";

            }

          }
        );

    }


    /* ========================================
       Load
    ======================================== */

    async function loadStocks() {

      statusEl.classList.remove(
        "error"
      );


      statusEl.textContent =
        "讀取 stocks.json 中...";


      mobileStockList.innerHTML =
        `
          <div class="loading">
            載入資料中...
          </div>
        `;


      try {

        const response =
          await fetch(
            `${DATA_URL}?t=${Date.now()}`
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const json =
          await response.json();


        const data =
          Array.isArray(
            json
          )
            ? json
            : json.data;


        if (
          !Array.isArray(
            data
          )
        ) {

          throw new Error(
            "stocks.json 格式錯誤"
          );

        }


        stocks =
          data.filter(
            stock => {

              const code =
                String(
                  stock.Code
                  ||
                  ""
                ).trim();


              const close =
                toNumber(
                  stock.ClosingPrice
                );


              return (
                code !== ""
                &&
                close > 0
              );

            }
          );


        currentView =
          [...stocks];


        sortState = {

          key: null,

          direction: null

        };


        mobileSortSelect.value =
          "";


        renderAll();


        updateDesktopSortIcons();


        const tradeDate =
          Array.isArray(
            json
          )
            ? ""
            : json.tradeDate;


        const updatedAt =
          Array.isArray(
            json
          )
            ? ""
            : json.updatedAt;


        const oddLotStatus =
          Array.isArray(
            json
          )
            ? ""
            : json.oddLotStatus;


        tradeDateValue.textContent =
          formatTradeDate(
            tradeDate
          );


        countValue.textContent =
          `${stocks.length} 檔`;


        updatedAtValue.textContent =
          updatedAt
          ||
          "-";


        if (
          oddLotStatus ===
          "complete"
        ) {

          statusEl.textContent =
            `已載入 ${stocks.length} 檔有效上市個股｜成交量已排除零股`;

        }

        else {

          statusEl.textContent =
            `已載入 ${stocks.length} 檔有效上市個股｜尚未取得新版零股資料`;

        }

      }

      catch (
        error
      ) {

        console.error(
          error
        );


        stocks = [];

        currentView = [];


        tableBody.innerHTML =
          "";


        mobileStockList.innerHTML =
          `
            <div class="loading">
              資料讀取失敗
            </div>
          `;


        tradeDateValue.textContent =
          "-";


        countValue.textContent =
          "-";


        updatedAtValue.textContent =
          "-";


        statusEl.classList.add(
          "error"
        );


        statusEl.textContent =
          "stocks.json 讀取失敗："
          +
          error.message;

      }

    }


    /* ========================================
       Events
    ======================================== */

    document
      .querySelectorAll(
        "th.sortable"
      )
      .forEach(
        th => {

          th.addEventListener(
            "click",
            () => {

              sortFromHeader(
                th
              );

            }
          );

        }
      );


    mobileSortSelect
      .addEventListener(
        "change",
        () => {

          const value =
            mobileSortSelect.value;


          if (
            !value
          ) {

            currentView =
              [...stocks];


            sortState = {

              key: null,

              direction: null

            };


            renderAll();


            updateDesktopSortIcons();


            return;

          }


          const [
            key,
            direction
          ] =
            value.split(
              ":"
            );


          const textKeys = [

            "Code",

            "Name",

            "Industry"

          ];


          const type =
            textKeys.includes(
              key
            )
              ? "text"
              : "number";


          applySort(
            key,
            direction,
            type
          );

        }
      );


    document
      .getElementById(
        "reloadBtn"
      )
      .addEventListener(
        "click",
        loadStocks
      );


    /* ========================================
       Init
    ======================================== */

    loadStocks();

  </script>
