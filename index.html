<script>

const CONFIG = {

  candidateLimit:
    10,

  liquidityPoolSize:
    120,

  minimumAmplitude:
    2,

  longClosePosition:
    0.65,

  shortClosePosition:
    0.35,

  entryWatchTicks:
    2,

  weights: {

    liquidity:
      25,

    change:
      20,

    body:
      15,

    closePosition:
      25,

    amplitude:
      15

  }

};


const state = {

  twse:
    null,

  tpex:
    null,

  stocks:
    [],

  long:
    [],

  short:
    [],

  synchronized:
    false

};


/* ==================================================
   NUMBER
   ================================================== */

function num(
  value
) {

  if (
    value === null
    ||
    value === undefined
  ) {

    return 0;

  }

  let text =
    String(
      value
    )
    .replace(
      /,/g,
      ""
    )
    .replace(
      /\+/g,
      ""
    )
    .trim();

  if (
    !text
    ||
    text === "-"
    ||
    text === "--"
  ) {

    return 0;

  }

  const direct =
    Number(
      text
    );

  if (
    Number.isFinite(
      direct
    )
  ) {

    return direct;

  }

  text =
    text.replace(
      /[^0-9.\-]/g,
      ""
    );

  const parsed =
    Number(
      text
    );

  return Number.isFinite(
    parsed
  )
    ? parsed
    : 0;

}


function clamp(
  value,
  min,
  max
) {

  return Math.min(
    max,
    Math.max(
      min,
      value
    )
  );

}


function escapeHtml(
  value
) {

  return String(
    value
    ??
    ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* ==================================================
   PRICE TICK
   ================================================== */

function getTickSize(
  price
) {

  const value =
    num(
      price
    );

  if (
    value < 10
  ) {

    return 0.01;

  }

  if (
    value < 50
  ) {

    return 0.05;

  }

  if (
    value < 100
  ) {

    return 0.1;

  }

  if (
    value < 500
  ) {

    return 0.5;

  }

  if (
    value < 1000
  ) {

    return 1;

  }

  return 5;

}


function roundPrice(
  value
) {

  return Number(
    Number(
      value
    )
    .toFixed(
      2
    )
  );

}


function nextTick(
  price
) {

  const value =
    num(
      price
    );

  if (
    value <= 0
  ) {

    return 0;

  }

  return roundPrice(
    value
    +
    getTickSize(
      value
    )
  );

}


function previousTick(
  price
) {

  const value =
    num(
      price
    );

  if (
    value <= 0
  ) {

    return 0;

  }

  const lookupPrice =
    Math.max(
      0,
      value
      -
      0.0000001
    );

  return roundPrice(
    value
    -
    getTickSize(
      lookupPrice
    )
  );

}


function moveTicks(
  price,
  ticks
) {

  let current =
    num(
      price
    );

  const amount =
    Math.abs(
      Math.trunc(
        ticks
      )
    );

  for (
    let index = 0;
    index < amount;
    index += 1
  ) {

    current =
      ticks > 0
        ? nextTick(
            current
          )
        : previousTick(
            current
          );

  }

  return current;

}


/* ==================================================
   FORMAT
   ================================================== */

function formatPrice(
  value
) {

  const price =
    num(
      value
    );

  if (
    price <= 0
  ) {

    return "-";

  }

  const tick =
    getTickSize(
      price
    );

  const decimals =
    tick < 0.1
      ? 2
      : tick < 1
        ? 1
        : 0;

  return price.toFixed(
    decimals
  );

}


function formatPercent(
  value
) {

  const number =
    num(
      value
    );

  return (
    (
      number > 0
        ? "+"
        : ""
    )
    +
    number.toFixed(
      2
    )
    +
    "%"
  );

}


function formatLots(
  shares
) {

  return Math.round(
    num(
      shares
    )
    /
    1000
  )
  .toLocaleString(
    "zh-TW"
  );

}


/* ==================================================
   STOCK DATA
   ================================================== */

function getTradeVolume(
  stock
) {

  const fields = [

    "BrokerComparableVolume",

    "AdjustedTradeVolume",

    "RegularTradeVolume",

    "TradeVolume"

  ];

  for (
    const field
    of fields
  ) {

    if (
      stock[
        field
      ] !== undefined
      &&
      stock[
        field
      ] !== null
      &&
      stock[
        field
      ] !== ""
    ) {

      return Math.max(
        0,
        num(
          stock[
            field
          ]
        )
      );

    }

  }

  return 0;

}


function previousClose(
  stock
) {

  return (
    num(
      stock.ClosingPrice
    )
    -
    num(
      stock.Change
    )
  );

}


function changePercent(
  stock
) {

  const previous =
    previousClose(
      stock
    );

  if (
    previous <= 0
  ) {

    return 0;

  }

  return (
    num(
      stock.Change
    )
    /
    previous
    *
    100
  );

}


function amplitude(
  stock
) {

  const high =
    num(
      stock.HighestPrice
    );

  const low =
    num(
      stock.LowestPrice
    );

  const open =
    num(
      stock.OpeningPrice
    );

  if (
    high <= 0
    ||
    low <= 0
    ||
    open <= 0
  ) {

    return 0;

  }

  return (
    (
      high
      -
      low
    )
    /
    open
    *
    100
  );

}


function closePosition(
  stock
) {

  const high =
    num(
      stock.HighestPrice
    );

  const low =
    num(
      stock.LowestPrice
    );

  const close =
    num(
      stock.ClosingPrice
    );

  const range =
    high
    -
    low;

  if (
    range <= 0
  ) {

    return 0.5;

  }

  return clamp(
    (
      close
      -
      low
    )
    /
    range,
    0,
    1
  );

}


function bodyRatio(
  stock
) {

  const open =
    num(
      stock.OpeningPrice
    );

  const close =
    num(
      stock.ClosingPrice
    );

  const high =
    num(
      stock.HighestPrice
    );

  const low =
    num(
      stock.LowestPrice
    );

  const range =
    high
    -
    low;

  if (
    range <= 0
  ) {

    return 0;

  }

  return (
    close
    -
    open
  )
  /
  range;

}


function validStock(
  stock
) {

  return Boolean(

    stock

    &&

    stock.Code

    &&

    num(
      stock.OpeningPrice
    ) > 0

    &&

    num(
      stock.HighestPrice
    ) > 0

    &&

    num(
      stock.LowestPrice
    ) > 0

    &&

    num(
      stock.ClosingPrice
    ) > 0

  );

}


/* ==================================================
   LIQUIDITY
   ================================================== */

function assignLiquidityRanks(
  stocks
) {

  const ranked =
    [
      ...stocks
    ]
    .sort(
      (
        a,
        b
      ) => {

        const volumeDiff =
          getTradeVolume(
            b
          )
          -
          getTradeVolume(
            a
          );

        if (
          volumeDiff !== 0
        ) {

          return volumeDiff;

        }

        return String(
          a.Code
          ??
          ""
        )
        .localeCompare(
          String(
            b.Code
            ??
            ""
          )
        );

      }
    );

  ranked.forEach(
    (
      stock,
      index
    ) => {

      stock.__liquidityRank =
        index
        +
        1;

    }
  );

}


/* ==================================================
   SCORE
   ================================================== */

function liquidityScore(
  stock
) {

  const rank =
    stock.__liquidityRank
    ??
    999999;

  if (
    rank >
    CONFIG.liquidityPoolSize
  ) {

    return 0;

  }

  const maxIndex =
    Math.max(
      1,
      CONFIG.liquidityPoolSize
      -
      1
    );

  return (
    CONFIG.weights.liquidity

    *

    (
      1
      -
      (
        rank
        -
        1
      )
      /
      maxIndex
    )
  );

}


function scoreLong(
  stock
) {

  const change =
    changePercent(
      stock
    );

  const body =
    bodyRatio(
      stock
    );

  const close =
    closePosition(
      stock
    );

  const amp =
    amplitude(
      stock
    );

  const score =
    liquidityScore(
      stock
    )

    +

    clamp(
      change
      /
      5,
      0,
      1
    )
    *
    CONFIG.weights.change

    +

    clamp(
      body,
      0,
      1
    )
    *
    CONFIG.weights.body

    +

    close
    *
    CONFIG.weights.closePosition

    +

    clamp(
      amp
      /
      6,
      0,
      1
    )
    *
    CONFIG.weights.amplitude;

  return Math.round(
    clamp(
      score,
      0,
      100
    )
  );

}


function scoreShort(
  stock
) {

  const change =
    changePercent(
      stock
    );

  const body =
    bodyRatio(
      stock
    );

  const close =
    closePosition(
      stock
    );

  const amp =
    amplitude(
      stock
    );

  const score =
    liquidityScore(
      stock
    )

    +

    clamp(
      -change
      /
      5,
      0,
      1
    )
    *
    CONFIG.weights.change

    +

    clamp(
      -body,
      0,
      1
    )
    *
    CONFIG.weights.body

    +

    (
      1
      -
      close
    )
    *
    CONFIG.weights.closePosition

    +

    clamp(
      amp
      /
      6,
      0,
      1
    )
    *
    CONFIG.weights.amplitude;

  return Math.round(
    clamp(
      score,
      0,
      100
    )
  );

}


/* ==================================================
   CANDIDATE RULE
   ================================================== */

function isLongCandidate(
  stock
) {

  return Boolean(

    stock.DayTradeEligible ===
    true

    &&

    stock.__liquidityRank
    <=
    CONFIG.liquidityPoolSize

    &&

    changePercent(
      stock
    ) > 0

    &&

    num(
      stock.ClosingPrice
    )
    >
    num(
      stock.OpeningPrice
    )

    &&

    closePosition(
      stock
    )
    >=
    CONFIG.longClosePosition

    &&

    amplitude(
      stock
    )
    >=
    CONFIG.minimumAmplitude

  );

}


function isShortCandidate(
  stock
) {

  return Boolean(

    stock.DayTradeEligible ===
    true

    &&

    stock.SellFirstDayTradeAllowed ===
    true

    &&

    stock.SellFirstSuspended !==
    true

    &&

    stock.__liquidityRank
    <=
    CONFIG.liquidityPoolSize

    &&

    changePercent(
      stock
    ) < 0

    &&

    num(
      stock.ClosingPrice
    )
    <
    num(
      stock.OpeningPrice
    )

    &&

    closePosition(
      stock
    )
    <=
    CONFIG.shortClosePosition

    &&

    amplitude(
      stock
    )
    >=
    CONFIG.minimumAmplitude

  );

}


function selectCandidates(
  stocks,
  side
) {

  const isCandidate =
    side === "long"
      ? isLongCandidate
      : isShortCandidate;

  const scoreFn =
    side === "long"
      ? scoreLong
      : scoreShort;

  return stocks

    .filter(
      isCandidate
    )

    .map(
      stock => ({

        ...stock,

        __score:
          scoreFn(
            stock
          )

      })
    )

    .sort(
      (
        a,
        b
      ) => {

        return (

          b.__score
          -
          a.__score

          ||

          a.__liquidityRank
          -
          b.__liquidityRank

          ||

          String(
            a.Code
          )
          .localeCompare(
            String(
              b.Code
            )
          )

        );

      }
    )

    .slice(
      0,
      CONFIG.candidateLimit
    );

}


/* ==================================================
   TRADE PLAN
   ================================================== */

function observationPrice(
  stock,
  side
) {

  if (
    side === "long"
  ) {

    return nextTick(
      stock.HighestPrice
    );

  }

  return previousTick(
    stock.LowestPrice
  );

}


function entryWatchZone(
  stock,
  side
) {

  const observation =
    observationPrice(
      stock,
      side
    );

  if (
    observation <= 0
  ) {

    return null;

  }

  if (
    side === "long"
  ) {

    return {

      from:
        observation,

      to:
        moveTicks(
          observation,
          CONFIG.entryWatchTicks
        )

    };

  }

  return {

    from:
      moveTicks(
        observation,
        -CONFIG.entryWatchTicks
      ),

    to:
      observation

  };

}


function eligibilityLabel(
  stock
) {

  if (
    stock.DayTradeEligible !==
    true
  ) {

    return "不可當沖";

  }

  if (
    stock.SellFirstSuspended ===
    true
  ) {

    return "暫停先賣";

  }

  if (
    stock.SellFirstDayTradeAllowed ===
    true
  ) {

    return "可先賣";

  }

  return "僅先買";

}


/* ==================================================
   FETCH
   ================================================== */

async function fetchMarket(
  url
) {

  const response =
    await fetch(
      url
      +
      "?t="
      +
      Date.now(),
      {

        cache:
          "no-store"

      }
    );

  if (
    !response.ok
  ) {

    throw new Error(
      `HTTP ${response.status}`
    );

  }

  return response.json();

}

   LOG STATUS
   ================================================== */

function setMarketStatus(
  market,
  payload,
  error
) {

  const prefix =
    market === "TWSE"
      ? "twse"
      : "tpex";

  const status =
    document.getElementById(
      prefix
      +
      "Status"
    );

  const meta =
    document.getElementById(
      prefix
      +
      "Meta"
    );


  if (
    error
  ) {

    status.textContent =
      "ERROR";

    status.className =
      "log-status status-error";

    meta.textContent =
      error.message
      ||
      "資料讀取失敗";

    return;

  }


  if (
    !payload
  ) {

    status.textContent =
      "NOT READY";

    status.className =
      "log-status status-error";

    meta.textContent =
      "尚未讀取到市場資料";

    return;

  }


  const count =
    Number(
      payload.count
      ||
      0
    );

  const tradeDate =
    String(
      payload.tradeDateISO
      ||
      ""
    );


  if (
    !tradeDate
    ||
    count <= 0
  ) {

    status.textContent =
      "WAITING DATA";

    status.className =
      "log-status status-waiting";

    meta.textContent =
      "尚未產生正式市場資料";

    return;

  }


  status.textContent =
    "READY";

  status.className =
    "log-status status-ready";

  meta.textContent =
    `${tradeDate} · `
    +
    `${count.toLocaleString("zh-TW")} 檔`;

}

  ) {

    );

  const twseReady =

      Number(

        ||
        0
      ) > 0

      &&

      Array.isArray(
        state.twse.data
      )

      &&

      state.twse.data.length > 0

    );


  const tpexReady =
    Boolean(

      state.tpex.tradeDateISO

      &&

      Number(
        state.tpex.count
        ||
        0
      ) > 0

      &&

      Array.isArray(
        state.tpex.data
      )

      &&

      state.tpex.data.length > 0

    );


  if (
    !twseReady
    ||
    !tpexReady
  ) {

    state.synchronized =
      false;

    status.textContent =
      "WAITING DATA";

    status.className =
      "log-status status-waiting";

    meta.textContent =
      "兩市場尚未都有正式資料";

    warning.classList.remove(
      "visible"
    );

    warning.textContent =
      "";

    return;

  }


  const sameDate =
    state.twse.tradeDateISO

    &&

    state.twse.tradeDateISO
    ===
    state.tpex.tradeDateISO;


  const sameVolumeMode =
    state.twse.volumeMode

    &&

    state.twse.volumeMode
    ===
    state.tpex.volumeMode;


  state.synchronized =
    Boolean(
      sameDate
      &&
      sameVolumeMode
    );


  if (
    state.synchronized
  ) {

    status.textContent =
      "SYNCED";

    status.className =
      "log-status status-ready";

    meta.textContent =
      `${state.twse.tradeDateISO}`
      +
      " · "
      +
      `${state.twse.volumeMode}`;

    warning.classList.remove(
      "visible"
    );

    warning.textContent =
      "";

  }

  else {

    status.textContent =
      "MISMATCH";

    status.className =
      "log-status status-error";


    if (
      !sameDate
      &&
      !sameVolumeMode
    ) {

      meta.textContent =
        "交易日期與 Volume Mode 皆不一致";

    }

    else if (
      !sameDate
    ) {

      meta.textContent =
        `日期不一致：TWSE ${state.twse.tradeDateISO} / TPEx ${state.tpex.tradeDateISO}`;

    }

    else {

      meta.textContent =
        "Volume Mode 不一致";

    }


    warning.textContent =
      (
        "TWSE / TPEx 資料日期或 Volume Mode 不一致。"
        +
        "為避免跨市場流動性排名使用不同交易日資料，"
        +
        "DS 不會建立候選池。"
      );

    warning.classList.add(
      "visible"
    );

  }

}


/* ==================================================
   BUILD CANDIDATES
   ================================================== */

function buildCandidates() {

  if (
    !state.synchronized
  ) {

    state.stocks =
      [];

    state.long =
      [];

    state.short =
      [];

    return;

  }


  state.stocks = [

    ...state.twse.data,

    ...state.tpex.data

  ]
  .filter(
    validStock
  );


  assignLiquidityRanks(
    state.stocks
  );


  state.long =
    selectCandidates(
      state.stocks,
      "long"
    );


  state.short =
    selectCandidates(
      state.stocks,
      "short"
    );

}


/* ==================================================
   LOAD
   ================================================== */

async function load() {

  const root =
    document.getElementById(
      "candidateRoot"
    );

  const reloadButton =
    document.getElementById(
      "reloadBtn"
    );


  root.innerHTML =
    `

      <div class="loading">
        載入 TWSE / TPEx...
      </div>

    `;


  reloadButton.disabled =
    true;

  reloadButton.textContent =
    "讀取中...";


  state.twse =
    null;

  state.tpex =
    null;

  state.stocks =
    [];

  state.long =
    [];

  state.short =
    [];

  state.synchronized =
    false;


  const twseStatus =
    document.getElementById(
      "twseStatus"
    );

  const twseMeta =
    document.getElementById(
      "twseMeta"
    );

  const tpexStatus =
    document.getElementById(
      "tpexStatus"
    );

  const tpexMeta =
    document.getElementById(
      "tpexMeta"
    );

  const syncStatus =
    document.getElementById(
      "syncStatus"
    );

  const syncMeta =
    document.getElementById(
      "syncMeta"
    );


  twseStatus.textContent =
    "LOADING";

  twseStatus.className =
    "log-status status-checking";

  twseMeta.textContent =
    "讀取中...";


  tpexStatus.textContent =
    "LOADING";

  tpexStatus.className =
    "log-status status-checking";

  tpexMeta.textContent =
    "讀取中...";


  syncStatus.textContent =
    "CHECKING";

  syncStatus.className =
    "log-status status-checking";

  syncMeta.textContent =
    "等待市場資料...";


  let twseError =
    null;

  let tpexError =
    null;


  try {

    const [
      twseResult,
      tpexResult
    ] =
      await Promise.allSettled([

        fetchMarket(
          "./TWSE/stocks.json"
        ),

        fetchMarket(
          "./TPEx/stocks.json"
        )

      ]);


    if (
      twseResult.status ===
      "fulfilled"
    ) {

      state.twse =
        twseResult.value;

    }

    else {

      twseError =
        twseResult.reason;

    }


    if (
      tpexResult.status ===
      "fulfilled"
    ) {

      state.tpex =
        tpexResult.value;

    }

    else {

      tpexError =
        tpexResult.reason;

    }


    setMarketStatus(
      "TWSE",
      state.twse,
      twseError
    );


    setMarketStatus(
      "TPEX",
      state.tpex,
      tpexError
    );


    updateSyncState();


    buildCandidates();


    renderSummary();


    renderCandidates();

  }

  finally {

    reloadButton.disabled =
      false;

    reloadButton.textContent =
      "重新讀取";

  }

}


/* ==================================================
   EVENTS
   ================================================== */

document
.getElementById(
  "reloadBtn"
)
.addEventListener(
  "click",
  load
);


document
.getElementById(
  "candidateRoot"
)
.addEventListener(
  "click",
  event => {

    const card =
      event.target.closest(
        ".candidate-card"
      );

    if (
      !card
    ) {

      return;

    }

    const stock =
      findCandidate(
        card.dataset.code,
        card.dataset.side
      );

    if (
      stock
    ) {

      openTradePlan(
        stock,
        card.dataset.side
      );

    }

  }
);


document
.getElementById(
  "tradeDialog"
)
.addEventListener(
  "click",
  event => {

    const dialog =
      event.currentTarget;

    const rect =
      dialog
      .getBoundingClientRect();

    const inside =
      (

        event.clientX
        >=
        rect.left

        &&

        event.clientX
        <=
        rect.right

        &&

        event.clientY
        >=
        rect.top

        &&

        event.clientY
        <=
        rect.bottom

      );

    if (
      !inside
    ) {

      dialog.close();

    }

  }
);


/* ==================================================
   START
   ================================================== */

load();

</script>


</body>

</html>
