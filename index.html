<script>

const CONFIG = {

  candidateLimit:
    10,

  liquidityPoolSize:
    120,

  minimumAmplitude:
    2,

  longClosePosition:
    0.65,

  shortClosePosition:
    0.35,

  entryWatchTicks:
    2,

  weights: {

    liquidity:
      25,

    change:
      20,

    body:
      15,

    closePosition:
      25,

    amplitude:
      15

  }

};


const state = {

  twse:
    null,

  tpex:
    null,

  stocks:
    [],

  long:
    [],

  short:
    [],

  synchronized:
    false

};


function num(
  value
) {

  if (
    value === null
    ||
    value === undefined
  ) {
    return 0;
  }

  let text =
    String(
      value
    )
    .replace(
      /,/g,
      ""
    )
    .replace(
      /\+/g,
      ""
    )
    .trim();

  if (
    !text
    ||
    text === "-"
    ||
    text === "--"
  ) {
    return 0;
  }

  const direct =
    Number(
      text
    );

  if (
    Number.isFinite(
      direct
    )
  ) {
    return direct;
  }

  text =
    text.replace(
      /[^0-9.\-]/g,
      ""
    );

  const parsed =
    Number(
      text
    );

  return Number.isFinite(
    parsed
  )
    ? parsed
    : 0;

}


function clamp(
  value,
  min,
  max
) {

  return Math.min(
    max,
    Math.max(
      min,
      value
    )
  );

}


function escapeHtml(
  value
) {

  return String(
    value
    ??
    ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function getTickSize(
  price
) {

  const value =
    num(
      price
    );

  if (
    value < 10
  ) {
    return 0.01;
  }

  if (
    value < 50
  ) {
    return 0.05;
  }

  if (
    value < 100
  ) {
    return 0.1;
  }

  if (
    value < 500
  ) {
    return 0.5;
  }

  if (
    value < 1000
  ) {
    return 1;
  }

  return 5;

}


function roundPrice(
  value
) {

  return Number(
    Number(
      value
    )
    .toFixed(
      2
    )
  );

}


function nextTick(
  price
) {

  const value =
    num(
      price
    );

  if (
    value <= 0
  ) {
    return 0;
  }

  return roundPrice(
    value
    +
    getTickSize(
      value
    )
  );

}


function previousTick(
  price
) {

  const value =
    num(
      price
    );

  if (
    value <= 0
  ) {
    return 0;
  }

  const lookupPrice =
    Math.max(
      0,
      value
      -
      0.0000001
    );

  return roundPrice(
    value
    -
    getTickSize(
      lookupPrice
    )
  );

}


function moveTicks(
  price,
  ticks
) {

  let current =
    num(
      price
    );

  const amount =
    Math.abs(
      Math.trunc(
        ticks
      )
    );

  for (
    let index = 0;
    index < amount;
    index += 1
  ) {

    current =
      ticks > 0
        ? nextTick(
            current
          )
        : previousTick(
            current
          );

  }

  return current;

}


function formatPrice(
  value
) {

  const price =
    num(
      value
    );

  if (
    price <= 0
  ) {
    return "-";
  }

  const tick =
    getTickSize(
      price
    );

  const decimals =
    tick < 0.1
      ? 2
      : tick < 1
        ? 1
        : 0;

  return price.toFixed(
    decimals
  );

}


function formatPercent(
  value
) {

  const number =
    num(
      value
    );

  return (
    (
      number > 0
        ? "+"
        : ""
    )
    +
    number.toFixed(
      2
    )
    +
    "%"
  );

}


function formatLots(
  shares
) {

  return Math.round(
    num(
      shares
    )
    /
    1000
  )
  .toLocaleString(
    "zh-TW"
  );

}


function getTradeVolume(
  stock
) {

  const fields = [

    "BrokerComparableVolume",

    "AdjustedTradeVolume",

    "RegularTradeVolume",

    "TradeVolume"

  ];

  for (
    const field
    of fields
  ) {

    if (
      stock[
        field
      ] !== undefined
      &&
      stock[
        field
      ] !== null
      &&
      stock[
        field
      ] !== ""
    ) {

      return Math.max(
        0,
        num(
          stock[
            field
          ]
        )
      );

    }

  }

  return 0;

}


function previousClose(
  stock
) {

  return (
    num(
      stock.ClosingPrice
    )
    -
    num(
      stock.Change
    )
  );

}


function changePercent(
  stock
) {

  const previous =
    previousClose(
      stock
    );

  if (
    previous <= 0
  ) {
    return 0;
  }

  return (
    num(
      stock.Change
    )
    /
    previous
    *
    100
  );

}


function amplitude(
  stock
) {

  const high =
    num(
      stock.HighestPrice
    );

  const low =
    num(
      stock.LowestPrice
    );

  const open =
    num(
      stock.OpeningPrice
    );

  if (
    high <= 0
    ||
    low <= 0
    ||
    open <= 0
  ) {
    return 0;
  }

  return (
    (
      high
      -
      low
    )
    /
    open
    *
    100
  );

}


function closePosition(
  stock
) {

  const high =
    num(
      stock.HighestPrice
    );

  const low =
    num(
      stock.LowestPrice
    );

  const close =
    num(
      stock.ClosingPrice
    );

  const range =
    high
    -
    low;

  if (
    range <= 0
  ) {
    return 0.5;
  }

  return clamp(
    (
      close
      -
      low
    )
    /
    range,
    0,
    1
  );

}


function bodyRatio(
  stock
) {

  const open =
    num(
      stock.OpeningPrice
    );

  const close =
    num(
      stock.ClosingPrice
    );

  const high =
    num(
      stock.HighestPrice
    );

  const low =
    num(
      stock.LowestPrice
    );

  const range =
    high
    -
    low;

  if (
    range <= 0
  ) {
    return 0;
  }

  return (
    close
    -
    open
  )
  /
  range;

}


function validStock(
  stock
) {

  return Boolean(
    stock
    &&
    stock.Code
    &&
    num(
      stock.OpeningPrice
    ) > 0
    &&
    num(
      stock.HighestPrice
    ) > 0
    &&
    num(
      stock.LowestPrice
    ) > 0
    &&
    num(
      stock.ClosingPrice
    ) > 0
  );

}


function assignLiquidityRanks(
  stocks
) {

  const ranked =
    [
      ...stocks
    ]
    .sort(
      (
        a,
        b
      ) => {

        const volumeDiff =
          getTradeVolume(
            b
          )
          -
          getTradeVolume(
            a
          );

        if (
          volumeDiff !== 0
        ) {
          return volumeDiff;
        }

        return String(
          a.Code
          ??
          ""
        )
        .localeCompare(
          String(
            b.Code
            ??
            ""
          )
        );

      }
    );

  ranked.forEach(
    (
      stock,
      index
    ) => {

      stock.__liquidityRank =
        index
        +
        1;

    }
  );

}


function liquidityScore(
  stock
) {

  const rank =
    stock.__liquidityRank
    ??
    999999;

  if (
    rank >
    CONFIG.liquidityPoolSize
  ) {
    return 0;
  }

  const maxIndex =
    Math.max(
      1,
      CONFIG.liquidityPoolSize
      -
      1
    );

  return (
    CONFIG.weights.liquidity
    *
    (
      1
      -
      (
        rank
        -
        1
      )
      /
      maxIndex
    )
  );

}


function scoreLong(
  stock
) {

  const change =
    changePercent(
      stock
    );

  const body =
    bodyRatio(
      stock
    );

  const close =
    closePosition(
      stock
    );

  const amp =
    amplitude(
      stock
    );

  const score =
    liquidityScore(
      stock
    )

    +

    clamp(
      change
      /
      5,
      0,
      1
    )
    *
    CONFIG.weights.change

    +

    clamp(
      body,
      0,
      1
    )
    *
    CONFIG.weights.body

    +

    close
    *
    CONFIG.weights.closePosition

    +

    clamp(
      amp
      /
      6,
      0,
      1
    )
    *
    CONFIG.weights.amplitude;

  return Math.round(
    clamp(
      score,
      0,
      100
    )
  );

}


function scoreShort(
  stock
) {

  const change =
    changePercent(
      stock
    );

  const body =
    bodyRatio(
      stock
    );

  const close =
    closePosition(
      stock
    );

  const amp =
    amplitude(
      stock
    );

  const score =
    liquidityScore(
      stock
    )

    +

    clamp(
      -change
      /
      5,
      0,
      1
    )
    *
    CONFIG.weights.change

    +

    clamp(
      -body,
      0,
      1
    )
    *
    CONFIG.weights.body

    +

    (
      1
      -
      close
    )
    *
    CONFIG.weights.closePosition

    +

    clamp(
      amp
      /
      6,
      0,
      1
    )
    *
    CONFIG.weights.amplitude;

  return Math.round(
    clamp(
      score,
      0,
      100
    )
  );

}


function isLongCandidate(
  stock
) {

  return Boolean(

    stock.DayTradeEligible ===
    true

    &&

    stock.__liquidityRank
    <=
    CONFIG.liquidityPoolSize

    &&

    changePercent(
      stock
    ) > 0

    &&

    num(
      stock.ClosingPrice
    )
    >
    num(
      stock.OpeningPrice
    )

    &&

    closePosition(
      stock
    )
    >=
    CONFIG.longClosePosition

    &&

    amplitude(
      stock
    )
    >=
    CONFIG.minimumAmplitude

  );

}


function isShortCandidate(
  stock
) {

  return Boolean(

    stock.DayTradeEligible ===
    true

    &&

    stock.SellFirstDayTradeAllowed ===
    true

    &&

    stock.SellFirstSuspended !==
    true

    &&

    stock.__liquidityRank
    <=
    CONFIG.liquidityPoolSize

    &&

    changePercent(
      stock
    ) < 0

    &&

    num(
      stock.ClosingPrice
    )
    <
    num(
      stock.OpeningPrice
    )

    &&

    closePosition(
      stock
    )
    <=
    CONFIG.shortClosePosition

    &&

    amplitude(
      stock
    )
    >=
    CONFIG.minimumAmplitude

  );

}


function selectCandidates(
  stocks,
  side
) {

  const isCandidate =
    side === "long"
      ? isLongCandidate
      : isShortCandidate;

  const scoreFn =
    side === "long"
      ? scoreLong
      : scoreShort;

  return stocks

    .filter(
      isCandidate
    )

    .map(
      stock => ({
        ...stock,

        __score:
          scoreFn(
            stock
          )
      })
    )

    .sort(
      (
        a,
        b
      ) => {

        return (

          b.__score
          -
          a.__score

          ||

          a.__liquidityRank
          -
          b.__liquidityRank

          ||

          String(
            a.Code
          )
          .localeCompare(
            String(
              b.Code
            )
          )

        );

      }
    )

    .slice(
      0,
      CONFIG.candidateLimit
    );

}


function observationPrice(
  stock,
  side
) {

  if (
    side === "long"
  ) {

    return nextTick(
      stock.HighestPrice
    );

  }

  return previousTick(
    stock.LowestPrice
  );

}


function entryWatchZone(
  stock,
  side
) {

  const observation =
    observationPrice(
      stock,
      side
    );

  if (
    observation <= 0
  ) {
    return null;
  }

  if (
    side === "long"
  ) {

    return {
      from:
        observation,

      to:
        moveTicks(
          observation,
          CONFIG.entryWatchTicks
        )
    };

  }

  return {
    from:
      moveTicks(
        observation,
        -CONFIG.entryWatchTicks
      ),

    to:
      observation
  };

}


function eligibilityLabel(
  stock
) {

  if (
    stock.DayTradeEligible !==
    true
  ) {
    return "不可當沖";
  }

  if (
    stock.SellFirstSuspended ===
    true
  ) {
    return "暫停先賣";
  }

  if (
    stock.SellFirstDayTradeAllowed ===
    true
  ) {
    return "可先賣";
  }

  return "僅先買";
}


async function fetchMarket(
  url
) {

  const response =
    await fetch(
      url
      +
      "?t="
      +
      Date.now(),
      {
        cache:
          "no-store"
      }
    );

  if (
    !response.ok
  ) {

    throw new Error(
      `HTTP ${response.status}`
    );

  }

  return response.json();

}


function setMarketStatus(
  market,
  payload,
  error
) {

  const prefix =
    market === "TWSE"
      ? "twse"
      : "tpex";

  const status =
    document.getElementById(
      prefix
      +
      "Status"
    );

  const meta =
    document.getElementById(
      prefix
      +
      "Meta"
    );

  if (
    error
  ) {

    status.textContent =
      "ERROR";

    status.className =
      "status-value status-error";

    meta.textContent =
      error.message;

    return;

  }

  status.textContent =
    "READY";

  status.className =
    "status-value status-ready";

  meta.textContent =
    `${payload.tradeDateISO || "-"} · `
    +
    `${payload.count || 0} 檔`;

}


function renderSummary() {

  const root =
    document.getElementById(
      "summary"
    );

  const twseCount =
    state.twse?.count
    ??
    0;

  const tpexCount =
    state.tpex?.count
    ??
    0;

  root.innerHTML =
    `

      <div class="summary-item">
        <span>
          TWSE
        </span>

        <strong>
          ${twseCount.toLocaleString("zh-TW")}
        </strong>
      </div>


      <div class="summary-item">
        <span>
          TPEx
        </span>

        <strong>
          ${tpexCount.toLocaleString("zh-TW")}
        </strong>
      </div>


      <div class="summary-item">
        <span>
          LONG
        </span>

        <strong class="long-text">
          ${state.long.length}
        </strong>
      </div>


      <div class="summary-item">
        <span>
          SHORT
        </span>

        <strong class="short-text">
          ${state.short.length}
        </strong>
      </div>

    `;

}


function candidateCardHtml(
  stock,
  side,
  index
) {

  const observation =
    observationPrice(
      stock,
      side
    );

  const change =
    changePercent(
      stock
    );

  return `

    <button
      class="candidate-card"
      type="button"
      data-code="${escapeHtml(stock.Code)}"
      data-side="${side}"
    >

      <div class="rank">
        ${String(index + 1).padStart(2, "0")}
      </div>


      <div>

        <div class="stock-name-line">

          <span class="stock-name">
            ${escapeHtml(stock.Name)}
          </span>

          <span class="stock-code">
            ${escapeHtml(stock.Code)}
          </span>

          <span class="market-badge">
            ${escapeHtml(stock.MarketName)}
          </span>

        </div>


        <div class="stock-meta">

          ${escapeHtml(stock.Industry || "未分類")}

          ·

          ${formatPercent(change)}

          ·

          ${formatLots(getTradeVolume(stock))}
          張

          ·

          流動性 #${stock.__liquidityRank}

        </div>

      </div>


      <div class="candidate-price">

        <div
          class="
            observation
            ${side === "long"
              ? "long-text"
              : "short-text"
            }
          "
        >
          ${formatPrice(observation)}
        </div>

        <div class="score">
          ${stock.__score} 分
        </div>

      </div>

    </button>

  `;

}


function renderPanel(
  side,
  data
) {

  const isLong =
    side === "long";

  const label =
    isLong
      ? "LONG"
      : "SHORT";

  return `

    <section class="candidate-panel">

      <header class="panel-header">

        <div class="panel-title">

          <span
            class="
              side-dot
              ${side}
            "
          ></span>

          ${label}

        </div>

        <div class="panel-count">
          ${data.length} 檔
        </div>

      </header>


      <div class="candidate-list">

        ${
          data.length

            ? data
                .map(
                  (
                    stock,
                    index
                  ) =>
                    candidateCardHtml(
                      stock,
                      side,
                      index
                    )
                )
                .join("")

            : `
                <div class="empty">
                  沒有符合條件的候選
                </div>
              `
        }

      </div>

    </section>

  `;

}


function renderCandidates() {

  const root =
    document.getElementById(
      "candidateRoot"
    );

  if (
    !state.synchronized
  ) {

    root.innerHTML =
      `

        <div class="candidate-panel">
          <div class="empty">
            TWSE / TPEx 尚未同步，
            暫停建立跨市場候選池。
          </div>
        </div>

      `;

    return;

  }

  root.innerHTML =
    renderPanel(
      "long",
      state.long
    )
    +
    renderPanel(
      "short",
      state.short
    );

}


function findCandidate(
  code,
  side
) {

  const source =
    side === "long"
      ? state.long
      : state.short;

  return source.find(
    stock =>
      String(
        stock.Code
      )
      ===
      String(
        code
      )
  );

}


function openTradePlan(
  stock,
  side
) {

  const dialog =
    document.getElementById(
      "tradeDialog"
    );

  const observation =
    observationPrice(
      stock,
      side
    );

  const zone =
    entryWatchZone(
      stock,
      side
    );

  const sideLabel =
    side === "long"
      ? "LONG"
      : "SHORT";

  const sideTextClass =
    side === "long"
      ? "long-text"
      : "short-text";

  const sideChinese =
    side === "long"
      ? "做多"
      : "做空";

  dialog.innerHTML =
    `

      <header class="modal-header">

        <div>

          <h2 class="modal-title">

            ${escapeHtml(stock.Name)}

            <span class="modal-code">
              ${escapeHtml(stock.Code)}
            </span>

          </h2>


          <div class="modal-sub">

            ${escapeHtml(stock.MarketName)}

            ·

            ${escapeHtml(stock.Industry || "未分類")}

            ·

            ${escapeHtml(eligibilityLabel(stock))}

            ·

            資料 ${escapeHtml(
              state.twse.tradeDateISO
            )}

          </div>

        </div>


        <button
          id="closeDialog"
          class="close-btn"
          type="button"
        >
          ×
        </button>

      </header>


      <div class="trade-summary">

        <div>

          <span>
            方向
          </span>

          <strong class="${sideTextClass}">
            ${sideChinese}
          </strong>

        </div>


        <div>

          <span>
            Candidate Score
          </span>

          <strong>
            ${stock.__score}
          </strong>

        </div>


        <div>

          <span>
            Liquidity
          </span>

          <strong>
            #${stock.__liquidityRank}
          </strong>

        </div>


        <div>

          <span>
            Status
          </span>

          <strong>
            WAITING
          </strong>

        </div>

      </div>


      <section class="trade-section">

        <div class="section-label">
          PRE-MARKET STRUCTURE
        </div>


        <div class="price-grid">

          <div class="price-box">

            <span>
              昨收
            </span>

            <strong>
              ${formatPrice(
                previousClose(
                  stock
                )
              )}
            </strong>

          </div>


          <div class="price-box">

            <span>
              昨日高
            </span>

            <strong>
              ${formatPrice(
                stock.HighestPrice
              )}
            </strong>

          </div>


          <div class="price-box">

            <span>
              昨日低
            </span>

            <strong>
              ${formatPrice(
                stock.LowestPrice
              )}
            </strong>

          </div>


          <div class="price-box">

            <span>
              Observation
            </span>

            <strong class="${sideTextClass}">
              ${formatPrice(
                observation
              )}
            </strong>

          </div>

        </div>

      </section>


      <section class="trade-section">

        <div class="section-label">
          ENTRY WATCH ZONE
        </div>


        <div class="watch-zone">

          <div class="watch-label">
            參考進場區
          </div>


          <div
            class="
              watch-price
              ${sideTextClass}
            "
          >

            ${formatPrice(
              zone?.from
            )}

            <small>
              ～
            </small>

            ${formatPrice(
              zone?.to
            )}

          </div>

        </div>


        <div class="notice">

          此價格區間是盤前觀察區，
          不是直接進場訊號。

          ${
            side === "long"
              ? "價格需先有效突破 Observation，再觀察回踩與方向確認。"
              : "價格需先有效跌破 Observation，再觀察回踩與方向確認。"
          }

        </div>

      </section>


      <section class="trade-section">

        <div class="section-label">
          CONFIRMATION FLOW
        </div>


        <div class="flow">

          <span>
            Observation
          </span>

          <i>→</i>

          <span>
            Breakout
          </span>

          <i>→</i>

          <span>
            Pullback
          </span>

          <i>→</i>

          <span>
            Swing
          </span>

          <i>→</i>

          <span>
            Confirm
          </span>

          <i>→</i>

          <span>
            Entry
          </span>

        </div>

      </section>

    `;

  dialog.showModal();

  document
  .getElementById(
    "closeDialog"
  )
  .addEventListener(
    "click",
    () =>
      dialog.close()
  );

}


function updateSyncState() {

  const status =
    document.getElementById(
      "syncStatus"
    );

  const meta =
    document.getElementById(
      "syncMeta"
    );

  const warning =
    document.getElementById(
      "syncWarning"
    );

  if (
    !state.twse
    ||
    !state.tpex
  ) {

    state.synchronized =
      false;

    status.textContent =
      "NOT READY";

    status.className =
      "status-value status-error";

    return;

  }

  const sameDate =
    state.twse.tradeDateISO
    &&
    state.twse.tradeDateISO
    ===
    state.tpex.tradeDateISO;

  const sameVolumeMode =
    state.twse.volumeMode
    &&
    state.twse.volumeMode
    ===
    state.tpex.volumeMode;

  state.synchronized =
    Boolean(
      sameDate
      &&
      sameVolumeMode
    );

  if (
    state.synchronized
  ) {

    status.textContent =
      "SYNCED";

    status.className =
      "status-value status-ready";

    meta.textContent =
      `${state.twse.tradeDateISO} · ${state.twse.volumeMode}`;

    warning.classList.remove(
      "visible"
    );

    warning.textContent =
      "";

  }

  else {

    status.textContent =
      "MISMATCH";

    status.className =
      "status-value status-error";

    meta.textContent =
      "候選池已暫停";

    warning.textContent =
      (
        "TWSE / TPEx 資料日期或 Volume Mode 不一致。"
        +
        "為避免跨市場流動性排名使用不同交易日資料，"
        +
        "DS 不會建立候選池。"
      );

    warning.classList.add(
      "visible"
    );

  }

}


function buildCandidates() {

  if (
    !state.synchronized
  ) {

    state.stocks =
      [];

    state.long =
      [];

    state.short =
      [];

    return;

  }

  state.stocks = [

    ...state.twse.data,

    ...state.tpex.data

  ]
  .filter(
    validStock
  );

  assignLiquidityRanks(
    state.stocks
  );

  state.long =
    selectCandidates(
      state.stocks,
      "long"
    );

  state.short =
    selectCandidates(
      state.stocks,
      "short"
    );

}


async function load() {

  const root =
    document.getElementById(
      "candidateRoot"
    );

  root.innerHTML =
    `
      <div class="loading">
        載入 TWSE / TPEx...
      </div>
    `;

  state.twse =
    null;

  state.tpex =
    null;

  state.long =
    [];

  state.short =
    [];

  let twseError =
    null;

  let tpexError =
    null;


  const [
    twseResult,
    tpexResult
  ] =
    await Promise.allSettled([

      fetchMarket(
        "./TWSE/stocks.json"
      ),

      fetchMarket(
        "./TPEx/stocks.json"
      )

    ]);


  if (
    twseResult.status ===
    "fulfilled"
  ) {

    state.twse =
      twseResult.value;

  }
  else {

    twseError =
      twseResult.reason;

  }


  if (
    tpexResult.status ===
    "fulfilled"
  ) {

    state.tpex =
      tpexResult.value;

  }
  else {

    tpexError =
      tpexResult.reason;

  }


  setMarketStatus(
    "TWSE",
    state.twse,
    twseError
  );

  setMarketStatus(
    "TPEX",
    state.tpex,
    tpexError
  );


  updateSyncState();

  buildCandidates();

  renderSummary();

  renderCandidates();

}


document
.getElementById(
  "reloadBtn"
)
.addEventListener(
  "click",
  load
);


document
.getElementById(
  "candidateRoot"
)
.addEventListener(
  "click",
  event => {

    const card =
      event.target.closest(
        ".candidate-card"
      );

    if (
      !card
    ) {
      return;
    }

    const stock =
      findCandidate(
        card.dataset.code,
        card.dataset.side
      );

    if (
      stock
    ) {

      openTradePlan(
        stock,
        card.dataset.side
      );

    }

  }
);


document
.getElementById(
  "tradeDialog"
)
.addEventListener(
  "click",
  event => {

    const dialog =
      event.currentTarget;

    const rect =
      dialog
      .getBoundingClientRect();

    const inside =
      (
        event.clientX
        >=
        rect.left

        &&

        event.clientX
        <=
        rect.right

        &&

        event.clientY
        >=
        rect.top

        &&

        event.clientY
        <=
        rect.bottom
      );

    if (
      !inside
    ) {
      dialog.close();
    }

  }
);


load();

</script>
