<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>台股隔日當沖候選系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      width: min(1400px, 94%);
      margin: 0 auto;
      padding: 30px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      margin-bottom: 24px;
      color: #666;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      background: #222;
      color: #fff;
    }

    button:hover {
      opacity: 0.85;
    }

    .status {
      padding: 12px 16px;
      background: #fff;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
    }

    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    th,
    td {
      padding: 12px 10px;
      text-align: right;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }

    th {
      background: #fafafa;
      font-weight: 600;
      position: sticky;
      top: 0;
    }

    th:first-child,
    th:nth-child(2),
    td:first-child,
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr:hover {
      background: #fafafa;
    }

    .up {
      color: #d32f2f;
    }

    .down {
      color: #188038;
    }

    .neutral {
      color: #666;
    }

    .error {
      color: #d32f2f;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>台股隔日當沖候選系統</h1>

    <div class="subtitle">
      使用前一交易日資料建立隔日觀察清單
    </div>


    <div class="toolbar">

      <button id="loadBtn">
        讀取證交所資料
      </button>

      <button id="sortVolumeBtn">
        成交量排序
      </button>

    </div>


    <div
      id="status"
      class="status"
    >
      尚未載入資料
    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>代號</th>

            <th>名稱</th>

            <th>成交量</th>

            <th>成交筆數</th>

            <th>成交金額</th>

            <th>開盤</th>

            <th>最高</th>

            <th>最低</th>

            <th>收盤</th>

            <th>漲跌</th>

            <th>振幅</th>

          </tr>

        </thead>


        <tbody id="stockTableBody">

        </tbody>

      </table>

    </div>

  </div>


  <script>

    /*
      證交所 OpenAPI

      上市股票每日成交資訊
    */

    const API_URL =
      "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL";


    let stockData = [];


    const statusElement =
      document.getElementById("status");


    const tableBody =
      document.getElementById("stockTableBody");


    const loadBtn =
      document.getElementById("loadBtn");


    const sortVolumeBtn =
      document.getElementById("sortVolumeBtn");



    /*
      字串數字轉換

      例如：

      "12,345"

      →

      12345
    */

    function toNumber(value) {

      if (
        value === undefined ||
        value === null ||
        value === ""
      ) {
        return 0;
      }

      const cleaned =
        String(value)
          .replace(/,/g, "")
          .replace(/[+]/g, "")
          .trim();

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : 0;

    }



    /*
      格式化整數
    */

    function formatNumber(value) {

      return Number(value || 0)
        .toLocaleString("zh-TW");

    }



    /*
      計算振幅

      (最高 - 最低)
      ÷
      開盤價
      × 100

      第一版暫時使用開盤價。

      之後如果加入「昨日收盤價」，
      可以再改成正式策略公式。
    */

    function calculateAmplitude(stock) {

      const high =
        toNumber(stock.HighestPrice);

      const low =
        toNumber(stock.LowestPrice);

      const open =
        toNumber(stock.OpeningPrice);


      if (
        high <= 0 ||
        low <= 0 ||
        open <= 0
      ) {
        return 0;
      }


      return (
        (high - low)
        /
        open
        *
        100
      );

    }



    /*
      判斷漲跌顏色
    */

    function getChangeClass(value) {

      const change =
        toNumber(value);


      if (change > 0) {
        return "up";
      }


      if (change < 0) {
        return "down";
      }


      return "neutral";

    }



    /*
      繪製表格
    */

    function renderTable(data) {

      tableBody.innerHTML = "";


      data.forEach(stock => {

        const row =
          document.createElement("tr");


        const amplitude =
          calculateAmplitude(stock);


        row.innerHTML = `

          <td>
            ${stock.Code || ""}
          </td>

          <td>
            ${stock.Name || ""}
          </td>

          <td>
            ${formatNumber(
              toNumber(stock.TradeVolume)
            )}
          </td>

          <td>
            ${formatNumber(
              toNumber(stock.Transaction)
            )}
          </td>

          <td>
            ${formatNumber(
              toNumber(stock.TradeValue)
            )}
          </td>

          <td>
            ${stock.OpeningPrice || "-"}
          </td>

          <td>
            ${stock.HighestPrice || "-"}
          </td>

          <td>
            ${stock.LowestPrice || "-"}
          </td>

          <td>
            ${stock.ClosingPrice || "-"}
          </td>

          <td
            class="
              ${getChangeClass(
                stock.Change
              )}
            "
          >
            ${stock.Change || "0"}
          </td>

          <td>
            ${amplitude.toFixed(2)}%
          </td>

        `;


        tableBody.appendChild(row);

      });


      statusElement.textContent =
        `共載入 ${data.length} 檔上市股票`;

    }



    /*
      讀取證交所 API
    */

    async function loadStocks() {

      statusElement.textContent =
        "讀取證交所資料中...";


      statusElement.classList.remove(
        "error"
      );


      try {

        const response =
          await fetch(API_URL);


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        /*
          基本清理

          排除：

          沒有代號
          沒有價格
          ETF / 特殊商品後續再處理
        */

        stockData =
          data.filter(stock => {

            const code =
              stock.Code || "";


            const close =
              toNumber(
                stock.ClosingPrice
              );


            return (
              code &&
              close > 0
            );

          });


        renderTable(
          stockData
        );


      } catch (error) {

        console.error(error);


        statusElement.textContent =
          "API 讀取失敗：" +
          error.message;


        statusElement.classList.add(
          "error"
        );

      }

    }



    /*
      成交量排序
    */

    function sortByVolume() {

      const sorted =
        [...stockData]
          .sort(
            (a, b) =>
              toNumber(
                b.TradeVolume
              )
              -
              toNumber(
                a.TradeVolume
              )
          );


      renderTable(
        sorted
      );

    }



    /*
      Events
    */

    loadBtn.addEventListener(
      "click",
      loadStocks
    );


    sortVolumeBtn.addEventListener(
      "click",
      sortByVolume
    );


    /*
      網頁開啟後
      自動讀取
    */

    loadStocks();

  </script>

</body>
</html>
