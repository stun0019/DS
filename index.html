<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f1115"
  >

  <title>台股隔日當沖候選系統</title>

  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/mobile.css">

  <link rel="stylesheet" href="./assets/css/panels/candidate.css">
  <link rel="stylesheet" href="./assets/css/panels/volume.css">
  <link rel="stylesheet" href="./assets/css/panels/rules.css">
  <link rel="stylesheet" href="./assets/css/panels/market.css">
</head>

<body>

  <div id="drawer-root"></div>

  <main class="app">

    <header class="header">

      <div class="header-left">

        <button
          id="menuBtn"
          class="menu-btn"
          type="button"
          aria-label="開啟選單"
        >
          <span class="hamburger">
            <span></span>
          </span>
        </button>

        <div class="title-area">

          <div class="eyebrow">
            TWSE / TPEX MARKET WATCH
          </div>

          <h1>
            台股隔日當沖候選
          </h1>

          <div class="subtitle">
            前一交易日官方行情＋隔日多空候選分析
          </div>

        </div>

      </div>

      <button
        id="reloadBtn"
        class="reload-btn"
        type="button"
      >
        重新讀取
      </button>

    </header>


    <section class="view-heading">

      <div>

        <div
          id="viewName"
          class="view-name"
        >
          -
        </div>

        <div
          id="viewDescription"
          class="view-description"
        >
          -
        </div>

      </div>

      <div
        id="viewChip"
        class="view-chip"
      ></div>

    </section>


    <section
      id="executionRoot"
      class="execution-root"
      aria-label="執行狀態與風險設定"
    ></section>


    <section
      id="summaryRoot"
      class="summary"
    ></section>


    <section
      id="panelRoot"
      class="panel-root"
    >

      <div class="loading">
        載入資料中...
      </div>

    </section>

  </main>


  <script
    type="module"
    src="./assets/js/app.js"
  ></script>

</body>

</html>
