<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#0b0e13"
>

<title>DS</title>


<style>

:root {

  --bg: #0b0e13;
  --surface: #12161d;
  --surface-2: #181d26;
  --surface-3: #202632;
  --border: #29313d;

  --text: #eef1f5;
  --secondary: #9ba5b4;
  --muted: #667180;

  --long: #ff6575;
  --short: #38d39f;

  --accent: #7287ff;
  --warning: #e6b85c;

  --radius: 14px;

}


* {
  box-sizing: border-box;
}


html {
  background: var(--bg);
}


body {

  margin: 0;

  min-height: 100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft JhengHei",
    sans-serif;

  background: var(--bg);
  color: var(--text);

}


button {
  font: inherit;
}


.app {

  width:
    min(
      1440px,
      calc(100% - 32px)
    );

  margin: 0 auto;

  padding:
    28px 0 60px;

}


/* ==================================================
   HEADER
   ================================================== */

.header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 20px;

  margin-bottom: 20px;

}


.brand-label {

  color: var(--accent);

  font-size: 11px;

  font-weight: 800;

  letter-spacing: .16em;

}


h1 {

  margin:
    5px 0 4px;

  font-size: 30px;

  line-height: 1;

}


.subtitle {

  color: var(--secondary);

  font-size: 13px;

}


.reload-btn {

  padding:
    9px 14px;

  border:
    1px solid
    var(--border);

  border-radius: 9px;

  background: var(--surface-2);

  color: var(--text);

  cursor: pointer;

}


.reload-btn:hover {

  border-color: var(--accent);

}


.reload-btn:disabled {

  opacity: .55;

  cursor: default;

}


/* ==================================================
   COMPACT SYSTEM LOG
   ================================================== */

.logbox {

  margin-bottom: 16px;

  border:
    1px solid
    var(--border);

  border-radius: 12px;

  overflow: hidden;

  background: var(--surface);

}


.logbox-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  padding:
    9px 14px;

  border-bottom:
    1px solid
    var(--border);

  background: var(--surface-2);

}


.logbox-title {

  color: var(--accent);

  font-size: 10px;

  font-weight: 800;

  letter-spacing: .15em;

}


.logbox-hint {

  color: var(--muted);

  font-size: 9px;

  letter-spacing: .08em;

}


.logbox-body {

  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

}


.log-row {

  min-width: 0;

  padding:
    11px 14px;

  border-right:
    1px solid
    var(--border);

}


.log-row:last-child {

  border-right: 0;

}


.log-row-top {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 8px;

  margin-bottom: 5px;

}


.log-tag {

  color: var(--muted);

  font-size: 9px;

  font-weight: 800;

  letter-spacing: .1em;

}


.log-status {

  font-size: 11px;

  font-weight: 800;

  white-space: nowrap;

}


.log-meta {

  min-width: 0;

  overflow: hidden;

  color: var(--secondary);

  font-size: 11px;

  text-overflow: ellipsis;

  white-space: nowrap;

}


.status-ready {
  color: var(--short);
}


.status-error {
  color: var(--long);
}


.status-waiting {
  color: var(--warning);
}


.status-checking {
  color: var(--secondary);
}


.status-stale {
  color: var(--warning);
}


/* ==================================================
   SYNC INFO
   ================================================== */

.sync-info {

  display: none;

  margin-bottom: 16px;

  padding:
    10px 13px;

  border:
    1px solid
    rgba(
      230,
      184,
      92,
      .28
    );

  border-radius: 9px;

  background:
    rgba(
      230,
      184,
      92,
      .05
    );

  color: var(--warning);

  font-size: 11px;

  line-height: 1.55;

}


.sync-info.visible {
  display: block;
}


/* ==================================================
   SUMMARY
   ================================================== */

.summary {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

  margin-bottom: 18px;

}


.summary-item {

  padding:
    14px 15px;

  border:
    1px solid
    var(--border);

  border-radius: 11px;

  background: var(--surface);

}


.summary-item span {

  display: block;

  margin-bottom: 6px;

  color: var(--muted);

  font-size: 10px;

}


.summary-item strong {

  font-size: 20px;

}


/* ==================================================
   CANDIDATES
   ================================================== */

.candidate-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 16px;

}


.candidate-panel {

  min-width: 0;

  border:
    1px solid
    var(--border);

  border-radius: 14px;

  overflow: hidden;

  background: var(--surface);

}


.panel-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    14px 16px;

  border-bottom:
    1px solid
    var(--border);

}


.panel-title {

  display: flex;

  align-items: center;

  gap: 8px;

  font-size: 13px;

  font-weight: 800;

}


.panel-count {

  color: var(--muted);

  font-size: 11px;

}


.side-dot {

  width: 7px;

  height: 7px;

  border-radius: 50%;

}


.side-dot.long {
  background: var(--long);
}


.side-dot.short {
  background: var(--short);
}


.candidate-list {
  padding: 7px;
}


.candidate-card {

  display: grid;

  grid-template-columns:
    32px minmax(0, 1fr) auto;

  align-items: center;

  gap: 10px;

  width: 100%;

  padding:
    12px 10px;

  border: 0;

  border-bottom:
    1px solid
    rgba(
      41,
      49,
      61,
      .72
    );

  background: transparent;

  color: var(--text);

  text-align: left;

  cursor: pointer;

}


.candidate-card:last-child {
  border-bottom: 0;
}


.candidate-card:hover {

  border-radius: 8px;

  background: var(--surface-2);

}


.rank {

  color: var(--muted);

  font-size: 11px;

  font-weight: 700;

}


.stock-name-line {

  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 6px;

}


.stock-name {

  font-size: 14px;

  font-weight: 700;

}


.stock-code {

  color: var(--secondary);

  font-size: 11px;

}


.market-badge {

  padding:
    2px 5px;

  border:
    1px solid
    var(--border);

  border-radius: 5px;

  color: var(--muted);

  font-size: 8px;

}


.stock-meta {

  margin-top: 4px;

  color: var(--muted);

  font-size: 10px;

}


.candidate-price {
  text-align: right;
}


.observation {

  font-size: 16px;

  font-weight: 800;

}


.long-text {
  color: var(--long);
}


.short-text {
  color: var(--short);
}


.score {

  margin-top: 3px;

  color: var(--secondary);

  font-size: 10px;

}


.empty {

  padding:
    34px 18px;

  color: var(--muted);

  text-align: center;

  font-size: 12px;

  line-height: 1.7;

}


.loading {

  padding:
    50px 20px;

  color: var(--secondary);

  text-align: center;

}


/* ==================================================
   TRADE PLAN
   ================================================== */

dialog {

  width:
    min(
      700px,
      calc(100vw - 24px)
    );

  max-height:
    calc(100vh - 24px);

  padding: 0;

  overflow: auto;

  border:
    1px solid
    var(--border);

  border-radius: 16px;

  background: var(--surface);

  color: var(--text);

  box-shadow:
    0 30px 100px
    rgba(
      0,
      0,
      0,
      .6
    );

}


dialog::backdrop {

  background:
    rgba(
      3,
      5,
      8,
      .78
    );

  backdrop-filter: blur(4px);

}


.modal-header {

  display: flex;

  align-items: flex-start;

  justify-content: space-between;

  gap: 20px;

  padding:
    22px 24px;

  border-bottom:
    1px solid
    var(--border);

}


.modal-title {

  margin: 0;

  font-size: 23px;

}


.modal-code {

  margin-left: 7px;

  color: var(--secondary);

  font-size: 14px;

}


.modal-sub {

  margin-top: 7px;

  color: var(--secondary);

  font-size: 12px;

}


.close-btn {

  width: 34px;

  height: 34px;

  padding: 0;

  border:
    1px solid
    var(--border);

  border-radius: 8px;

  background: var(--surface-2);

  color: var(--secondary);

  cursor: pointer;

  font-size: 22px;

}


.trade-summary {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 1px;

  background: var(--border);

}


.trade-summary > div {

  padding: 14px;

  background: var(--surface);

}


.trade-summary span {

  display: block;

  margin-bottom: 5px;

  color: var(--muted);

  font-size: 10px;

}


.trade-summary strong {
  font-size: 14px;
}


.trade-section {

  padding:
    21px 24px;

  border-top:
    1px solid
    var(--border);

}


.section-label {

  margin-bottom: 13px;

  color: var(--muted);

  font-size: 10px;

  font-weight: 800;

  letter-spacing: .12em;

}


.price-grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 9px;

}


.price-box {

  padding: 13px;

  border:
    1px solid
    var(--border);

  border-radius: 9px;

  background: var(--surface-2);

}


.price-box span {

  display: block;

  margin-bottom: 6px;

  color: var(--muted);

  font-size: 10px;

}


.price-box strong {
  font-size: 16px;
}


.watch-zone {

  padding: 19px;

  border:
    1px solid
    var(--border);

  border-radius: 11px;

  background: var(--surface-2);

}


.watch-label {

  margin-bottom: 7px;

  color: var(--secondary);

  font-size: 11px;

}


.watch-price {

  font-size: 29px;

  font-weight: 800;

}


.watch-price small {

  padding: 0 7px;

  color: var(--muted);

  font-size: 14px;

}


.notice {

  margin-top: 11px;

  padding:
    11px 13px;

  border-left:
    3px solid
    var(--warning);

  background:
    rgba(
      230,
      184,
      92,
      .06
    );

  color: var(--secondary);

  font-size: 12px;

  line-height: 1.65;

}


.flow {

  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 7px;

}


.flow span {

  padding:
    6px 8px;

  border:
    1px solid
    var(--border);

  border-radius: 6px;

  background: var(--surface-2);

  color: var(--secondary);

  font-size: 10px;

}


.flow i {

  color: var(--muted);

  font-style: normal;

}


/* ==================================================
   RESPONSIVE
   ================================================== */

@media (
  max-width: 850px
) {

  .summary {

    grid-template-columns:
      1fr 1fr;

  }


  .candidate-grid {

    grid-template-columns:
      1fr;

  }

}


@media (
  max-width: 620px
) {

  .logbox-body {

    display: block;

  }


  .log-row {

    display: grid;

    grid-template-columns:
      78px 100px minmax(0, 1fr);

    align-items: center;

    gap: 8px;

    padding:
      9px 12px;

    border-right: 0;

    border-bottom:
      1px solid
      var(--border);

  }


  .log-row:last-child {
    border-bottom: 0;
  }


  .log-row-top {
    display: contents;
  }


  .log-meta {

    font-size: 10px;

  }

}


@media (
  max-width: 520px
) {

  .app {

    width:
      calc(100% - 16px);

    padding-top: 16px;

  }


  .header {

    align-items: flex-start;

    margin-bottom: 16px;

  }


  h1 {
    font-size: 26px;
  }


  .reload-btn {

    padding:
      8px 10px;

    font-size: 12px;

  }


  .logbox {
    margin-bottom: 12px;
  }


  .logbox-header {

    padding:
      8px 11px;

  }


  .logbox-hint {
    display: none;
  }


  .log-row {

    grid-template-columns:
      66px 92px minmax(0, 1fr);

    gap: 6px;

    padding:
      8px 11px;

  }


  .log-tag {
    font-size: 9px;
  }


  .log-status {
    font-size: 10px;
  }


  .log-meta {

    font-size: 9px;

    white-space: normal;

  }


  .sync-info {

    margin-bottom: 12px;

    padding:
      9px 11px;

    font-size: 10px;

  }


  .summary {

    gap: 8px;

    margin-bottom: 14px;

  }


  .summary-item {

    padding:
      12px 13px;

  }


  .trade-summary,
  .price-grid {

    grid-template-columns:
      1fr 1fr;

  }


  .modal-header,
  .trade-section {

    padding-left: 17px;
    padding-right: 17px;

  }


  .watch-price {
    font-size: 24px;
  }

}

</style>

</head>


<body>

<main class="app">

<script>

const CONFIG = {

  candidateLimit: 10,

  liquidityPoolSize: 120,

  minimumAmplitude: 2,

  longClosePosition: 0.65,

  shortClosePosition: 0.35,

  entryWatchTicks: 2,

  weights: {

    liquidity: 25,

    change: 20,

    body: 15,

    closePosition: 25,

    amplitude: 15

  }

};


const state = {

  twse: null,

  tpex: null,

  stocks: [],

  long: [],

  short: [],

  synchronized: false

};


/* ==================================================
   NUMBER
   ================================================== */

function num(
  value
) {

  if (
    value === null
    ||
    value === undefined
  ) {

    return 0;

  }


  let text =
    String(
      value
    )
    .replace(
      /,/g,
      ""
    )
    .replace(
      /\+/g,
      ""
    )
    .trim();


  if (
    !text
    ||
    text === "-"
    ||
    text === "--"
  ) {

    return 0;

  }


  const direct =
    Number(
      text
    );


  if (
    Number.isFinite(
      direct
    )
  ) {

    return direct;

  }


  text =
    text.replace(
      /[^0-9.\-]/g,
      ""
    );


  const parsed =
    Number(
      text
    );


  return Number.isFinite(
    parsed
  )
    ? parsed
    : 0;

}


function clamp(
  value,
  min,
  max
) {

  return Math.min(
    max,
    Math.max(
      min,
      value
    )
  );

}


function escapeHtml(
  value
) {

  return String(
    value
    ??
    ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* ==================================================
   DATE
   ================================================== */

function dateValue(
  iso
) {

  if (
    !iso
  ) {

    return 0;

  }


  const value =
    Date.parse(
      `${iso}T00:00:00+08:00`
    );


  return Number.isFinite(
    value
  )
    ? value
    : 0;

}


/* ==================================================
   PRICE TICK
   ================================================== */

function getTickSize(
  price
) {

  const value =
    num(
      price
    );


  if (
    value < 10
  ) {

    return 0.01;

  }


  if (
    value < 50
  ) {

    return 0.05;

  }


  if (
    value < 100
  ) {

    return 0.1;

  }


  if (
    value < 500
  ) {

    return 0.5;

  }


  if (
    value < 1000
  ) {

    return 1;

  }


  return 5;

}


function roundPrice(
  value
) {

  return Number(
    Number(
      value
    )
    .toFixed(
      2
    )
  );

}


function nextTick(
  price
) {

  const value =
    num(
      price
    );


  if (
    value <= 0
  ) {

    return 0;

  }


  return roundPrice(
    value
    +
    getTickSize(
      value
    )
  );

}


function previousTick(
  price
) {

  const value =
    num(
      price
    );


  if (
    value <= 0
  ) {

    return 0;

  }


  const lookupPrice =
    Math.max(
      0,
      value
      -
      0.0000001
    );


  return roundPrice(
    value
    -
    getTickSize(
      lookupPrice
    )
  );

}


function moveTicks(
  price,
  ticks
) {

  let current =
    num(
      price
    );


  const amount =
    Math.abs(
      Math.trunc(
        ticks
      )
    );


  for (
    let index = 0;
    index < amount;
    index += 1
  ) {

    current =
      ticks > 0
        ? nextTick(
            current
          )
        : previousTick(
            current
          );

  }


  return current;

}


/* ==================================================
   FORMAT
   ================================================== */

function formatPrice(
  value
) {

  const price =
    num(
      value
    );


  if (
    price <= 0
  ) {

    return "-";

  }


  const tick =
    getTickSize(
      price
    );


  const decimals =
    tick < 0.1
      ? 2
      : tick < 1
        ? 1
        : 0;


  return price.toFixed(
    decimals
  );

}


function formatPercent(
  value
) {

  const number =
    num(
      value
    );


  return (
    (
      number > 0
        ? "+"
        : ""
    )
    +
    number.toFixed(
      2
    )
    +
    "%"
  );

}


function formatLots(
  shares
) {

  return Math.round(
    num(
      shares
    )
    /
    1000
  )
  .toLocaleString(
    "zh-TW"
  );

}


/* ==================================================
   STOCK DATA
   ================================================== */

function getTradeVolume(
  stock
) {

  const fields = [

    "BrokerComparableVolume",

    "AdjustedTradeVolume",

    "RegularTradeVolume",

    "TradeVolume"

  ];


  for (
    const field
    of fields
  ) {

    if (
      stock[
        field
      ] !== undefined
      &&
      stock[
        field
      ] !== null
      &&
      stock[
        field
      ] !== ""
    ) {

      return Math.max(
        0,
        num(
          stock[
            field
          ]
        )
      );

    }

  }


  return 0;

}


function previousClose(
  stock
) {

  return (
    num(
      stock.ClosingPrice
    )
    -
    num(
      stock.Change
    )
  );

}


function changePercent(
  stock
) {

  const previous =
    previousClose(
      stock
    );


  if (
    previous <= 0
  ) {

    return 0;

  }


  return (
    num(
      stock.Change
    )
    /
    previous
    *
    100
  );

}


function amplitude(
  stock
) {

  const high =
    num(
      stock.HighestPrice
    );

  const low =
    num(
      stock.LowestPrice
    );

  const open =
    num(
      stock.OpeningPrice
    );


  if (
    high <= 0
    ||
    low <= 0
    ||
    open <= 0
  ) {

    return 0;

  }


  return (
    (
      high
      -
      low
    )
    /
    open
    *
    100
  );

}


function closePosition(
  stock
) {

  const high =
    num(
      stock.HighestPrice
    );

  const low =
    num(
      stock.LowestPrice
    );

  const close =
    num(
      stock.ClosingPrice
    );


  const range =
    high
    -
    low;


  if (
    range <= 0
  ) {

    return 0.5;

  }


  return clamp(
    (
      close
      -
      low
    )
    /
    range,
    0,
    1
  );

}


function bodyRatio(
  stock
) {

  const open =
    num(
      stock.OpeningPrice
    );

  const close =
    num(
      stock.ClosingPrice
    );

  const high =
    num(
      stock.HighestPrice
    );

  const low =
    num(
      stock.LowestPrice
    );


  const range =
    high
    -
    low;


  if (
    range <= 0
  ) {

    return 0;

  }


  return (
    close
    -
    open
  )
  /
  range;

}


function validStock(
  stock
) {

  return Boolean(

    stock

    &&

    stock.Code

    &&

    num(
      stock.OpeningPrice
    ) > 0

    &&

    num(
      stock.HighestPrice
    ) > 0

    &&

    num(
      stock.LowestPrice
    ) > 0

    &&

    num(
      stock.ClosingPrice
    ) > 0

  );

}


/* ==================================================
   LIQUIDITY
   ================================================== */

function assignLiquidityRanks(
  stocks
) {

  const ranked =
    [
      ...stocks
    ]
    .sort(
      (
        a,
        b
      ) => {

        const volumeDiff =
          getTradeVolume(
            b
          )
          -
          getTradeVolume(
            a
          );


        if (
          volumeDiff !== 0
        ) {

          return volumeDiff;

        }


        return String(
          a.Code
          ??
          ""
        )
        .localeCompare(
          String(
            b.Code
            ??
            ""
          )
        );

      }
    );


  ranked.forEach(
    (
      stock,
      index
    ) => {

      stock.__liquidityRank =
        index
        +
        1;

    }
  );

}


/* ==================================================
   SCORE
   ================================================== */

function liquidityScore(
  stock
) {

  const rank =
    stock.__liquidityRank
    ??
    999999;


  if (
    rank >
    CONFIG.liquidityPoolSize
  ) {

    return 0;

  }


  const maxIndex =
    Math.max(
      1,
      CONFIG.liquidityPoolSize
      -
      1
    );


  return (

    CONFIG.weights.liquidity

    *

    (
      1
      -
      (
        rank
        -
        1
      )
      /
      maxIndex
    )

  );

}


function scoreLong(
  stock
) {

  const change =
    changePercent(
      stock
    );

  const body =
    bodyRatio(
      stock
    );

  const close =
    closePosition(
      stock
    );

  const amp =
    amplitude(
      stock
    );


  const score =

    liquidityScore(
      stock
    )

    +

    clamp(
      change
      /
      5,
      0,
      1
    )
    *
    CONFIG.weights.change

    +

    clamp(
      body,
      0,
      1
    )
    *
    CONFIG.weights.body

    +

    close
    *
    CONFIG.weights.closePosition

    +

    clamp(
      amp
      /
      6,
      0,
      1
    )
    *
    CONFIG.weights.amplitude;


  return Math.round(
    clamp(
      score,
      0,
      100
    )
  );

}


function scoreShort(
  stock
) {

  const change =
    changePercent(
      stock
    );

  const body =
    bodyRatio(
      stock
    );

  const close =
    closePosition(
      stock
    );

  const amp =
    amplitude(
      stock
    );


  const score =

    liquidityScore(
      stock
    )

    +

    clamp(
      -change
      /
      5,
      0,
      1
    )
    *
    CONFIG.weights.change

    +

    clamp(
      -body,
      0,
      1
    )
    *
    CONFIG.weights.body

    +

    (
      1
      -
      close
    )
    *
    CONFIG.weights.closePosition

    +

    clamp(
      amp
      /
      6,
      0,
      1
    )
    *
    CONFIG.weights.amplitude;


  return Math.round(
    clamp(
      score,
      0,
      100
    )
  );

}


/* ==================================================
   CANDIDATE RULE
   ================================================== */

function isLongCandidate(
  stock
) {

  return Boolean(

    stock.DayTradeEligible ===
    true

    &&

    stock.__liquidityRank
    <=
    CONFIG.liquidityPoolSize

    &&

    changePercent(
      stock
    ) > 0

    &&

    num(
      stock.ClosingPrice
    )
    >
    num(
      stock.OpeningPrice
    )

    &&

    closePosition(
      stock
    )
    >=
    CONFIG.longClosePosition

    &&

    amplitude(
      stock
    )
    >=
    CONFIG.minimumAmplitude

  );

}


function isShortCandidate(
  stock
) {

  return Boolean(

    stock.DayTradeEligible ===
    true

    &&

    stock.SellFirstDayTradeAllowed ===
    true

    &&

    stock.SellFirstSuspended !==
    true

    &&

    stock.__liquidityRank
    <=
    CONFIG.liquidityPoolSize

    &&

    changePercent(
      stock
    ) < 0

    &&

    num(
      stock.ClosingPrice
    )
    <
    num(
      stock.OpeningPrice
    )

    &&

    closePosition(
      stock
    )
    <=
    CONFIG.shortClosePosition

    &&

    amplitude(
      stock
    )
    >=
    CONFIG.minimumAmplitude

  );

}


function selectCandidates(
  stocks,
  side
) {

  const isCandidate =
    side === "long"
      ? isLongCandidate
      : isShortCandidate;


  const scoreFn =
    side === "long"
      ? scoreLong
      : scoreShort;


  return stocks

    .filter(
      isCandidate
    )

    .map(
      stock => ({

        ...stock,

        __score:
          scoreFn(
            stock
          )

      })
    )

    .sort(
      (
        a,
        b
      ) => {

        return (

          b.__score
          -
          a.__score

          ||

          a.__liquidityRank
          -
          b.__liquidityRank

          ||

          String(
            a.Code
          )
          .localeCompare(
            String(
              b.Code
            )
          )

        );

      }
    )

    .slice(
      0,
      CONFIG.candidateLimit
    );

}


/* ==================================================
   TRADE PLAN
   ================================================== */

function observationPrice(
  stock,
  side
) {

  if (
    side === "long"
  ) {

    return nextTick(
      stock.HighestPrice
    );

  }


  return previousTick(
    stock.LowestPrice
  );

}


function entryWatchZone(
  stock,
  side
) {

  const observation =
    observationPrice(
      stock,
      side
    );


  if (
    observation <= 0
  ) {

    return null;

  }


  if (
    side === "long"
  ) {

    return {

      from:
        observation,

      to:
        moveTicks(
          observation,
          CONFIG.entryWatchTicks
        )

    };

  }


  return {

    from:
      moveTicks(
        observation,
        -CONFIG.entryWatchTicks
      ),

    to:
      observation

  };

}


function eligibilityLabel(
  stock
) {

  if (
    stock.DayTradeEligible !==
    true
  ) {

    return "不可當沖";

  }


  if (
    stock.SellFirstSuspended ===
    true
  ) {

    return "暫停先賣";

  }


  if (
    stock.SellFirstDayTradeAllowed ===
    true
  ) {

    return "可先賣";

  }


  return "僅先買";

}


/* ==================================================
   FETCH
   ================================================== */

async function fetchMarket(
  url
) {

  const response =
    await fetch(
      url
      +
      "?t="
      +
      Date.now(),
      {

        cache:
          "no-store"

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      `HTTP ${response.status}`
    );

  }


  return response.json();

}

   MARKET LOG
   ================================================== */

function setMarketStatus(
  market,
  payload,
  error
) {

  const prefix =
    market === "TWSE"
      ? "twse"
      : "tpex";


  const status =
    document.getElementById(
      prefix
      +
      "Status"
    );


  const meta =
    document.getElementById(
      prefix
      +
      "Meta"
    );


  if (
    error
  ) {

    status.textContent =
      "ERROR";

    status.className =
      "log-status status-error";

    meta.textContent =
      error.message
      ||
      "讀取失敗";

    return;

  }


  if (
    !payload
  ) {

    status.textContent =
      "NOT READY";

    status.className =
      "log-status status-error";

    meta.textContent =
      "無資料";

    return;

  }


  const count =
    Number(
      payload.count
      ||
      0
    );


  const tradeDate =
    String(
      payload.tradeDateISO
      ||
      ""
    );


  if (
    !tradeDate
    ||
    count <= 0
  ) {

    status.textContent =
      "WAITING";

    status.className =
      "log-status status-waiting";

    meta.textContent =
      "等待正式資料";

    return;

  }


  status.textContent =
    "READY";

  status.className =
    "log-status status-ready";

  meta.textContent =
    `${tradeDate} · `
    +
    `${count.toLocaleString("zh-TW")} 檔`;

}


/* ==================================================
   SYNC
   ================================================== */

function updateSyncState() {

  const syncStatus =
    document.getElementById(
      "syncStatus"
    );


  const syncMeta =
    document.getElementById(
      "syncMeta"
    );


  const syncInfo =
    document.getElementById(
      "syncInfo"
    );


  const twseStatus =
    document.getElementById(
      "twseStatus"
    );


  const tpexStatus =
    document.getElementById(
      "tpexStatus"
    );


  if (
    !state.twse
    ||
    !state.tpex
  ) {

    state.synchronized =
      false;


    syncStatus.textContent =
      "NOT READY";


    syncStatus.className =
      "log-status status-error";


    syncMeta.textContent =
      "等待市場";


    syncInfo.classList.remove(
      "visible"
    );


    syncInfo.textContent =
      "";


    return;

  }


  const twseReady =
    Boolean(

      state.twse.tradeDateISO

      &&

      Number(
        state.twse.count
        ||
        0
      ) > 0

      &&

      Array.isArray(
        state.twse.data
      )

      &&

      state.twse.data.length > 0

    );


  const tpexReady =
    Boolean(

      state.tpex.tradeDateISO

      &&

      Number(
        state.tpex.count
        ||
        0
      ) > 0

      &&

      Array.isArray(
        state.tpex.data
      )

      &&

      state.tpex.data.length > 0

    );


  if (
    !twseReady
    ||
    !tpexReady
  ) {

    state.synchronized =
      false;


    syncStatus.textContent =
      "WAITING";


    syncStatus.className =
      "log-status status-waiting";


    syncMeta.textContent =
      "資料未齊";


    syncInfo.classList.remove(
      "visible"
    );


    syncInfo.textContent =
      "";


    return;

  }


  const twseDate =
    state.twse.tradeDateISO;


  const tpexDate =
    state.tpex.tradeDateISO;


  const sameDate =
    twseDate ===
    tpexDate;


  const sameVolumeMode =
    Boolean(

      state.twse.volumeMode

      &&

      state.tpex.volumeMode

      &&

      state.twse.volumeMode
      ===
      state.tpex.volumeMode

    );


  /*
    日期不同：
    不再視為系統 ERROR / MISMATCH。

    這通常代表其中一個市場的官方盤後資料
    尚未完成更新。

    此時：
    - 新日期市場保持 READY
    - 舊日期市場標 STALE
    - UNIFIED 顯示 WAITING SYNC
    - 不建立跨市場候選池
  */

  if (
    !sameDate
  ) {

    state.synchronized =
      false;


    const twseTime =
      dateValue(
        twseDate
      );


    const tpexTime =
      dateValue(
        tpexDate
      );


    if (
      twseTime <
      tpexTime
    ) {

      twseStatus.textContent =
        "STALE";


      twseStatus.className =
        "log-status status-stale";

    }

    else if (
      tpexTime <
      twseTime
    ) {

      tpexStatus.textContent =
        "STALE";


      tpexStatus.className =
        "log-status status-stale";

    }


    syncStatus.textContent =
      "WAITING SYNC";


    syncStatus.className =
      "log-status status-waiting";


    syncMeta.textContent =
      `${twseDate} / ${tpexDate}`;


    syncInfo.textContent =
      (
        `等待兩市場同步。`
        +
        `TWSE ${twseDate}，`
        +
        `TPEx ${tpexDate}。`
        +
        `目前不混用不同交易日資料。`
      );


    syncInfo.classList.add(
      "visible"
    );


    return;

  }


  if (
    !sameVolumeMode
  ) {

    state.synchronized =
      false;


    syncStatus.textContent =
      "WAITING SYNC";


    syncStatus.className =
      "log-status status-waiting";


    syncMeta.textContent =
      "Volume Mode";


    syncInfo.textContent =
      (
        "兩市場 Volume Mode 尚未一致，"
        +
        "暫停建立跨市場流動性排名。"
      );


    syncInfo.classList.add(
      "visible"
    );


    return;

  }


  state.synchronized =
    true;


  syncStatus.textContent =
    "SYNCED";


  syncStatus.className =
    "log-status status-ready";


  syncMeta.textContent =
    twseDate;


  syncInfo.classList.remove(
    "visible"
  );


  syncInfo.textContent =
    "";

}

/* ==================================================

   ================================================== */

function buildCandidates() {

  if (
    !state.synchronized
  ) {

    state.stocks =
      [];

    state.long =
      [];

    state.short =
      [];


    return;

  }


  state.stocks = [

    ...state.twse.data,

    ...state.tpex.data

  ]
  .filter(
    validStock
  );


  assignLiquidityRanks(
    state.stocks
  );


  state.long =
    selectCandidates(
      state.stocks,
      "long"
    );


  state.short =
    selectCandidates(
      state.stocks,
      "short"
    );

}

      ===
      String(

      )
  );

}

            <strong>
              ${formatPrice(
                stock.LowestPrice
              )}
            </strong>

          </div>


          <div class="price-box">

            <span>
              Observation
            </span>

            <strong class="${sideTextClass}">
              ${formatPrice(
                observation
              )}
            </strong>

          </div>

        </div>

      </section>


      <section class="trade-section">

        <div class="section-label">
          ENTRY WATCH ZONE
        </div>


        <div class="watch-zone">

          <div class="watch-label">
            參考進場區
          </div>


          <div
            class="
              watch-price
              ${sideTextClass}
            "
          >

            ${formatPrice(
              zone?.from
            )}

            <small>
              ～
            </small>

            ${formatPrice(
              zone?.to
            )}

          </div>

        </div>


        <div class="notice">

          此區間是盤前觀察區，
          不是立即進場訊號。

          ${
            side === "long"

              ? "價格需先有效突破 Observation，再觀察回踩與方向確認。"

              : "價格需先有效跌破 Observation，再觀察回踩與方向確認。"
          }

        </div>

      </section>


      <section class="trade-section">

        <div class="section-label">
          CONFIRMATION FLOW
        </div>


        <div class="flow">

          <span>
            Observation
          </span>

          <i>→</i>

          <span>
            Breakout
          </span>

          <i>→</i>

          <span>
            Pullback
          </span>

          <i>→</i>

          <span>
            Swing
          </span>

          <i>→</i>

          <span>
            Confirm
          </span>

          <i>→</i>

          <span>
            Entry
          </span>

        </div>

      </section>

    `;


  dialog.showModal();


  document
  .getElementById(
    "closeDialog"
  )
  .addEventListener(
    "click",
    () =>
      dialog.close()
  );

}


/* ==================================================
   LOAD
   ================================================== */

async function load() {

  const root =
    document.getElementById(
      "candidateRoot"
    );


  const reloadButton =
    document.getElementById(
      "reloadBtn"
    );


  root.innerHTML =
    `

      <div class="loading">
        載入 TWSE / TPEx...
      </div>

    `;


  reloadButton.disabled =
    true;


  reloadButton.textContent =
    "讀取中...";


  state.twse =
    null;

  state.tpex =
    null;

  state.stocks =
    [];

  state.long =
    [];

  state.short =
    [];

  state.synchronized =
    false;


  const twseStatus =
    document.getElementById(
      "twseStatus"
    );


  const twseMeta =
    document.getElementById(
      "twseMeta"
    );


  const tpexStatus =
    document.getElementById(
      "tpexStatus"
    );


  const tpexMeta =
    document.getElementById(
      "tpexMeta"
    );


  const syncStatus =
    document.getElementById(
      "syncStatus"
    );


  const syncMeta =
    document.getElementById(
      "syncMeta"
    );


  twseStatus.textContent =
    "LOADING";

  twseStatus.className =
    "log-status status-checking";

  twseMeta.textContent =
    "讀取中...";


  tpexStatus.textContent =
    "LOADING";

  tpexStatus.className =
    "log-status status-checking";

  tpexMeta.textContent =
    "讀取中...";


  syncStatus.textContent =
    "CHECKING";

  syncStatus.className =
    "log-status status-checking";

  syncMeta.textContent =
    "等待資料";


  let twseError =
    null;


  let tpexError =
    null;


  try {

    const [
      twseResult,
      tpexResult
    ] =
      await Promise.allSettled([

        fetchMarket(
          "./TWSE/stocks.json"
        ),

        fetchMarket(
          "./TPEx/stocks.json"
        )

      ]);


    if (
      twseResult.status ===
      "fulfilled"
    ) {

      state.twse =
        twseResult.value;

    }

    else {

      twseError =
        twseResult.reason;

    }


    if (
      tpexResult.status ===
      "fulfilled"
    ) {

      state.tpex =
        tpexResult.value;

    }

    else {

      tpexError =
        tpexResult.reason;

    }


    setMarketStatus(
      "TWSE",
      state.twse,
      twseError
    );


    setMarketStatus(
      "TPEX",
      state.tpex,
      tpexError
    );


    updateSyncState();


    buildCandidates();


    renderSummary();


    renderCandidates();

  }

  finally {

    reloadButton.disabled =
      false;


    reloadButton.textContent =
      "重新讀取";

  }

}


/* ==================================================
   EVENTS
   ================================================== */

document
.getElementById(
  "reloadBtn"
)
.addEventListener(
  "click",
  load
);


document
.getElementById(
  "candidateRoot"
)
.addEventListener(
  "click",
  event => {

    const card =
      event.target.closest(
        ".candidate-card"
      );


    if (
      !card
    ) {

      return;

    }


    const stock =
      findCandidate(
        card.dataset.code,
        card.dataset.side
      );


    if (
      stock
    ) {

      openTradePlan(
        stock,
        card.dataset.side
      );

    }

  }
);


document
.getElementById(
  "tradeDialog"
)
.addEventListener(
  "click",
  event => {

    const dialog =
      event.currentTarget;


    const rect =
      dialog
      .getBoundingClientRect();


    const inside =
      (

        event.clientX
        >=
        rect.left

        &&

        event.clientX
        <=
        rect.right

        &&

        event.clientY
        >=
        rect.top

        &&

        event.clientY
        <=
        rect.bottom

      );


    if (
      !inside
    ) {

      dialog.close();

    }

  }
);


/* ==================================================
   START
   ================================================== */

load();

</script>

</body>

</html>
