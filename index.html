<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>台股隔日當沖候選系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      width: min(1400px, 94%);
      margin: 0 auto;
      padding: 30px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .status {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }

    .error {
      color: #d93025;
    }

    .table-wrap {
      overflow-x: auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    table {
      width: 100%;
      min-width: 1100px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #eee;
      text-align: right;
      white-space: nowrap;
    }

    th {
      background: #fafafa;
      font-weight: 600;
    }

    th:first-child,
    th:nth-child(2),
    td:first-child,
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr:hover {
      background: #fafafa;
    }

    .up {
      color: #d93025;
    }

    .down {
      color: #188038;
    }

    .neutral {
      color: #666;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>台股隔日當沖候選系統</h1>

    <div class="subtitle">
      使用前一交易日資料建立隔日觀察清單
    </div>


    <div class="toolbar">

      <button id="reloadBtn">
        重新讀取
      </button>

      <button id="volumeBtn">
        成交量排序
      </button>

      <button id="valueBtn">
        成交金額排序
      </button>

      <button id="amplitudeBtn">
        振幅排序
      </button>

    </div>


    <div
      id="status"
      class="status"
    >
      資料載入中...
    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>代號</th>
            <th>名稱</th>
            <th>成交量</th>
            <th>成交筆數</th>
            <th>成交金額</th>
            <th>開盤</th>
            <th>最高</th>
            <th>最低</th>
            <th>收盤</th>
            <th>漲跌</th>
            <th>振幅</th>
          </tr>

        </thead>


        <tbody id="stockTableBody">
        </tbody>

      </table>

    </div>

  </main>


  <script>

    const DATA_URL = "./stocks.json";

    let stocks = [];

    const statusEl =
      document.getElementById("status");

    const tableBody =
      document.getElementById("stockTableBody");


    function toNumber(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return 0;
      }

      const cleaned =
        String(value)
          .replace(/,/g, "")
          .replace(/\+/g, "")
          .trim();

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : 0;
    }


    function formatNumber(value) {

      return Number(value || 0)
        .toLocaleString("zh-TW");
    }


    function formatPrice(value) {

      const number =
        toNumber(value);

      if (number <= 0) {
        return "-";
      }

      return number.toLocaleString(
        "zh-TW",
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }
      );
    }


    function getChangeClass(value) {

      const change =
        toNumber(value);

      if (change > 0) {
        return "up";
      }

      if (change < 0) {
        return "down";
      }

      return "neutral";
    }


    /*
      暫時振幅公式：

      (最高 - 最低) / 開盤 × 100

      後面建立正式選股 SOP 時
      再改成我們最後決定的公式。
    */

    function calculateAmplitude(stock) {

      const high =
        toNumber(stock.HighestPrice);

      const low =
        toNumber(stock.LowestPrice);

      const open =
        toNumber(stock.OpeningPrice);

      if (
        high <= 0 ||
        low <= 0 ||
        open <= 0
      ) {
        return 0;
      }

      return (
        (high - low)
        /
        open
        *
        100
      );
    }


    function renderTable(data) {

      tableBody.innerHTML = "";

      const fragment =
        document.createDocumentFragment();


      data.forEach(stock => {

        const tr =
          document.createElement("tr");

        const amplitude =
          calculateAmplitude(stock);

        const change =
          toNumber(stock.Change);

        tr.innerHTML = `

          <td>
            ${stock.Code || ""}
          </td>

          <td>
            ${stock.Name || ""}
          </td>

          <td>
            ${formatNumber(
              toNumber(stock.TradeVolume)
            )}
          </td>

          <td>
            ${formatNumber(
              toNumber(stock.Transaction)
            )}
          </td>

          <td>
            ${formatNumber(
              toNumber(stock.TradeValue)
            )}
          </td>

          <td>
            ${formatPrice(
              stock.OpeningPrice
            )}
          </td>

          <td>
            ${formatPrice(
              stock.HighestPrice
            )}
          </td>

          <td>
            ${formatPrice(
              stock.LowestPrice
            )}
          </td>

          <td>
            ${formatPrice(
              stock.ClosingPrice
            )}
          </td>

          <td
            class="${getChangeClass(change)}"
          >
            ${
              change > 0
                ? "+"
                : ""
            }${change}
          </td>

          <td>
            ${amplitude.toFixed(2)}%
          </td>
        `;

        fragment.appendChild(tr);
      });


      tableBody.appendChild(fragment);
    }


    async function loadStocks() {

      statusEl.classList.remove("error");

      statusEl.textContent =
        "讀取 stocks.json 中...";


      try {

        const response =
          await fetch(
            `${DATA_URL}?t=${Date.now()}`
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );
        }


        const json =
          await response.json();


        /*
          支援兩種格式：

          1.
          {
            "updatedAt": "...",
            "data": [...]
          }

          2.
          [...]
        */

        const data =
          Array.isArray(json)
            ? json
            : json.data;


        if (!Array.isArray(data)) {

          throw new Error(
            "stocks.json 格式錯誤"
          );
        }


        stocks =
          data.filter(stock => {

            const code =
              String(
                stock.Code || ""
              ).trim();

            const close =
              toNumber(
                stock.ClosingPrice
              );

            return (
              code !== "" &&
              close > 0
            );
          });


        renderTable(stocks);


        const updatedAt =
          Array.isArray(json)
            ? ""
            : (
                json.updatedAt || ""
              );


        statusEl.textContent =
          `共載入 ${stocks.length} 筆資料`
          +
          (
            updatedAt
              ? ` ｜ 更新：${updatedAt}`
              : ""
          );


      } catch (error) {

        console.error(error);

        stocks = [];

        tableBody.innerHTML = "";

        statusEl.classList.add("error");

        statusEl.textContent =
          `stocks.json 讀取失敗：${error.message}`;
      }
    }


    function sortByVolume() {

      const result =
        [...stocks]
          .sort(
            (a, b) =>
              toNumber(b.TradeVolume)
              -
              toNumber(a.TradeVolume)
          );

      renderTable(result);
    }


    function sortByValue() {

      const result =
        [...stocks]
          .sort(
            (a, b) =>
              toNumber(b.TradeValue)
              -
              toNumber(a.TradeValue)
          );

      renderTable(result);
    }


    function sortByAmplitude() {

      const result =
        [...stocks]
          .sort(
            (a, b) =>
              calculateAmplitude(b)
              -
              calculateAmplitude(a)
          );

      renderTable(result);
    }


    document
      .getElementById("reloadBtn")
      .addEventListener(
        "click",
        loadStocks
      );


    document
      .getElementById("volumeBtn")
      .addEventListener(
        "click",
        sortByVolume
      );


    document
      .getElementById("valueBtn")
      .addEventListener(
        "click",
        sortByValue
      );


    document
      .getElementById("amplitudeBtn")
      .addEventListener(
        "click",
        sortByAmplitude
      );


    loadStocks();

  </script>

</body>
</html>
