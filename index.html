<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f1115"
  >

  <title>
    台股隔日當沖候選系統
  </title>


  <style>

    :root {

      --bg: #0f1115;

      --surface: #171a20;
      --surface-2: #1d2129;
      --surface-3: #242933;

      --border: #2b313d;

      --text: #f3f5f7;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;

      --up: #ff5a67;
      --down: #35c98b;

      --accent: #7c8cff;

      --radius-lg: 16px;
      --radius-md: 12px;

      --shadow:
        0 10px 28px
        rgba(
          0,
          0,
          0,
          0.22
        );

    }


    * {
      box-sizing: border-box;
    }


    html {
      background: var(--bg);
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #11141a 0%,
          var(--bg) 220px
        );

      color: var(--text);

      -webkit-font-smoothing:
        antialiased;

    }


    body.menu-open {
      overflow: hidden;
    }


    button,
    select {
      font: inherit;
    }


    button {
      -webkit-tap-highlight-color:
        transparent;
    }


    .app {

      width:
        min(
          1500px,
          96%
        );

      margin:
        0 auto;

      padding:
        26px
        0
        50px;

    }


    /* ========================================
       Drawer
    ======================================== */

    .drawer-overlay {

      position: fixed;

      inset: 0;

      z-index: 90;

      background:
        rgba(
          0,
          0,
          0,
          0.56
        );

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 0.2s ease,
        visibility 0.2s ease;

    }


    .drawer-overlay.show {

      opacity: 1;

      visibility: visible;

    }


    .drawer {

      position: fixed;

      top: 0;
      left: 0;
      bottom: 0;

      z-index: 100;

      width:
        min(
          310px,
          84vw
        );

      padding:
        max(
          24px,
          env(
            safe-area-inset-top
          )
        )
        16px
        24px;

      background:
        #15181e;

      border-right:
        1px solid
        var(--border);

      box-shadow:
        18px
        0
        40px
        rgba(
          0,
          0,
          0,
          0.32
        );

      transform:
        translateX(
          -102%
        );

      transition:
        transform 0.22s ease;

    }


    .drawer.show {
      transform:
        translateX(
          0
        );
    }


    .drawer-header {

      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 24px;

      padding:
        0
        4px;

    }


    .drawer-brand {

      min-width: 0;

    }


    .drawer-eyebrow {

      margin-bottom:
        5px;

      color:
        var(--accent);

      font-size:
        10px;

      font-weight:
        750;

      letter-spacing:
        0.08em;

    }


    .drawer-title {

      color:
        var(--text);

      font-size:
        18px;

      font-weight:
        750;

    }


    .drawer-close {

      width: 36px;
      height: 36px;

      border:
        1px solid
        var(--border);

      border-radius:
        10px;

      background:
        var(--surface-2);

      color:
        var(--text-secondary);

      cursor: pointer;

    }


    .drawer-section-title {

      margin:
        18px
        8px
        8px;

      color:
        var(--text-muted);

      font-size:
        10px;

      font-weight:
        700;

      letter-spacing:
        0.08em;

    }


    .nav-item {

      display: flex;

      width: 100%;

      align-items: center;

      gap: 12px;

      margin-bottom:
        5px;

      border:
        1px solid
        transparent;

      border-radius:
        11px;

      padding:
        12px
        13px;

      background:
        transparent;

      color:
        var(--text-secondary);

      text-align:
        left;

      cursor:
        pointer;

    }


    .nav-item:hover {

      background:
        var(--surface-2);

      color:
        var(--text);

    }


    .nav-item.active {

      border-color:
        rgba(
          124,
          140,
          255,
          0.25
        );

      background:
        rgba(
          124,
          140,
          255,
          0.11
        );

      color:
        var(--text);

    }


    .nav-icon {

      display: grid;

      flex-shrink: 0;

      width: 34px;
      height: 34px;

      place-items: center;

      border:
        1px solid
        var(--border);

      border-radius:
        9px;

      background:
        rgba(
          255,
          255,
          255,
          0.025
        );

      font-size:
        13px;

      font-weight:
        800;

    }


    .nav-copy {

      min-width: 0;

    }


    .nav-name {

      color: inherit;

      font-size:
        13px;

      font-weight:
        700;

    }


    .nav-description {

      overflow: hidden;

      margin-top:
        3px;

      color:
        var(--text-muted);

      font-size:
        10px;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

    }


    /* ========================================
       Header
    ======================================== */

    .header {

      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 18px;

      margin-bottom:
        22px;

    }


    .header-left {

      display: flex;

      align-items: flex-start;

      min-width: 0;

      gap: 13px;

    }


    .menu-btn {

      display: grid;

      flex-shrink: 0;

      width: 42px;
      height: 42px;

      margin-top:
        1px;

      place-items: center;

      border:
        1px solid
        var(--border);

      border-radius:
        11px;

      padding: 0;

      background:
        var(--surface-2);

      color:
        var(--text);

      cursor: pointer;

    }


    .hamburger {

      position: relative;

      width: 17px;
      height: 12px;

    }


    .hamburger::before,
    .hamburger::after,
    .hamburger span {

      position: absolute;

      left: 0;

      width: 17px;
      height: 2px;

      border-radius:
        2px;

      background:
        currentColor;

      content: "";

    }


    .hamburger::before {
      top: 0;
    }


    .hamburger span {
      top: 5px;
    }


    .hamburger::after {
      bottom: 0;
    }


    .title-area {

      min-width: 0;

    }


    .eyebrow {

      margin-bottom:
        6px;

      color:
        var(--accent);

      font-size:
        11px;

      font-weight:
        750;

      letter-spacing:
        0.08em;

    }


    h1 {

      margin: 0;

      font-size:
        27px;

      line-height:
        1.25;

      letter-spacing:
        -0.02em;

    }


    .subtitle {

      margin-top:
        7px;

      color:
        var(--text-secondary);

      font-size:
        13px;

      line-height:
        1.55;

    }


    .reload-btn {

      flex-shrink: 0;

      border:
        1px solid
        var(--border);

      border-radius:
        10px;

      padding:
        10px
        15px;

      background:
        var(--surface-2);

      color:
        var(--text);

      cursor: pointer;

    }


    .reload-btn:active,
    .menu-btn:active {

      transform:
        scale(
          0.97
        );

    }


    /* ========================================
       View heading
    ======================================== */

    .view-heading {

      display: flex;

      align-items:
        flex-end;

      justify-content:
        space-between;

      gap: 12px;

      margin:
        0
        0
        14px;

    }


    .view-name {

      font-size:
        16px;

      font-weight:
        750;

    }


    .view-description {

      margin-top:
        4px;

      color:
        var(--text-muted);

      font-size:
        11px;

    }


    .candidate-chip {

      display: none;

      flex-shrink: 0;

      border:
        1px solid
        rgba(
          124,
          140,
          255,
          0.25
        );

      border-radius:
        999px;

      padding:
        6px
        9px;

      background:
        rgba(
          124,
          140,
          255,
          0.09
        );

      color:
        #b8c0ff;

      font-size:
        10px;

      font-weight:
        700;

    }


    .candidate-chip.show {
      display:
        inline-block;
    }


    /* ========================================
       Summary
    ======================================== */

    .summary {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin-bottom:
        18px;

    }


    .summary-card {

      padding:
        14px
        16px;

      background:
        linear-gradient(
          145deg,
          var(--surface-2),
          var(--surface)
        );

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius-md);

    }


    .summary-label {

      margin-bottom:
        6px;

      color:
        var(--text-secondary);

      font-size:
        11px;

    }


    .summary-value {

      overflow: hidden;

      font-size:
        17px;

      font-weight:
        750;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

    }


    /* ========================================
       Controls
    ======================================== */

    .controls {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 12px;

      margin-bottom:
        14px;

    }


    .status {

      color:
        var(--text-secondary);

      font-size:
        12px;

    }


    .status.error {
      color:
        var(--up);
    }


    .desktop-hint {

      color:
        var(--text-muted);

      font-size:
        11px;

    }


    .mobile-sort {
      display: none;
    }


    .sort-select {

      width: 100%;

      border:
        1px solid
        var(--border);

      border-radius:
        10px;

      padding:
        10px
        36px
        10px
        12px;

      background:
        var(--surface-2);

      color:
        var(--text);

      outline: none;

    }


    /* ========================================
       Market badge
    ======================================== */

    .market-badge {

      display:
        inline-flex;

      align-items: center;

      justify-content: center;

      min-width:
        32px;

      border:
        1px solid
        var(--border);

      border-radius:
        6px;

      padding:
        3px
        5px;

      font-size:
        9px;

      font-weight:
        750;

      line-height:
        1;

      white-space:
        nowrap;

    }


    .market-twse {

      border-color:
        rgba(
          124,
          140,
          255,
          0.26
        );

      background:
        rgba(
          124,
          140,
          255,
          0.10
        );

      color:
        #aeb7ff;

    }


    .market-tpex {

      border-color:
        rgba(
          53,
          201,
          139,
          0.25
        );

      background:
        rgba(
          53,
          201,
          139,
          0.09
        );

      color:
        #78dcb1;

    }


    /* ========================================
       Desktop table
    ======================================== */

    .desktop-table {

      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius-lg);

      background:
        var(--surface);

      box-shadow:
        var(--shadow);

    }


    .table-scroll {
      overflow-x: auto;
    }


    table {

      width: 100%;

      min-width:
        1340px;

      border-collapse:
        collapse;

    }


    thead {
      background:
        #1b1f27;
    }


    th {

      position: sticky;

      top: 0;

      z-index: 2;

      padding:
        13px
        12px;

      border-bottom:
        1px solid
        var(--border);

      color:
        var(--text-secondary);

      background:
        #1b1f27;

      font-size:
        11px;

      font-weight:
        650;

      text-align:
        right;

      white-space:
        nowrap;

      user-select:
        none;

    }


    td {

      padding:
        13px
        12px;

      border-bottom:
        1px solid
        rgba(
          43,
          49,
          61,
          0.75
        );

      color:
        #d9dde3;

      font-size:
        12px;

      text-align:
        right;

      white-space:
        nowrap;

    }


    tbody tr:hover {
      background:
        #1c2027;
    }


    tbody tr:last-child td {
      border-bottom: none;
    }


    th:nth-child(1),
    th:nth-child(2),
    th:nth-child(3),
    th:nth-child(4),
    td:nth-child(1),
    td:nth-child(2),
    td:nth-child(3),
    td:nth-child(4) {

      text-align: left;

    }


    .sortable {
      cursor: pointer;
    }


    .sortable:hover {

      color:
        var(--text);

      background:
        #242932;

    }


    .sortable.active {

      color:
        var(--text);

      background:
        #232832;

    }


    .sort-icon {

      display:
        inline-block;

      min-width:
        12px;

      margin-left:
        3px;

      color:
        var(--accent);

    }


    .code {
      color:
        var(--text-secondary);
    }


    .stock-name {

      color:
        var(--text);

      font-weight:
        700;

    }


    .industry {
      color:
        #aeb5c0;
    }


    .up {
      color:
        var(--up);
    }


    .down {
      color:
        var(--down);
    }


    .neutral {
      color:
        var(--text-secondary);
    }


    /* ========================================
       Mobile
    ======================================== */

    .mobile-list {
      display: none;
    }


    .mobile-stock-card {

      position: relative;

      margin-bottom:
        8px;

      border:
        1px solid
        var(--border);

      border-radius:
        14px;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #1a1e25,
          #16191f
        );

      cursor: pointer;

    }


    .mobile-stock-card:active {
      background:
        #1d2129;
    }


    .mobile-card-summary {

      padding:
        13px
        14px
        12px;

    }


    .mobile-line {

      display: flex;

      align-items: center;

      min-width: 0;

    }


    .mobile-line-primary {

      gap: 6px;

      line-height:
        1.35;

    }


    .mobile-rank {

      display:
        none;

      flex-shrink: 0;

      width:
        21px;

      color:
        var(--accent);

      font-size:
        10px;

      font-weight:
        800;

    }


    .candidate-mode
    .mobile-rank {

      display:
        inline-block;

    }


    .mobile-name {

      flex-shrink: 0;

      color:
        var(--text);

      font-size:
        16px;

      font-weight:
        750;

    }


    .mobile-code {

      flex-shrink: 0;

      color:
        var(--text-muted);

      font-size:
        10px;

      font-weight:
        650;

    }


    .mobile-change-percent {

      flex-shrink: 0;

      margin-left:
        auto;

      font-size:
        13px;

      font-weight:
        750;

      font-variant-numeric:
        tabular-nums;

    }


    .mobile-line-secondary {

      gap: 6px;

      margin-top:
        8px;

      overflow: hidden;

      color:
        var(--text-secondary);

      font-size:
        10.5px;

      line-height:
        1.4;

    }


    .mobile-industry-inline {

      flex-shrink: 1;

      min-width: 0;

      overflow: hidden;

      max-width:
        105px;

      color:
        #aeb5c0;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

    }


    .mobile-divider {

      flex-shrink: 0;

      color:
        #414854;

    }


    .mobile-stat-inline {

      flex-shrink: 0;

      white-space:
        nowrap;

      font-variant-numeric:
        tabular-nums;

    }


    .mobile-ohlc-row {

      position: relative;

      margin-top:
        9px;

      padding-right:
        30px;

      color:
        var(--text-secondary);

      font-size:
        10px;

      line-height:
        1.4;

      font-variant-numeric:
        tabular-nums;

      white-space:
        nowrap;

    }


    .mobile-ohlc-separator {

      margin:
        0
        2px;

      color:
        #4a515d;

    }


    .mobile-arrow {

      position: absolute;

      right:
        16px;

      bottom:
        17px;

      width:
        9px;

      height:
        9px;

      border-right:
        2px solid
        var(--text-muted);

      border-bottom:
        2px solid
        var(--text-muted);

      transform:
        rotate(
          45deg
        );

      transition:
        transform 0.2s;

    }


    .mobile-stock-card.expanded
    .mobile-arrow {

      top:
        64px;

      bottom:
        auto;

      transform:
        rotate(
          225deg
        );

    }


    .mobile-card-details {

      max-height: 0;

      overflow: hidden;

      opacity: 0;

      border-top:
        1px solid
        transparent;

      transition:
        max-height 0.25s ease,
        opacity 0.2s ease,
        padding 0.25s ease,
        border-color 0.25s ease;

    }


    .mobile-stock-card.expanded
    .mobile-card-details {

      max-height:
        340px;

      padding:
        12px
        14px
        14px;

      opacity: 1;

      border-top:
        1px solid
        var(--border);

    }


    .detail-grid {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 8px;

    }


    .detail-item {

      min-width: 0;

      padding:
        9px
        10px;

      border:
        1px solid
        rgba(
          43,
          49,
          61,
          0.8
        );

      border-radius:
        9px;

      background:
        rgba(
          255,
          255,
          255,
          0.025
        );

    }


    .detail-label {

      margin-bottom:
        4px;

      color:
        var(--text-muted);

      font-size:
        9px;

    }


    .detail-value {

      overflow: hidden;

      color:
        #e1e5ea;

      font-size:
        11px;

      font-weight:
        650;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

      font-variant-numeric:
        tabular-nums;

    }


    .loading {

      padding:
        50px
        20px;

      color:
        var(--text-secondary);

      text-align:
        center;

    }


    .empty {

      padding:
        48px
        20px;

      color:
        var(--text-muted);

      text-align:
        center;

    }


    /* ========================================
       Mobile
    ======================================== */

    @media (
      max-width: 720px
    ) {

      body {
        background:
          var(--bg);
      }


      .app {

        width: 100%;

        padding:
          max(
            17px,
            env(
              safe-area-inset-top
            )
          )
          14px
          calc(
            32px
            +
            env(
              safe-area-inset-bottom
            )
          );

      }


      .header {

        align-items:
          center;

        margin-bottom:
          17px;

      }


      .header-left {

        align-items:
          center;

        gap: 10px;

      }


      .menu-btn {

        width: 38px;
        height: 38px;

        margin-top: 0;

      }


      .eyebrow {

        margin-bottom:
          4px;

        font-size:
          9px;

      }


      h1 {
        font-size:
          19px;
      }


      .subtitle {
        display: none;
      }


      .reload-btn {

        padding:
          8px
          10px;

        font-size:
          11px;

      }


      .view-heading {

        align-items:
          center;

        margin-bottom:
          11px;

      }


      .view-name {
        font-size:
          14px;
      }


      .view-description {
        font-size:
          9.5px;
      }


      .summary {

        grid-template-columns:
          1fr
          1fr;

        gap: 8px;

        margin-bottom:
          13px;

      }


      .summary-card {

        padding:
          11px
          12px;

      }


      .summary-card:last-child {

        grid-column:
          1 / -1;

      }


      .summary-label {

        margin-bottom:
          4px;

        font-size:
          9px;

      }


      .summary-value {
        font-size:
          14px;
      }


      .controls {

        display: block;

        margin-bottom:
          11px;

      }


      .status {

        margin-bottom:
          8px;

        font-size:
          10px;

      }


      .desktop-hint {
        display: none;
      }


      .mobile-sort {
        display: block;
      }


      .desktop-table {
        display: none;
      }


      .mobile-list {
        display: block;
      }

    }


    @media (
      max-width: 390px
    ) {

      .app {

        padding-left:
          11px;

        padding-right:
          11px;

      }


      .mobile-card-summary {

        padding-left:
          11px;

        padding-right:
          11px;

      }


      .mobile-name {
        font-size:
          15px;
      }


      .mobile-industry-inline {
        max-width:
          75px;
      }


      .mobile-line-secondary {

        gap:
          4px;

        font-size:

  <script>

    const DATA_URL =
      "./stocks.json";


    const VIEW_CONFIG = {

      candidate: {

        name:
          "候選池",

        description:
          "上市＋上櫃成交量最高 TOP 10"

      },

      all: {

        name:
          "全部市場",

        description:
          "上市＋上櫃全部個股"

      },

      twse: {

        name:
          "上市股票",

        description:
          "TWSE 上市個股"

      },

      tpex: {

        name:
          "上櫃股票",

        description:
          "TPEx 上櫃個股"

      }

    };


    let stocks = [];

    let currentView = [];

    let currentPage =
      getInitialPage();


    let metadata = {

      tradeDate: "",

      updatedAt: "",

      volumeMode: "",

      marketCounts: {}

    };


    let sortState = {

      key: null,

      direction: null

    };


    const drawer =
      document.getElementById(
        "drawer"
      );


    const drawerOverlay =
      document.getElementById(
        "drawerOverlay"
      );


    const statusEl =
      document.getElementById(
        "status"
      );


    const tableBody =
      document.getElementById(
        "stockTableBody"
      );


    const mobileStockList =
      document.getElementById(
        "mobileStockList"
      );


    const tradeDateValue =
      document.getElementById(
        "tradeDateValue"
      );


    const countValue =
      document.getElementById(
        "countValue"
      );


    const updatedAtValue =
      document.getElementById(
        "updatedAtValue"
      );


    const mobileSortSelect =
      document.getElementById(
        "mobileSortSelect"
      );


    const viewName =
      document.getElementById(
        "viewName"
      );


    const viewDescription =
      document.getElementById(
        "viewDescription"
      );


    const candidateChip =
      document.getElementById(
        "candidateChip"
      );


    /* ========================================
       Initial page
    ======================================== */

    function getInitialPage() {

      const hash =
        location.hash
        .replace(
          "#",
          ""
        )
        .trim()
        .toLowerCase();


      if (
        VIEW_CONFIG[
          hash
        ]
      ) {

        return hash;

      }


      return "candidate";

    }


    /* ========================================
       Number
    ======================================== */

    function toNumber(
      value
    ) {

      if (
        value === null
        ||
        value === undefined
        ||
        value === ""
      ) {

        return 0;

      }


      const cleaned =
        String(
          value
        )
        .replace(
          /,/g,
          ""
        )
        .replace(
          /\+/g,
          ""
        )
        .trim();


      const number =
        Number(
          cleaned
        );


      return Number.isFinite(
        number
      )
        ? number
        : 0;

    }


    /* ========================================
       HTML
    ======================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }


    /* ========================================
       Market
    ======================================== */

    function getMarketName(
      stock
    ) {

      if (
        stock.MarketName
      ) {

        return stock.MarketName;

      }


      if (
        stock.Market ===
        "TPEX"
      ) {

        return "上櫃";

      }


      return "上市";

    }


    function getMarketClass(
      stock
    ) {

      return (
        stock.Market ===
        "TPEX"
      )
        ? "market-tpex"
        : "market-twse";

    }


    function marketBadge(
      stock
    ) {

      return `

        <span
          class="
            market-badge
            ${getMarketClass(
              stock
            )}
          "
        >

          ${escapeHtml(
            getMarketName(
              stock
            )
          )}

        </span>

      `;

    }


    /* ========================================
       Volume
    ======================================== */

    function getTradeVolumeShares(
      stock
    ) {

      if (
        stock.AdjustedTradeVolume
        !== undefined
        &&
        stock.AdjustedTradeVolume
        !== null
        &&
        stock.AdjustedTradeVolume
        !== ""
      ) {

        return Math.max(

          0,

          toNumber(
            stock.AdjustedTradeVolume
          )
        );

      }


      if (
        stock.RegularTradeVolume
        !== undefined
        &&
        stock.RegularTradeVolume
        !== null
        &&
        stock.RegularTradeVolume
        !== ""
      ) {

        return Math.max(

          0,

          toNumber(
            stock.RegularTradeVolume
          )
        );

      }


      if (
        stock.NonOddLotTradeVolume
        !== undefined
        &&
        stock.NonOddLotTradeVolume
        !== null
        &&
        stock.NonOddLotTradeVolume
        !== ""
      ) {

        return Math.max(

          0,

          toNumber(
            stock.NonOddLotTradeVolume
          )
        );

      }


      return Math.max(

        0,

        toNumber(
          stock.TradeVolume
        )
      );

    }


    function getVolumeLots(
      stock
    ) {

      return (
        getTradeVolumeShares(
          stock
        )
        /
        1000
      );

    }


    function formatVolumeLots(
      stock
    ) {

      return (
        Math.round(
          getVolumeLots(
            stock
          )
        )
        .toLocaleString(
          "zh-TW"
        )
        +
        "張"
      );

    }


    function formatVolumeLotsNumber(
      stock
    ) {

      return Math.round(
        getVolumeLots(
          stock
        )
      )
      .toLocaleString(
        "zh-TW"
      );

    }


    /* ========================================
       Formatting
    ======================================== */

    function formatNumber(
      value
    ) {

      return toNumber(
        value
      )
      .toLocaleString(
        "zh-TW"
      );

    }


    function formatPrice(
      value
    ) {

      const number =
        toNumber(
          value
        );


      if (
        number <= 0
      ) {

        return "-";

      }


      return number.toLocaleString(

        "zh-TW",

        {

          minimumFractionDigits:
            0,

          maximumFractionDigits:
            2

        }
      );

    }


    function formatCompactMoney(
      value
    ) {

      const number =
        toNumber(
          value
        );


      if (
        number >=
        100000000
      ) {

        const result =
          number
          /
          100000000;


        return (
          (
            result >= 100
              ? result.toFixed(
                  1
                )
              : result.toFixed(
                  2
                )
          )
          +
          "億"
        );

      }


      if (
        number >=
        10000
      ) {

        const result =
          number
          /
          10000;


        return (
          (
            result >= 100
              ? result.toFixed(
                  0
                )
              : result.toFixed(
                  1
                )
          )
          +
          "萬"
        );

      }


      return formatNumber(
        number
      );

    }


    function formatTradeDate(
      value
    ) {

      const raw =
        String(
          value || ""
        )
        .replace(
          /\D/g,
          ""
        );


      if (
        raw.length !== 7
      ) {

        return value || "-";

      }


      const year =
        Number(
          raw.slice(
            0,
            3
          )
        )
        +
        1911;


      return (

        `${year}/`
        +
        `${raw.slice(3, 5)}/`
        +
        `${raw.slice(5, 7)}`

      );

    }


    /* ========================================
       Change
    ======================================== */

    function calculatePreviousClose(
      stock
    ) {

      return (

        toNumber(
          stock.ClosingPrice
        )

        -

        toNumber(
          stock.Change
        )

      );

    }


    function calculateChangePercent(
      stock
    ) {

      const previousClose =
        calculatePreviousClose(
          stock
        );


      if (
        previousClose <= 0
      ) {

        return 0;

      }


      return (

        toNumber(
          stock.Change
        )

        /

        previousClose

        *

        100

      );

    }


    function getChangeClass(
      value
    ) {

      const number =
        toNumber(
          value
        );


      if (
        number > 0
      ) {

        return "up";

      }


      if (
        number < 0
      ) {

        return "down";

      }


      return "neutral";

    }


    function formatChangePercent(
      stock
    ) {

      const percent =
        calculateChangePercent(
          stock
        );


      return (

        (
          percent > 0
            ? "+"
            : ""
        )

        +

        percent.toFixed(
          2
        )

        +

        "%"

      );

    }


    function formatPriceChange(
      stock
    ) {

      const change =
        toNumber(
          stock.Change
        );


      return (

        (
          change > 0
            ? "+"
            : ""
        )

        +

        change.toLocaleString(

          "zh-TW",

          {

            maximumFractionDigits:
              2

          }
        )

      );

    }


    /* ========================================
       Amplitude
    ======================================== */

    function calculateAmplitude(
      stock
    ) {

      const high =
        toNumber(
          stock.HighestPrice
        );


      const low =
        toNumber(
          stock.LowestPrice
        );


      const open =
        toNumber(
          stock.OpeningPrice
        );


      if (
        high <= 0
        ||
        low <= 0
        ||
        open <= 0
      ) {

        return 0;

      }


      return (

        (
          high
          -
          low
        )

        /

        open

        *

        100

      );

    }


    /* ========================================
       Page
    ======================================== */

    function getPageStocks() {

      if (
        currentPage ===
        "twse"
      ) {

        return stocks.filter(
          stock =>
            stock.Market ===
            "TWSE"
        );

      }


      if (
        currentPage ===
        "tpex"
      ) {

        return stocks.filter(
          stock =>
            stock.Market ===
            "TPEX"
        );

      }


      if (
        currentPage ===
        "candidate"
      ) {

        return [...stocks]

        .filter(
          stock =>
            getTradeVolumeShares(
              stock
            ) > 0
        )

        .sort(
          (
            a,
            b
          ) =>

            getTradeVolumeShares(
              b
            )
            -
            getTradeVolumeShares(
              a
            )
        )

        .slice(
          0,
          10
        );

      }


      return [
        ...stocks
      ];

    }


    function updateViewHeader() {

      const config =
        VIEW_CONFIG[
          currentPage
        ];


      viewName.textContent =
        config.name;


      viewDescription.textContent =
        config.description;


      candidateChip.classList.toggle(

        "show",

        currentPage ===
        "candidate"

      );


      document
      .querySelectorAll(
        ".nav-item"
      )
      .forEach(
        item => {

          item.classList.toggle(

            "active",

            item.dataset.view
            ===
            currentPage

          );

        }
      );

    }


    function setPage(
      page,
      updateHash=true
    ) {

      if (
        !VIEW_CONFIG[
          page
        ]
      ) {

        page =
          "candidate";

      }


      currentPage =
        page;


      if (
        updateHash
      ) {

        history.replaceState(

          null,

          "",

          `#${page}`

        );

      }


      sortState = {

        key: null,

        direction: null

      };


      mobileSortSelect.value =
        "";


      currentView =
        getPageStocks();


      updateViewHeader();


      updateSummary();


      renderAll();


      updateDesktopSortIcons();


      closeDrawer();

    }


    /* ========================================
       Summary
    ======================================== */

    function updateSummary() {

      tradeDateValue.textContent =
        formatTradeDate(
          metadata.tradeDate
        );


      countValue.textContent =
        `${currentView.length.toLocaleString(
          "zh-TW"
        )} 檔`;


      updatedAtValue.textContent =
        metadata.updatedAt
        ||
        "-";


      const twseCount =
        stocks.filter(
          stock =>
            stock.Market ===
            "TWSE"
        ).length;


      const tpexCount =
        stocks.filter(
          stock =>
            stock.Market ===
            "TPEX"
        ).length;


      if (
        currentPage ===
        "candidate"
      ) {

        statusEl.textContent =

          `候選池 TOP ${currentView.length}`
          +
          `｜上市 ${twseCount}`
          +
          `｜上櫃 ${tpexCount}`
          +
          `｜成交量排除零股`;

      }

      else {

        statusEl.textContent =

          `目前顯示 ${currentView.length.toLocaleString(
            "zh-TW"
          )} 檔`
          +
          `｜上市 ${twseCount}`
          +
          `｜上櫃 ${tpexCount}`
          +
          `｜成交量排除零股`;

      }

    }


    /* ========================================
       Desktop
    ======================================== */

    function renderDesktopTable(
      data
    ) {

      tableBody.innerHTML =
        "";


      const fragment =
        document
        .createDocumentFragment();


      data.forEach(
        stock => {

          const tr =
            document.createElement(
              "tr"
            );


          const changePercent =
            calculateChangePercent(
              stock
            );


          const amplitude =
            calculateAmplitude(
              stock
            );


          tr.innerHTML = `

            <td>
              ${marketBadge(
                stock
              )}
            </td>

            <td class="code">
              ${escapeHtml(
                stock.Code || ""
              )}
            </td>

            <td class="stock-name">
              ${escapeHtml(
                stock.Name || ""
              )}
            </td>

            <td class="industry">
              ${escapeHtml(
                stock.Industry
                ||
                "未分類"
              )}
            </td>

            <td>
              ${formatVolumeLotsNumber(
                stock
              )}
            </td>

            <td>
              ${formatNumber(
                stock.Transaction
              )}
            </td>

            <td>
              ${formatNumber(
                stock.TradeValue
              )}
            </td>

            <td>
              ${formatPrice(
                stock.OpeningPrice
              )}
            </td>

            <td>
              ${formatPrice(
                stock.HighestPrice
              )}
            </td>

            <td>
              ${formatPrice(
                stock.LowestPrice
              )}
            </td>

            <td>
              ${formatPrice(
                stock.ClosingPrice
              )}
            </td>

            <td
              class="
                ${getChangeClass(
                  changePercent
                )}
              "
            >
              ${formatChangePercent(
                stock
              )}
            </td>

            <td>
              ${amplitude.toFixed(
                2
              )}%
            </td>

          `;


          fragment.appendChild(
            tr
          );

        }
      );


      tableBody.appendChild(
        fragment
      );

    }


    /* ========================================
       Mobile

    function renderMobileCards(

      ) {

            <div class="empty">

          `;

      }

        document

      data.forEach(
        (

          index
        ) => {

            );

            );

            );

            );

            );

            <div class="mobile-card-summary">

              >

                <span class="mobile-rank">

                  )}

                <span class="mobile-code">

                  )}

                <span

                  "
                >

                  ${formatChangePercent(

                  )}

                </span>

              </div>


              <div

                  mobile-line-secondary
                "

                <span

                  "
                >

                  ${escapeHtml(

                    "未分類"
                  )}

                </span>

                <span class="mobile-divider">
                  |
                </span>

                <span class="mobile-stat-inline">

                  成交量
                  ${formatVolumeLots(
                    stock
                  )}

                </span>

                <span class="mobile-divider">
                  |
                </span>

                <span class="mobile-stat-inline">

                  成交金額
                  ${formatCompactMoney(
                    stock.TradeValue
                  )}

                </span>

              </div>


              <div class="mobile-ohlc-row">

                <span>
                  開
                  ${formatPrice(
                    stock.OpeningPrice
                  )}
                </span>

                <span class="mobile-ohlc-separator">
                  ｜
                </span>

                <span>
                  高
                  ${formatPrice(
                    stock.HighestPrice
                  )}
                </span>

                <span class="mobile-ohlc-separator">
                  ｜
                </span>

                <span>
                  低
                  ${formatPrice(
                    stock.LowestPrice
                  )}
                </span>

                <span class="mobile-ohlc-separator">
                  ｜
                </span>

                <span>
                  收
                  ${formatPrice(
                    stock.ClosingPrice
                  )}
                </span>

              </div>

            </div>


            <span class="mobile-arrow"></span>


            <div class="mobile-card-details">

              <div class="detail-grid">


                <div class="detail-item">

                  <div class="detail-label">
                    市場
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(
                      getMarketName(
                        stock

                </div>


                <div class="detail-item">

                  <div class="detail-label">

                    ${formatNumber(

                <div class="detail-item">

                event.key ===

                event.key ===

    /* ========================================
       Render
    ======================================== */

    function renderAll() {

      renderDesktopTable(
        currentView
      );


      renderMobileCards(
        currentView
      );

    }


    /* ========================================
       Sorting
    ======================================== */

    function getSortValue(
      stock,
      key,
      type
    ) {

      if (
        key ===
        "TradeVolume"
      ) {

        return getTradeVolumeShares(
          stock
        );

      }


      if (
        key ===
        "ChangePercent"
      ) {

        return calculateChangePercent(
          stock
        );

      }


      if (
        key ===
        "Amplitude"
      ) {

        return calculateAmplitude(
          stock
        );

      }


      if (
        key ===
        "MarketName"
      ) {

        return getMarketName(
          stock
        );

      }


      if (
        type ===
        "number"
      ) {

        return toNumber(
          stock[
            key
          ]
        );

      }


      return String(
        stock[
          key
        ]
        ||
        ""
      );

    }


    function applySort(
      key,
      direction,
      type
    ) {

      sortState = {

        key,

        direction

      };


      currentView =
        [...currentView]
        .sort(
          (
            a,
            b
          ) => {

            const aValue =
              getSortValue(
                a,
                key,
                type
              );


            const bValue =
              getSortValue(
                b,
                key,
                type
              );


            let result = 0;


            if (
              type ===
              "number"
            ) {

              result =
                aValue
                -
                bValue;

            }

            else {

              result =
                String(
                  aValue
                )
                .localeCompare(
                  String(
                    bValue
                  ),
                  "zh-Hant"
                );

            }


            return (
              direction ===
              "asc"
            )
              ? result
              : -result;

          }
        );


      renderAll();


      updateDesktopSortIcons();

    }


    function sortFromHeader(
      th
    ) {

      const key =
        th.dataset.key;


      const type =
        th.dataset.type;


      let direction;


      if (
        sortState.key ===
        key
      ) {

        direction =
          sortState.direction ===
          "desc"
            ? "asc"
            : "desc";

      }

      else {

        direction =
          type ===
          "number"
            ? "desc"
            : "asc";

      }


      applySort(
        key,
        direction,
        type
      );

    }


    function updateDesktopSortIcons() {

      document
      .querySelectorAll(
        "th.sortable"
      )
      .forEach(
        th => {

          th.classList.remove(
            "active"
          );


          const icon =
            th.querySelector(
              ".sort-icon"
            );


          icon.textContent =
            "";


          if (
            th.dataset.key ===
            sortState.key
          ) {

            th.classList.add(
              "active"
            );


            icon.textContent =
              sortState.direction ===
              "desc"
                ? "↓"
                : "↑";

          }

        }
      );

    }


    /* ========================================
       Drawer
    ======================================== */

    function openDrawer() {

      drawer.classList.add(
        "show"
      );


      drawerOverlay.classList.add(
        "show"
      );


      document.body.classList.add(
        "menu-open"
      );

    }


    function closeDrawer() {

      drawer.classList.remove(
        "show"
      );


      drawerOverlay.classList.remove(
        "show"
      );


      document.body.classList.remove(
        "menu-open"
      );

    }


    /* ========================================
       Load
    ======================================== */

    async function loadStocks() {

      statusEl.classList.remove(
        "error"
      );


      statusEl.textContent =
        "讀取 stocks.json 中...";


      mobileStockList.innerHTML =
        `
          <div class="loading">
            載入資料中...
          </div>
        `;


      try {

        const response =
          await fetch(
            `${DATA_URL}?t=${Date.now()}`
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const json =
          await response.json();


        const data =
          Array.isArray(
            json
          )
            ? json
            : json.data;


        if (
          !Array.isArray(
            data
          )
        ) {

          throw new Error(
            "stocks.json 格式錯誤"
          );

        }


        stocks =
          data.filter(
            stock => {

              const code =
                String(
                  stock.Code
                  ||
                  ""
                ).trim();


              const close =
                toNumber(
                  stock.ClosingPrice
                );


              return (
                code !== ""
                &&
                close > 0
              );

            }
          );


        metadata = {

          tradeDate:
            Array.isArray(
              json
            )
              ? ""
              : json.tradeDate,

          updatedAt:
            Array.isArray(
              json
            )
              ? ""
              : json.updatedAt,

          volumeMode:
            Array.isArray(
              json
            )
              ? ""
              : json.volumeMode,

          marketCounts:
            Array.isArray(
              json
            )
              ? {}
              : (
                  json.marketCounts
                  ||
                  {}
                )
        };


        setPage(
          currentPage,
          false
        );

      }

      catch (
        error
      ) {

        console.error(
          error
        );


        stocks = [];

        currentView = [];


        tableBody.innerHTML =
          "";


        mobileStockList.innerHTML =
          `
            <div class="loading">
              資料讀取失敗
            </div>
          `;


        tradeDateValue.textContent =
          "-";


        countValue.textContent =
          "-";


        updatedAtValue.textContent =
          "-";


        statusEl.classList.add(
          "error"
        );


        statusEl.textContent =
          "stocks.json 讀取失敗："
          +
          error.message;

      }

    }


    /* ========================================
       Events
    ======================================== */

    document
    .getElementById(
      "menuBtn"
    )
    .addEventListener(
      "click",
      openDrawer
    );


    document
    .getElementById(
      "drawerCloseBtn"
    )
    .addEventListener(
      "click",
      closeDrawer
    );


    drawerOverlay.addEventListener(
      "click",
      closeDrawer
    );


    document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            setPage(
              button.dataset.view
            );

          }
        );

      }
    );


    document
    .querySelectorAll(
      "th.sortable"
    )
    .forEach(
      th => {

        th.addEventListener(
          "click",
          () => {

            sortFromHeader(
              th
            );

          }
        );

      }
    );


    mobileSortSelect
    .addEventListener(
      "change",
      () => {

        const value =
          mobileSortSelect.value;


        if (
          !value
        ) {

          currentView =
            getPageStocks();


          sortState = {

            key: null,

            direction: null

          };


          renderAll();


          updateDesktopSortIcons();


          return;

        }


        const [
          key,
          direction
        ] =
          value.split(
            ":"
          );


        const textKeys = [

          "Code",
          "Name",
          "Industry",
          "MarketName"

        ];


        const type =
          textKeys.includes(
            key
          )
            ? "text"
            : "number";


        applySort(
          key,
          direction,
          type
        );

      }
    );


    document
    .getElementById(
      "reloadBtn"
    )
    .addEventListener(
      "click",
      loadStocks
    );


    window.addEventListener(
      "hashchange",
      () => {

        const page =
          getInitialPage();


        if (
          page !==
          currentPage
        ) {

          setPage(
            page,
            false
          );

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          closeDrawer();

        }

      }
    );


    /* ========================================
       Init
    ======================================== */

    loadStocks();

  </script>
